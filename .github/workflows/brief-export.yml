name: Brief export

# W9 brief-chain plan 2026-09-11, Part 3 task 3.1: the export half of the injected-synthesis seam that
# plan's own header names as the one gap: "no existing path takes session-authored synthesis text."
# `export-corpus-for-extraction.mjs --with-pool-text` (this lane's own change to that script, see its
# header, "WITH-POOL-TEXT + CHAR-BUDGET") is the READ side: pull a batch of record-grade stub items' own
# stored claims/sections plus their FULL captured `agent_run_searches` pool text, split into char-budgeted
# parts, and hand the parts to a session lane so it authors real briefs from stored source material instead
# of re-fetching or inventing. This workflow is that runtime, given a dispatch for the first time; ADR-023's
# "a producer/exporter is not complete until it has a named runtime" applied here. Task 3.2 (record-briefs
# artifact contract) and 3.3/3.4 (the injected-synthesis seam plus apply driver) are this family's OTHER
# half, the write side, and are separate, not-yet-built lanes; this workflow only ever reads.
#
# NEW SMALL WORKFLOW, NOT population-turn.yml (the brief's stated preference, and the choice made here).
# population-turn.yml is the mint/apply/flywheel runtime for a completely different concern (minting NEW
# record rows from census candidates, then connecting them) with its own gate, chaining, and backlog modes
# already load-bearing for that family (see that file's own header). Bolting a THIRD, unrelated selection
# mode (record-grade STUB export for brief authoring) onto that job would couple two runtimes that share no
# state and complicate its already-wide "Resolve dispatch parameters" step for no shared benefit: this
# export is READ-ONLY (db.mjs's readClient() proxy throws on any write) and has nothing to gate against
# population-turn.yml's mint/flywheel invariants. A dedicated workflow keeps the blast radius of a dispatch
# mistake here (a bad --limit, a bad char-budget) contained to this one small job.
#
# TRANSPORT, reused verbatim from ledger-consume.yml's `export_candidates` mode (read that workflow's own
# header before changing this one): the exported part files land under `scripts/_snapshots/brief-export/`
# (gitignored everywhere else in this repo, root .gitignore line 64, so this is the one path here that
# must reach origin), pushed to a branch `brief-export/<run_id>` and opened as a PR via the SAME
# `scripts/turns/deliver-artifact-branch.sh` every other runtime workflow in this repo uses (falls back to
# a tracked issue comment, never a run failure, when the repository refuses Actions-created PRs), AND
# uploaded as a workflow artifact, belt and suspenders, matching ledger-consume.yml exactly.
#
# SELECTION. `ids` (comma-separated uuids) is authoritative when given: passed straight through as
# `--ids` to export-corpus-for-extraction.mjs, exactly as that script's own `--ids` contract already works
# for every other caller (corpus-turn.yml's ticket queue). When `ids` is blank, this run selects up to
# `limit` genuinely HOLLOW record-grade items itself: item_grade='record', provenance_status='verified',
# is_archived=false, id > after_id (if given, for paging past a prior batch), and (the "stub" part of this
# task's own name) every FACT claim the item carries is the [title] one (0 or 1 FACT, never more). This is
# the EXACT criterion scripts/maintenance/record-hollow-sweep.mjs's header documents and measured live at
# 551 candidates (2026-09-04); this workflow reuses that SAME read-only criterion (an inline, uncommitted
# selection script under scripts/tmp/, gitignored scratch, root .gitignore line 25, since it is a
# ten-line SELECT with no write side, not worth a tracked file) rather than that maintenance script's own
# `main()`, which ARCHIVES matches and is a completely different lane's write path, not reused here.
#
# GRADE, DECIDED (Fix round 1, minor (4)): `item_grade='record'` is hardcoded here, not exposed as an
# input. `item_grade` is a two-value vocabulary, `record` or `brief` (migration 278, `CHECK (item_grade IN
# ('record', 'brief'))`, default `brief`); a record-grade item upgrades to `brief` IN PLACE once it carries
# a full brief. So a `brief`-grade item, by construction, already went through synthesis (or was minted
# there directly) and is never a "stub" in this task's sense: the entire hollow-stub population this task
# exists to export for is record-grade by definition, and a `grade` input exposing `brief` as a choice
# would let a dispatch ask this auto-selector for stubs that structurally cannot exist. Chose "state it in
# the comment" over "expose an input" for this reason. If a third grade value is ever added, `--ids` (the
# other input this workflow already has) is the escape hatch: a coordinator routes around this hardcoded
# auto-selector by naming ids explicitly rather than this workflow guessing at a new grade's semantics.
#
# COST CLASS: $0, NO MODEL. export-corpus-for-extraction.mjs never calls an LLM or fetches a URL; it only
# reads already-stored rows (intelligence_items, section_claim_provenance, intelligence_item_sections,
# agent_run_searches) via db.mjs's read-only-guarded client. The selection script above is the same shape.
#
# BUILD MODE (CLAUDE.md rule 16): no `schedule:` block armed. workflow_dispatch stays for a hand-named
# ticket; a `workflow_run` edge (lane M4, 2026-09-20, build plan section 6.1 row M4, Amendment 1 section
# C) is EVENT CHAINING, not a schedule -- the same distinction corpus-turn.yml's own header draws for its
# own upstream edge.
#
# WIRED AT MINT (lane M4, 2026-09-20). [CONFIRMED by grep of brief-export.yml on master cc038a47] this
# workflow wrote NO harness artifact before this lane and had no upstream trigger -- the stage audit's
# own "Mint to brief chain" finding (docs/audits/stage-audit-2026-09-18/README.md). Two changes close
# that gap:
#   1. on.workflow_run fires this workflow after "Population turn" completes with conclusion success
#      (the job-level `if:` below, the SAME gate corpus-turn.yml / downstream-chain.yml already use).
#      On that trigger, inputs.* does not exist (GitHub Actions only populates it for workflow_dispatch),
#      so the "Resolve run parameters" step below normalizes RUN_* env vars from inputs.* when dispatched
#      by hand, or this file's own defaults (selection=record, limit=50, char_budget=3000000, ids blank
#      -- auto-select) when chained. Every later step reads RUN_*, never inputs.* directly, so both
#      trigger kinds share one code path.
#   2. A final step (scripts/turns/emit-brief-export-artifact.mjs, modeled on
#      emit-downstream-chain-artifact.mjs -- reuses writeRunArtifact/claimRunId/hashHarnessVersion, no
#      copy of the writer) writes this run's own committed scripts/harness-runs/brief-export/
#      brief-export-run-NNN.json, `if: always()`, so a chained firing that resolved zero ids still
#      leaves a record ("record it every batch, even when zero," MINT-RUNBOOK.md section 5). loop_run_id
#      is resolved through resolveLoopRunIdFromUpstream (scripts/lib/loop-run-id.mjs, lane M3b), upstream
#      name "Population turn" -- the ONE shared name-to-family map, never a second copy here.
#
# NOT BUILT BY THIS LANE (STOP condition named in the lane's own brief, docs/dispatches/lane-briefs/
# 2026-09-19/brief-m4.md, item 2 and its "Stop conditions" section): landing the export as a committed
# "batch skeleton" of owed entries on a `brief-lane/<loop_run_id>` branch. schema.mjs's
# validateRecordBriefsEntry requires a non-empty `body` (the full authored markdown), a `metadata` object
# that round-trips through the real parseAgentOutput, and a `claims[]` array with every FACT claim's
# source_span verbatim-checked against the item's pool text -- none of which an auto-export can honestly
# populate before a session lane has authored anything, and the schema has no "owed"/stub entry state at
# all. This is exactly the brief's own named stop condition ("the batch skeleton shape is not
# representable with the existing validator"): extending schema.mjs to accept an unauthored stub entry
# is a contract decision this lane does not make. This run still lands its existing part-file export
# (scripts/_snapshots/brief-export/, branch brief-export/<run_id>, unchanged by this lane) -- a session
# lane starts authoring from that export exactly as it did before this lane, per record-briefs/README.md
# step 1.
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, the
# same pair every guarded script in fsi-app/scripts/lib/db.mjs already requires; no new secret name.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Comma-separated intelligence_items.id list to export (passed as --ids); a quarantined item named here IS exported, not silently dropped (D1 fix, defect-fix-plan-2026-09-12.md, task 6.2d), so this is how a quarantined item reaches the brief-apply allow_brief_overwrite re-ground path. Leave blank to select up to `limit` hollow record-grade stub items automatically (item_grade=record, verified, live, every FACT claim is [title]-only, quarantined items never included by auto-selection): see this file''s header, "SELECTION".'
        required: false
        default: ''
        type: string
      limit:
        description: 'Max items this run exports (bounded runs, no unbounded sweeps). Applies whether ids is given or auto-selected.'
        required: false
        default: '50'
        type: string
      after_id:
        description: 'Auto-selection only (ids blank): resume past a prior batch, only items with id > after_id are considered. Ignored when ids is set.'
        required: false
        default: ''
        type: string
      selection:
        description: 'Auto-selection only (ids blank). hollow = record-grade items whose every FACT claim is the [title] one (the original stub definition; after the slot-claim mints and the 2026-09-12 retype almost none remain). record = every verified, live, record-grade item ordered by id (ADR-028: record grade is transit and every one of them needs a brief); this is the Part 6 batch population.'
        required: false
        default: 'record'
        type: choice
        options: [record, hollow]
      char_budget:
        description: 'Max characters per exported part file (passed as --char-budget). Default 3,000,000 matches the script''s own default.'
        required: false
        default: '3000000'
        type: string
  workflow_run:
    workflows: ["Population turn"]
    types: [completed]

concurrency:
  group: brief-export
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # deliver-artifact-branch.sh's fallback when PR creation is refused (see that script)

jobs:
  export:
    # Same gate corpus-turn.yml / downstream-chain.yml already use: a workflow_dispatch always proceeds;
    # a chained workflow_run only proceeds when the upstream run's own conclusion was success.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      # RESOLVE RUN PARAMETERS (lane M4, 2026-09-20): normalizes RUN_* env vars from inputs.* on a
      # workflow_dispatch, or this file's own defaults on a chained workflow_run (inputs.* does not exist
      # on that trigger at all -- GitHub Actions only populates it for workflow_dispatch). Every later
      # step reads RUN_*, never inputs.* directly, so both trigger kinds share one code path -- the same
      # normalize-once-then-read-RUN_* idiom corpus-turn.yml's own "This run's gates" step already uses.
      - name: Resolve run parameters
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_IDS=${{ inputs.ids }}" >> "$GITHUB_ENV"
            echo "RUN_SELECTION=${{ inputs.selection }}" >> "$GITHUB_ENV"
            echo "RUN_LIMIT=${{ inputs.limit }}" >> "$GITHUB_ENV"
            echo "RUN_AFTER_ID=${{ inputs.after_id }}" >> "$GITHUB_ENV"
            echo "RUN_CHAR_BUDGET=${{ inputs.char_budget }}" >> "$GITHUB_ENV"
            echo "RUN_UPSTREAM_NAME=" >> "$GITHUB_ENV"
            echo "RUN_UPSTREAM_RUN_ID=" >> "$GITHUB_ENV"
          else
            # Chained workflow_run firing: no operator-picked ids, no operator-picked limit -- this
            # file's own defaults (matching the workflow_dispatch input defaults above exactly).
            echo "RUN_IDS=" >> "$GITHUB_ENV"
            echo "RUN_SELECTION=record" >> "$GITHUB_ENV"
            echo "RUN_LIMIT=50" >> "$GITHUB_ENV"
            echo "RUN_AFTER_ID=" >> "$GITHUB_ENV"
            echo "RUN_CHAR_BUDGET=3000000" >> "$GITHUB_ENV"
            echo "RUN_UPSTREAM_NAME=${{ github.event.workflow_run.name }}" >> "$GITHUB_ENV"
            echo "RUN_UPSTREAM_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
            # loop-run-id.mjs's resolveLoopRunId matches an upstream artifact by config.github_run_id,
            # which writeRunArtifact stamps from GITHUB_RUN_ID -- for the UPSTREAM run, that is
            # github.event.workflow_run.id, which run-artifact.mjs's own convention reads from
            # GITHUB_EVENT_WORKFLOW_RUN_ID (see brief-apply.yml's identical stamp for its own
            # workflow_run consumers).
            echo "GITHUB_EVENT_WORKFLOW_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          fi

      - name: This run's gates
        run: |
          echo "trigger     = ${{ github.event_name }}"
          echo "ids         = $RUN_IDS (blank = auto-select record-grade items per selection)"
          echo "selection   = $RUN_SELECTION (auto-selection only: record = every verified live record-grade item; hollow = title-only stubs)"
          echo "limit       = $RUN_LIMIT"
          echo "after_id    = $RUN_AFTER_ID (auto-selection only)"
          echo "char_budget = $RUN_CHAR_BUDGET"
          echo "Read-only: db.mjs's readClient() proxy throws on any write; this run never mutates the database."

      # SELECTION (this file's own header), only when `ids` is blank. An uncommitted, gitignored
      # (scripts/tmp/, root .gitignore line 25) selection script: a ten-line SELECT reusing
      # record-hollow-sweep.mjs's own documented hollow criterion, never that script's `main()` (which
      # archives matches, a different lane's write path).
      - name: Auto-select hollow record-grade stub ids (only when ids is blank)
        id: select
        if: env.RUN_IDS == ''
        run: |
          mkdir -p scripts/tmp
          cat > scripts/tmp/select-record-stub-ids.mjs <<'EOF'
          // select-record-stub-ids.mjs: brief-export.yml's own inline selection (Part 3 task 3.1).
          // NOT a tracked script (gitignored scratch, fsi-app/scripts/tmp/); reuses
          // scripts/maintenance/record-hollow-sweep.mjs's own documented hollow criterion (every FACT claim
          // is the [title] one, i.e. fact_n === title_fact_n) as a plain read, never that script's main()
          // (which archives matches, a different lane, not reused here). Read-only: db.mjs's readClient()
          // proxy throws on any write.
          import { readAll } from "../lib/db.mjs";

          const limit = Number(process.env.SELECT_LIMIT || "50");
          const afterId = process.env.SELECT_AFTER_ID || "";
          // selection=record (default since 2026-09-12): the whole verified live record-grade population,
          // ordered by id, resumable with after_id. selection=hollow: the original title-only stub filter
          // below. Batch 2's first export (run 34690918567) found only 6 hollow items because the mint
          // now writes slot claims, while 1,091 record-grade items still need briefs (ADR-028).
          const selection = process.env.SELECT_SELECTION === "hollow" ? "hollow" : "record";

          let items = await readAll("intelligence_items", "id", {
            match: (q) => {
              // item_grade is hardcoded to 'record' by design, not a parameter: see this workflow's own
              // header, "GRADE, DECIDED", for why a brief-grade item can never be a stub in this sense.
              let qq = q.eq("item_grade", "record").eq("provenance_status", "verified").eq("is_archived", false);
              if (afterId) qq = qq.gt("id", afterId);
              return qq;
            },
          });
          items.sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));

          const ids = items.map((it) => it.id);
          const factCounts = new Map();
          const titleFactCounts = new Map();
          for (let i = 0; i < ids.length; i += 200) {
            const idChunk = ids.slice(i, i + 200);
            if (!idChunk.length) continue;
            const rows = await readAll("section_claim_provenance", "intelligence_item_id, claim_text", {
              match: (q) => q.in("intelligence_item_id", idChunk).eq("claim_kind", "FACT"),
            });
            for (const r of rows) {
              factCounts.set(r.intelligence_item_id, (factCounts.get(r.intelligence_item_id) || 0) + 1);
              if (typeof r.claim_text === "string" && r.claim_text.startsWith("[title]")) {
                titleFactCounts.set(r.intelligence_item_id, (titleFactCounts.get(r.intelligence_item_id) || 0) + 1);
              }
            }
          }
          const hollow = items.filter((it) => (factCounts.get(it.id) || 0) === (titleFactCounts.get(it.id) || 0));
          const population = selection === "hollow" ? hollow : items;
          const selected = population.slice(0, limit).map((it) => it.id);
          console.log(`select-record-stub-ids: selection=${selection}; ${items.length} record-grade candidate(s), ${hollow.length} hollow, ${selected.length} selected (limit ${limit}); last selected id ${selected[selected.length - 1] || "(none)"} for the next after_id.`);
          process.stdout.write(`SELECTED_IDS=${selected.join(",")}\n`);
          EOF
          SELECT_LIMIT="$RUN_LIMIT" SELECT_AFTER_ID="$RUN_AFTER_ID" SELECT_SELECTION="$RUN_SELECTION" node scripts/tmp/select-record-stub-ids.mjs | tee /tmp/select.log
          selected="$(grep '^SELECTED_IDS=' /tmp/select.log | tail -1 | cut -d= -f2-)"
          echo "ids=$selected" >> "$GITHUB_OUTPUT"
          if [ -z "$selected" ]; then
            echo "::warning::no record-grade items matched selection=$RUN_SELECTION (after_id=$RUN_AFTER_ID): the export step below will honestly export 0 items."
          fi

      - name: Resolve this run's --ids
        id: resolve
        run: |
          if [ -n "$RUN_IDS" ]; then
            echo "ids=$RUN_IDS" >> "$GITHUB_OUTPUT"
            echo "mode=explicit" >> "$GITHUB_OUTPUT"
          else
            echo "ids=${{ steps.select.outputs.ids }}" >> "$GITHUB_OUTPUT"
            echo "mode=auto" >> "$GITHUB_OUTPUT"
          fi
          echo "out_base=scripts/_snapshots/brief-export/export-${{ github.run_id }}.json" >> "$GITHUB_OUTPUT"

      - name: export-corpus-for-extraction.mjs --with-pool-text
        if: steps.resolve.outputs.ids != ''
        run: |
          node scripts/turns/export-corpus-for-extraction.mjs \
            --out "${{ steps.resolve.outputs.out_base }}" \
            --ids "${{ steps.resolve.outputs.ids }}" \
            --limit "$RUN_LIMIT" \
            --with-pool-text \
            --char-budget "$RUN_CHAR_BUDGET" \
            | tee /tmp/brief-export.log

      - name: No ids resolved, nothing to export
        if: steps.resolve.outputs.ids == ''
        run: |
          echo "brief-export: no ids (explicit or auto-selected), nothing exported this run."

      # Record this run's own harness-run artifact (brief-export family, lane M4, 2026-09-20), BEFORE the
      # commit step below so the SAME commit/PR carries both the export part-file (if any) and this run's
      # harness artifact -- one commit/PR per run, matching this workflow's own long-standing posture,
      # never two competing branches for one run's output. Always, even a fully-skipped/zero-id run --
      # "record it every batch, even when zero" (MINT-RUNBOOK.md section 5), the same posture
      # emit-downstream-chain-artifact.mjs's own caller (downstream-chain.yml) already holds.
      - name: Record this run's own harness-run artifact (brief-export family)
        if: always()
        env:
          BE_MODE: ${{ steps.resolve.outputs.mode }}
          BE_SELECTION: ${{ steps.resolve.outputs.mode == 'explicit' && 'explicit' || env.RUN_SELECTION }}
          BE_LIMIT: ${{ env.RUN_LIMIT }}
          BE_UPSTREAM_NAME: ${{ env.RUN_UPSTREAM_NAME }}
          BE_UPSTREAM_RUN_ID: ${{ env.RUN_UPSTREAM_RUN_ID }}
          BE_IDS: ${{ steps.resolve.outputs.ids }}
          # batch_path/branch record what THIS run actually produced (the existing part-file export and
          # its PR branch, set below) -- never the record-briefs batch-skeleton shape named in this
          # file's own header "NOT BUILT BY THIS LANE" note, which this lane does not build.
          BE_BATCH_PATH: ${{ steps.resolve.outputs.out_base }}
          BE_BRANCH: brief-export/${{ github.run_id }}
        run: node scripts/turns/emit-brief-export-artifact.mjs

      # ONE commit/PR for whatever this run produced (the export part file, when any, AND this run's own
      # harness artifact, always), same shape as ledger-consume.yml's own step of the same name (see that
      # workflow's own comment for exactly why: `git add -f` for a scripts/_snapshots/ path,
      # rebase-onto-master-before-push, deliver-artifact-branch.sh's PR-or-tracked-issue fallback).
      - name: Commit this run's exported part(s) and harness artifact, and open a PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ls scripts/_snapshots/brief-export/export-${{ github.run_id }}-part*.json >/dev/null 2>&1; then
            git add -f scripts/_snapshots/brief-export/export-${{ github.run_id }}-part*.json
          fi
          git add scripts/harness-runs/brief-export
          if git diff --cached --quiet; then
            echo "No exported part file or harness artifact to commit this run."
            exit 0
          fi
          branch="brief-export/${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "brief-export: run ${{ github.run_id }}, ids=${{ steps.resolve.outputs.ids }}"
          # Same BRANCH-BASE rebase every other runtime workflow in this repo does before pushing its
          # artifact branch (see population-turn.yml / ledger-consume.yml's own comment for the failure
          # this avoids: a workflow-file change landing on master mid-run).
          git fetch --no-tags --depth=50 origin master
          git rebase --autostash origin/master || { git rebase --abort; echo "::error::artifact commit does not rebase onto origin/master"; exit 1; }
          git push origin HEAD:"$branch"
          {
            printf 'Automated brief export (run %s, trigger %s).\n\n' "${{ github.run_id }}" "${{ github.event_name }}"
            printf 'ids: %s\nlimit: %s\nchar_budget: %s\n\n' "${{ steps.resolve.outputs.ids }}" "$RUN_LIMIT" "$RUN_CHAR_BUDGET"
            printf 'Lands: numbered, char-budgeted export part(s) under `scripts/_snapshots/brief-export/` (when ids resolved), and this run'"'"'s own harness-run artifact under `scripts/harness-runs/brief-export/` (every run, per MINT-RUNBOOK.md section 5). Each item carries its stored claims/sections plus its FULL captured agent_run_searches pool text (`pool: [{url, text}]`), for a session lane to author a brief from stored source material (Part 3 task 3.1 of the W9 brief-chain plan). A part flagged `oversize: true` carries exactly one item whose own size exceeds --char-budget, exported whole rather than truncated.\n'
          } > /tmp/pr-body.md
          bash scripts/turns/deliver-artifact-branch.sh "$branch" "Brief export: run ${{ github.run_id }}" /tmp/pr-body.md

      - name: Upload exported part(s) and run log as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-export-${{ github.run_id }}
          path: |
            fsi-app/scripts/_snapshots/brief-export/
            /tmp/brief-export.log
            /tmp/select.log
          if-no-files-found: ignore
          retention-days: 90
