name: Gate step attacks

# The CI steps that need the installed app, attacked for real (lane TESTS-2, 2026-10-10; CLAUDE.md rule 15, a guard is proven by
# attack, not by presence; docs/audits/aud-at5-gates-attacked-2026-10-08.md OWED-2 DS23 and DS24; docs/audits/
# aud-at4-gates-attacked-2026-10-08.md "F9 on the real app project").
#
# WHAT THIS PROVES. AUD-AT-5 and AUD-AT-4 attacked these steps as workflow text only, because the scratch clones carried no
# node_modules. This job has the install, so each step's own behaviour is attacked:
#   DS23  `npm ci` refuses a package.json that is not in sync with package-lock.json, and refuses a missing lockfile.
#   DS24  `npm run lint -- --max-warnings=0` (the exact command discipline.yml runs) exits non-zero for a WARNING, and for an error
#         even without the flag; a clean file passes. A lint step that cannot fail is not a gate.
#   F9    the real fitness function F9 (tsc --noEmit over the whole app) passes the clean checkout and is refused by one new source
#         file with a type error (scripts/verify/attacks/f9-real-project-attack.mjs). The static halves of F9 (a tsconfig exclude, a
#         @ts-nocheck directive) are attacked on the real tree by F9-real-project.test.mjs in the required suite.
# The two attack files are written into the disposable checkout and removed afterwards (the final step runs on failure too).
#
# NEVER TOUCHES PRODUCTION. No secret is referenced, `permissions` is contents: read, and nothing here connects to a database.
#
# TRIGGER. Every pull_request to master, no path filter (a path-filtered workflow that does not fire never reports a status). The job
# decides INSIDE itself whether the pull request touched the lockfile, the lint or compiler configuration, F9, the attack files or this
# workflow; a pull request that touched none passes in about a minute with every install step skipped.

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate-step-attacks:
    name: Gate step attacks (npm ci, ESLint, F9 on the real app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository (the merge commit and its base parent)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Did this pull request touch the install, the lint or compiler configuration, F9 or the attacks
        id: scope
        run: |
          if ! git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            echo "No merge parent found: treating the pull request as in scope (fail toward running)."
            echo "touched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED="$(git diff --name-only HEAD^1 HEAD -- fsi-app/package.json fsi-app/package-lock.json fsi-app/eslint.config.mjs fsi-app/tsconfig.json fsi-app/src fsi-app/.discipline/fitness/functions/F9-build-compiles.mjs fsi-app/scripts/verify/attacks .github/workflows/gate-step-attacks.yml .github/workflows/discipline.yml)"
          if [ -n "$CHANGED" ]; then
            echo "Files that put the gate step attacks in scope (names only):"
            echo "$CHANGED"
            echo "touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "touched=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Gate step attacks"
              echo "This pull request touches no install, lint, compiler or attack file, so the install and attack steps were skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Setup Node
        if: steps.scope.outputs.touched == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: DS23 control, npm ci on the clean tree installs
        if: steps.scope.outputs.touched == 'true'
        working-directory: fsi-app
        run: npm ci --prefer-offline --no-audit

      - name: DS23 attacks, npm ci refuses a package.json out of sync with the lockfile and a missing lockfile
        if: steps.scope.outputs.touched == 'true'
        working-directory: fsi-app
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/npm-ci-attack"
          rm -rf "$scratch"; mkdir -p "$scratch"
          cp package.json package-lock.json "$scratch"/
          cd "$scratch"
          # attack 1: a dependency added to package.json and not to the lockfile
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.dependencies={...(p.dependencies||{}),"left-pad":"1.3.0"};fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
          if npm ci --dry-run --ignore-scripts --no-audit --no-fund > out-sync.log 2>&1; then
            echo "ATTACK NOT REFUSED: npm ci accepted a package.json that is out of sync with the lockfile"; cat out-sync.log; exit 1
          fi
          grep -q "package.json and package-lock.json" out-sync.log || { echo "npm ci failed, but not for the sync reason:"; cat out-sync.log; exit 1; }
          # attack 2: no lockfile at all
          cp "$GITHUB_WORKSPACE/fsi-app/package.json" package.json
          rm -f package-lock.json
          if npm ci --dry-run --ignore-scripts --no-audit --no-fund > out-nolock.log 2>&1; then
            echo "ATTACK NOT REFUSED: npm ci accepted a missing lockfile"; cat out-nolock.log; exit 1
          fi
          grep -qi "package-lock.json" out-nolock.log || { echo "npm ci failed, but not for the lockfile reason:"; cat out-nolock.log; exit 1; }
          echo "npm ci refused both attacks."

      - name: DS24 control and attacks, the lint command from discipline.yml fails a warning and an error and passes a clean file
        if: steps.scope.outputs.touched == 'true'
        working-directory: fsi-app
        run: |
          set -uo pipefail
          # the attack files must not be in the tree when the compiler half of F9 runs next
          trap 'rm -f src/lib/__eslint_control.ts src/lib/__eslint_warning_attack.ts src/lib/__eslint_error_attack.ts' EXIT
          printf 'export const eslintControl = 1;\n' > src/lib/__eslint_control.ts
          printf 'export function eslintWarningAttack(): number {\n  const unusedAttackVariable = 1;\n  return 2;\n}\n' > src/lib/__eslint_warning_attack.ts
          printf 'export const eslintErrorAttack: any = 1;\n' > src/lib/__eslint_error_attack.ts
          npm run lint -- --max-warnings=0 src/lib/__eslint_control.ts || { echo "CONTROL FAILED: a clean file does not pass the lint command"; exit 1; }
          if npm run lint -- --max-warnings=0 src/lib/__eslint_warning_attack.ts; then
            echo "ATTACK NOT REFUSED: the lint command passes a file with a warning (max-warnings 0 is not gating)"; exit 1
          fi
          npm run lint -- src/lib/__eslint_warning_attack.ts || { echo "the warning attack was refused WITHOUT the flag, so the flag is not what gates it"; exit 1; }
          if npm run lint -- --max-warnings=0 src/lib/__eslint_error_attack.ts; then
            echo "ATTACK NOT REFUSED: the lint command passes a file with an error"; exit 1
          fi
          echo "The lint command refused both attacks and passed the control."

      - name: F9 on the real app, the clean tree passes and one type error is refused (the compiler half)
        if: steps.scope.outputs.touched == 'true'
        working-directory: fsi-app
        env:
          GATE_ATTACK_DISPOSABLE_CHECKOUT: '1'
        run: |
          set -o pipefail
          node scripts/verify/attacks/f9-real-project-attack.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the attack files
        if: always() && steps.scope.outputs.touched == 'true'
        working-directory: fsi-app
        run: rm -f src/lib/__eslint_control.ts src/lib/__eslint_warning_attack.ts src/lib/__eslint_error_attack.ts src/lib/__f9_attack_type_error.ts
