name: Source sweep

# INGESTION AT SCALE — the runtime `src/lib/sources/register-walk.mjs` (the date-paged EUR-Lex OJ /
# Federal Register index walk) and `src/lib/sources/feed-walk.mjs` (the RSS/Atom feed walk) never had.
# Both are PURE, dep-injected modules that were built, unit-tested, and left with zero live callers (F25
# module-liveness's LEGACY_ALLOWLIST carried both by name) — the same "correct but unrunnable" gap
# ADR-023 named for the data producers, closed here the same way: GitHub Actions, the two repository
# secrets `producers.yml` / `data-audit-lane.yml` already inject, dispatch-only, mode dry|apply.
#
# THIS DRIVER: `fsi-app/scripts/turns/run-source-sweep.mjs` — a thin binding (real `fetch`, a real
# `portal_link_candidates` ledger write, a real harness-run artifact) around the two unmodified walker
# modules. See that script's own header for exactly why it mirrors (rather than imports)
# `persistPortalCandidates`'s upsert contract. It ALWAYS records a `source-sweep` harness-run artifact
# (`scripts/harness-runs/source-sweep/`, `scripts/lib/run-artifact.mjs`'s convention), in both modes, from
# a `finally` block, so a walker that throws mid-run still leaves a record.
#
# "sitemap" walker (lane SITEMAP, 2026-09-04): the operator's "RSS where a site has it, otherwise the
# sitemap" pattern, over `src/lib/sources/sitemap-walk.mjs` (feed discovery first, sitemap fallback —
# ported in part from mreflow/control-center, MIT; see fsi-app/THIRD-PARTY-NOTICES.md). Unlike the other
# three walkers (which each attach to one FIXED or caller-named endpoint), "sitemap" sweeps EXISTING
# `sources` rows directly — `source_id` for one row, or `host` for every active row on that host — so it
# takes those in place of `from`/`to`/`feed_url`.
#
# DISPATCH-ONLY, DELIBERATELY. Unlike `corpus-turn.yml` (which also answers a `push` to `turn/**`), a
# source sweep has no equivalent "empty branch" request shape — every run names a specific walker and
# date window/feed the operator or coordinator chooses, so `workflow_dispatch` is the only trigger this
# family needs. No schedule is armed here either, under the same build-mode ruling every other workflow
# in this repo states for itself (operator ruling 2026-09-01):
#   schedule:
#     - cron: '0 8 * * 1'   # placeholder cadence only — the operator picks the real one at re-arm time
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY — the
# same pair every guarded script in fsi-app/scripts/lib/db.mjs already requires.

on:
  workflow_dispatch:
    inputs:
      walker:
        description: 'Which enumeration walk to run. "research" is a distinct subject (research-sweep.mjs, lane RSRCH 2026-09-02): a source-sweep over the research-source registry (sources.category = research), not a register/feed walk — it needs no from/to/feed_url. "sitemap" (lane SITEMAP 2026-09-04): feed discovery first, sitemap.xml fallback, over EXISTING sources rows named by source_id or host.'
        required: true
        type: choice
        options: [register-eurlex, register-federal-register, feed, research, sitemap]
      from:
        description: 'ISO date (register-eurlex / register-federal-register only). Required for those two walkers.'
        required: false
        type: string
      to:
        description: 'ISO date (register-eurlex / register-federal-register only). Required for those two walkers.'
        required: false
        type: string
      feed_url:
        description: 'Feed URL (feed walker only). Required when walker=feed.'
        required: false
        type: string
      source_id:
        description: 'sources.id (sitemap walker only). Exactly one of source_id/host is required when walker=sitemap.'
        required: false
        type: string
      host:
        description: 'Hostname (sitemap walker only) — sweeps every ACTIVE sources row on this host. Exactly one of source_id/host is required when walker=sitemap.'
        required: false
        type: string
      limit:
        description: 'Sitemap walker only: max scoped url entries diffed/persisted PER SOURCE this run (sitemap-walk.mjs default 5000 when left blank).'
        required: false
        type: string
      mode:
        description: 'dry = fetch, parse, print the plan, write nothing. apply = write through the guarded path.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
  # schedule:
  #   - cron: '0 8 * * 1'   # BUILD MODE (2026-09-01) — see header above; stays commented out until the
  #                          # operator explicitly re-arms it.

concurrency:
  group: source-sweep
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # deliver-artifact-branch.sh's fallback when PR creation is refused (see that script)

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      - name: Validate walker-specific required inputs
        run: |
          if [ "${{ inputs.walker }}" = "feed" ]; then
            if [ -z "${{ inputs.feed_url }}" ]; then
              echo "::error::--feed-url (feed_url input) is required when walker=feed."
              exit 1
            fi
          elif [ "${{ inputs.walker }}" = "research" ]; then
            : # research-sweep.mjs selects its own sources from the registry (sources.category='research')
            # and needs no from/to/feed_url -- nothing to validate here.
          elif [ "${{ inputs.walker }}" = "sitemap" ]; then
            if [ -z "${{ inputs.source_id }}" ] && [ -z "${{ inputs.host }}" ]; then
              echo "::error::source_id or host is required when walker=sitemap (exactly one)."
              exit 1
            fi
            if [ -n "${{ inputs.source_id }}" ] && [ -n "${{ inputs.host }}" ]; then
              echo "::error::source_id and host are mutually exclusive when walker=sitemap."
              exit 1
            fi
          else
            if [ -z "${{ inputs.from }}" ] || [ -z "${{ inputs.to }}" ]; then
              echo "::error::from/to date inputs are required for walker=${{ inputs.walker }}."
              exit 1
            fi
          fi

      - name: This run's gates
        run: |
          echo "trigger = ${{ github.event_name }}"
          echo "walker  = ${{ inputs.walker }}"
          echo "mode    = ${{ inputs.mode }}"
          echo "from/to = ${{ inputs.from }} .. ${{ inputs.to }}"
          echo "feed    = ${{ inputs.feed_url }}"

      # ── hydrate UNMERGED sibling artifacts so this run's run_id cannot collide ──────────────────────
      # claimRunId (scripts/lib/run-artifact.mjs) numbers the next artifact from the files it can see in
      # the checked-out tree, i.e. master. Artifacts land through a PR, so a run dispatched before the
      # previous run's PR merged sees a stale count and claims the SAME run_id (source-sweep run #3 on
      # 2026-09-01 wrote a second "source-sweep-run-002" while run #2's was still on its branch). The
      # unmerged sibling branches are fetched and their source-sweep artifacts placed in the working tree
      # (untracked; removed again before the commit step, never committed by this run) so the claim
      # counts above them.
      - name: Hydrate unmerged source-sweep artifacts from sibling branches (run_id collision guard)
        run: |
          git fetch --no-tags origin '+refs/heads/source-sweep/*:refs/remotes/origin/source-sweep/*' || true
          : > /tmp/hydrated-artifacts.txt
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/source-sweep/*'); do
            for f in $(git ls-tree -r --full-tree --name-only "$b" -- fsi-app/scripts/harness-runs/source-sweep/); do
              rel="${f#fsi-app/}"
              if [ ! -e "$rel" ]; then
                mkdir -p "$(dirname "$rel")"
                git show "$b:$f" > "$rel"
                echo "$rel" >> /tmp/hydrated-artifacts.txt
              fi
            done
          done
          echo "hydrated $(wc -l < /tmp/hydrated-artifacts.txt) unmerged source-sweep file(s) from sibling branches"

      - name: run-source-sweep.mjs
        if: ${{ inputs.walker != 'research' }}
        run: |
          args=(--walker "${{ inputs.walker }}" --mode "${{ inputs.mode }}")
          if [ "${{ inputs.walker }}" = "feed" ]; then
            args+=(--feed-url "${{ inputs.feed_url }}")
          elif [ "${{ inputs.walker }}" = "sitemap" ]; then
            if [ -n "${{ inputs.source_id }}" ]; then args+=(--source-id "${{ inputs.source_id }}"); fi
            if [ -n "${{ inputs.host }}" ]; then args+=(--host "${{ inputs.host }}"); fi
            if [ -n "${{ inputs.limit }}" ]; then args+=(--limit "${{ inputs.limit }}"); fi
          else
            args+=(--from "${{ inputs.from }}" --to "${{ inputs.to }}")
          fi
          node scripts/turns/run-source-sweep.mjs "${args[@]}"

      # research-sweep.mjs (lane RSRCH, 2026-09-02): a SUBJECT of this same source-sweep family, not
      # another walker -- it selects its own sources from the registry (sources.category='research') and
      # takes no --from/--to/--feed-url. Writes its harness-run artifact into the SAME
      # scripts/harness-runs/source-sweep/ directory the step above does (see that script's own header),
      # so the commit-and-PR step below needs no change to pick it up.
      - name: research-sweep.mjs
        if: ${{ inputs.walker == 'research' }}
        run: node scripts/turns/research-sweep.mjs --mode "${{ inputs.mode }}"

      # Commit the family's own harness-run artifact (scripts/harness-runs/source-sweep/**) so the run
      # this dispatch produced survives past the Actions log — same posture corpus-turn.yml applies to
      # discover-for-items/forward-events. A dispatch normally runs against master, which is typically
      # branch-protected, so this lands on its own branch and opens a PR (corpus-turn.yml's own pattern)
      # rather than pushing straight to whatever ref triggered the run.
      - name: Remove hydrated sibling artifacts (they belong to their own branches)
        if: always()
        run: |
          if [ -s /tmp/hydrated-artifacts.txt ]; then xargs -a /tmp/hydrated-artifacts.txt rm -f; fi
          rm -rf scripts/harness-runs/*/.claims

      - name: Commit the source-sweep harness-run artifact and open a PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/harness-runs/source-sweep
          if git diff --cached --quiet; then
            echo "No new source-sweep artifact to commit."
            exit 0
          fi
          branch="source-sweep/${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "source-sweep ${{ inputs.mode }}: ${{ inputs.walker }} run ${{ github.run_id }}"
          git push origin HEAD:"$branch"
          printf 'Automated source sweep (run %s).\n\nWalker: %s\nMode: %s\nFrom/to: %s .. %s\nFeed: %s\nSource id/host: %s / %s\nLimit: %s\n\nLands the harness-run artifact for this sweep under scripts/harness-runs/source-sweep/.\n' \
            "${{ github.run_id }}" "${{ inputs.walker }}" "${{ inputs.mode }}" "${{ inputs.from }}" "${{ inputs.to }}" "${{ inputs.feed_url }}" "${{ inputs.source_id }}" "${{ inputs.host }}" "${{ inputs.limit }}" > /tmp/pr-body.md
          bash scripts/turns/deliver-artifact-branch.sh "$branch" "Source sweep: ${{ inputs.walker }} (mode=${{ inputs.mode }}, run ${{ github.run_id }})" /tmp/pr-body.md

      - name: Upload scripts/_snapshots as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-sweep-snapshots-${{ github.run_id }}
          path: fsi-app/scripts/_snapshots/
          if-no-files-found: ignore
          retention-days: 90
