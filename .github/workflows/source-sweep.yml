name: Source sweep

# INGESTION AT SCALE — the runtime `src/lib/sources/register-walk.mjs` (the date-paged EUR-Lex OJ /
# Federal Register index walk) and `src/lib/sources/feed-walk.mjs` (the RSS/Atom feed walk) never had.
# Both are PURE, dep-injected modules that were built, unit-tested, and left with zero live callers (F25
# module-liveness's LEGACY_ALLOWLIST carried both by name) — the same "correct but unrunnable" gap
# ADR-023 named for the data producers, closed here the same way: GitHub Actions, the two repository
# secrets `producers.yml` / `data-audit-lane.yml` already inject, dispatch-only, mode dry|apply.
#
# THIS DRIVER: `fsi-app/scripts/turns/run-source-sweep.mjs` — a thin binding (real `fetch`, a real
# `portal_link_candidates` ledger write, a real harness-run artifact) around the two unmodified walker
# modules. See that script's own header for exactly why it mirrors (rather than imports)
# `persistPortalCandidates`'s upsert contract. It ALWAYS records a `source-sweep` harness-run artifact
# (`scripts/harness-runs/source-sweep/`, `scripts/lib/run-artifact.mjs`'s convention), in both modes, from
# a `finally` block, so a walker that throws mid-run still leaves a record.
#
# "sitemap" walker (lane SITEMAP, 2026-09-04): the operator's "RSS where a site has it, otherwise the
# sitemap" pattern, over `src/lib/sources/sitemap-walk.mjs` (feed discovery first, sitemap fallback —
# ported in part from mreflow/control-center, MIT; see fsi-app/THIRD-PARTY-NOTICES.md). Unlike the other
# three walkers (which each attach to one FIXED or caller-named endpoint), "sitemap" sweeps EXISTING
# `sources` rows directly — `source_id` for one row, or `host` for every active row on that host — so it
# takes those in place of `from`/`to`/`feed_url`.
#
# DISPATCH-ONLY, DELIBERATELY. Unlike `corpus-turn.yml` (which also answers a `push` to `turn/**`), a
# source sweep has no equivalent "empty branch" request shape — every run names a specific walker and
# date window/feed the operator or coordinator chooses, so `workflow_dispatch` is the only trigger this
# family needs. No schedule is armed here either, under the same build-mode ruling every other workflow
# in this repo states for itself (operator ruling 2026-09-01):
#   schedule:
#     - cron: '0 8 * * 1'   # placeholder cadence only — the operator picks the real one at re-arm time
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY — the
# same pair every guarded script in fsi-app/scripts/lib/db.mjs already requires.

on:
  workflow_dispatch:
    inputs:
      walker:
        description: 'Which enumeration walk to run. "research" is a distinct subject (research-sweep.mjs, lane RSRCH 2026-09-02): a source-sweep over the research-source registry (sources.category = research), not a register/feed walk — it needs no from/to/feed_url. "sitemap" (lane SITEMAP 2026-09-04): feed discovery first, sitemap.xml fallback, over EXISTING sources rows named by source_id, host, or all_hosts (lane SITEMAP-3, 2026-09-04 — the backfill mode); or a read-only check_coverage report.'
        required: true
        type: choice
        options: [register-eurlex, register-federal-register, feed, research, sitemap]
      from:
        description: 'ISO date (register-eurlex / register-federal-register only). Required for those two walkers.'
        required: false
        type: string
      to:
        description: 'ISO date (register-eurlex / register-federal-register only). Required for those two walkers.'
        required: false
        type: string
      lineage_targets:
        description: 'register-eurlex only (lane G5-NEED, 2026-10-07): instead of a from/to date walk, run the lineage-gap-targets report inline first (report only, never writes, never resolves a flag) and pass its lineage-gap-targets.json to the walker as explicit targets (--targets-file): each CELEX id of an absent lineage parent becomes its EUR-Lex text URL in the portal_link_candidates ledger, no fetch. Non-CELEX identifiers are skipped here (raise-term-needs turns them into term-need standards). from/to are not required when this is set. mode stays dry by default.'
        required: false
        type: boolean
        default: false
      feed_url:
        description: 'Feed URL (feed walker only). Required when walker=feed.'
        required: false
        type: string
      source_id:
        description: 'sources.id (sitemap walker only). Exactly one of source_id/host/all_hosts is required when walker=sitemap (unless check_coverage is set).'
        required: false
        type: string
      host:
        description: 'Hostname (sitemap walker only) — sweeps every ACTIVE sources row on this host. Exactly one of source_id/host/all_hosts is required when walker=sitemap (unless check_coverage is set).'
        required: false
        type: string
      all_hosts:
        description: 'Sitemap walker only (lane SITEMAP-3, 2026-09-04): sweep the thinnest-covered ACTIVE hosts (never-walked first, then oldest sitemap_last_walked_at), up to max_hosts per run — the backfill mode for all 2,563 sources without naming one host/id per dispatch. Exactly one of source_id/host/all_hosts is required when walker=sitemap (unless check_coverage is set).'
        required: false
        type: boolean
        default: false
      max_hosts:
        description: 'Sitemap walker + all_hosts only: max distinct hosts to walk this run (run-source-sweep.mjs default 40 when left blank — see DEFAULT_MAX_HOSTS for the arithmetic it was derived from; ~16 dispatches at the default cover all 646 active hosts once). A CEILING on how many hosts one dispatch is willing to attempt, never a floor — time_budget_seconds below is what actually stops the run inside timeout-minutes: 30 (lane SWEEP-BUDGET, 2026-09-04: max_hosts alone let sweep #16, 70 hosts, run past the job timeout and get killed with NO artifact).'
        required: false
        type: string
      time_budget_seconds:
        description: 'Sitemap walker only (lane SWEEP-BUDGET, 2026-09-04): wall-clock hard stop for the source-selection loop (--source-id/--host/--all-hosts alike) — checked before every source, run-source-sweep.mjs default 1500s (1800s job timeout minus a 300s non-walk reserve) when left blank. On exhaustion the run still exits 0 and its artifact records budget_seconds/elapsed_seconds/sources_walked/sources_not_reached/budget_exhausted — a bounded, complete unit of work, not an error.'
        required: false
        type: string
      check_coverage:
        description: 'Sitemap walker only: read-only report (sources total, active total, walked/unwalked, by outcome, feeds populated) — no walk, no write. Refuses alongside source_id/host/all_hosts; requires mode=dry.'
        required: false
        type: boolean
        default: false
      limit:
        description: 'Sitemap walker only: max scoped url entries diffed/persisted PER SOURCE this run (sitemap-walk.mjs default 5000 when left blank).'
        required: false
        type: string
      mode:
        description: 'dry = fetch, parse, print the plan, write nothing. apply = write through the guarded path.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      loop_run_id:
        description: 'Lane M1 (2026-09-18, build plan section 6.1 row M1): the loop-wide run id this sweep and its downstream hops (fetch-drain, ...) carry forward, so a proof run (build plan section 6.2) can find every hop''s artifact by one shared id. Leave blank (the default) to use this workflow''s own github.run_id.'
        required: false
        type: string
  # schedule:
  #   - cron: '0 8 * * 1'   # BUILD MODE (2026-09-01) — see header above; stays commented out until the
  #                          # operator explicitly re-arms it.

concurrency:
  group: source-sweep
  cancel-in-progress: false

permissions:
  contents: read # lane STATUTORY-WRITER, 2026-09-29: no git commit/branch/push/PR any more

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      - name: Validate walker-specific required inputs
        run: |
          if [ "${{ inputs.walker }}" = "feed" ]; then
            if [ -z "${{ inputs.feed_url }}" ]; then
              echo "::error::--feed-url (feed_url input) is required when walker=feed."
              exit 1
            fi
          elif [ "${{ inputs.walker }}" = "research" ]; then
            : # research-sweep.mjs selects its own sources from the registry (sources.category='research')
            # and needs no from/to/feed_url -- nothing to validate here.
          elif [ "${{ inputs.walker }}" = "sitemap" ]; then
            if [ "${{ inputs.check_coverage }}" = "true" ]; then
              if [ -n "${{ inputs.source_id }}" ] || [ -n "${{ inputs.host }}" ] || [ "${{ inputs.all_hosts }}" = "true" ]; then
                echo "::error::check_coverage is read-only and takes no selector — source_id/host/all_hosts are refused alongside it."
                exit 1
              fi
              if [ "${{ inputs.mode }}" != "dry" ]; then
                echo "::error::check_coverage never writes — set mode=dry (there is nothing for mode=apply to do)."
                exit 1
              fi
            else
              selectors=0
              [ -n "${{ inputs.source_id }}" ] && selectors=$((selectors + 1))
              [ -n "${{ inputs.host }}" ] && selectors=$((selectors + 1))
              [ "${{ inputs.all_hosts }}" = "true" ] && selectors=$((selectors + 1))
              if [ "$selectors" -ne 1 ]; then
                echo "::error::exactly one of source_id, host, or all_hosts is required when walker=sitemap."
                exit 1
              fi
            fi
          elif [ "${{ inputs.lineage_targets }}" = "true" ]; then
            if [ "${{ inputs.walker }}" != "register-eurlex" ]; then
              echo "::error::lineage_targets is an explicit-target mode for walker=register-eurlex only."
              exit 1
            fi
          else
            if [ -z "${{ inputs.from }}" ] || [ -z "${{ inputs.to }}" ]; then
              echo "::error::from/to date inputs are required for walker=${{ inputs.walker }}."
              exit 1
            fi
          fi

      # loop_run_id (lane M1, 2026-09-18, build plan section 6.1 row M1): defaults to this workflow's own
      # github.run_id when the dispatch input is left blank, so a manual dispatch (no downstream chain
      # naming one) still gets a real, unique loop identifier rather than an empty string.
      - name: Resolve loop_run_id
        id: loop
        run: |
          loop_run_id="${{ inputs.loop_run_id }}"
          if [ -z "$loop_run_id" ]; then loop_run_id="${{ github.run_id }}"; fi
          echo "loop_run_id=$loop_run_id" >> "$GITHUB_OUTPUT"

      - name: This run's gates
        run: |
          echo "trigger      = ${{ github.event_name }}"
          echo "walker       = ${{ inputs.walker }}"
          echo "mode         = ${{ inputs.mode }}"
          echo "from/to      = ${{ inputs.from }} .. ${{ inputs.to }}"
          echo "feed         = ${{ inputs.feed_url }}"
          echo "lineage      = lineage_targets=${{ inputs.lineage_targets }}"
          echo "sitemap      = source_id=${{ inputs.source_id }} host=${{ inputs.host }} all_hosts=${{ inputs.all_hosts }} max_hosts=${{ inputs.max_hosts }} time_budget_seconds=${{ inputs.time_budget_seconds }} check_coverage=${{ inputs.check_coverage }}"
          echo "loop_run_id  = ${{ steps.loop.outputs.loop_run_id }}"

      # lineage-gap-targets (lane G5-NEED, 2026-10-07, rule 17): the producer of lineage-gap-targets.json
      # had no consumer. The maintenance-step artifact of an earlier run is not reachable from this workflow
      # (each workflow run keeps its own artifacts), so the report is produced HERE, inline, as the first
      # step, in report mode (--mode dry: reads integrity_flags and the corpus, writes only the JSON file,
      # resolves no flag), and the sweep step below reads that file.
      - name: lineage-gap-targets (report) for explicit EUR-Lex targets
        if: ${{ inputs.walker == 'register-eurlex' && inputs.lineage_targets }}
        run: |
          mkdir -p "$RUNNER_TEMP/lineage-gap-targets"
          node scripts/maintenance/lineage-gap-targets.mjs --mode dry --out "$RUNNER_TEMP/lineage-gap-targets"

      - name: run-source-sweep.mjs
        if: ${{ inputs.walker != 'research' }}
        env:
          LOOP_RUN_ID: ${{ steps.loop.outputs.loop_run_id }}
        run: |
          args=(--walker "${{ inputs.walker }}" --mode "${{ inputs.mode }}")
          if [ "${{ inputs.walker }}" = "feed" ]; then
            args+=(--feed-url "${{ inputs.feed_url }}")
          elif [ "${{ inputs.walker }}" = "sitemap" ]; then
            if [ "${{ inputs.check_coverage }}" = "true" ]; then
              args+=(--check-coverage)
            else
              if [ -n "${{ inputs.source_id }}" ]; then args+=(--source-id "${{ inputs.source_id }}"); fi
              if [ -n "${{ inputs.host }}" ]; then args+=(--host "${{ inputs.host }}"); fi
              if [ "${{ inputs.all_hosts }}" = "true" ]; then args+=(--all-hosts); fi
              if [ -n "${{ inputs.max_hosts }}" ]; then args+=(--max-hosts "${{ inputs.max_hosts }}"); fi
              if [ -n "${{ inputs.time_budget_seconds }}" ]; then args+=(--time-budget-seconds "${{ inputs.time_budget_seconds }}"); fi
            fi
            if [ -n "${{ inputs.limit }}" ]; then args+=(--limit "${{ inputs.limit }}"); fi
          elif [ "${{ inputs.walker }}" = "register-eurlex" ] && [ "${{ inputs.lineage_targets }}" = "true" ]; then
            args+=(--targets-file "$RUNNER_TEMP/lineage-gap-targets/lineage-gap-targets.json")
          else
            args+=(--from "${{ inputs.from }}" --to "${{ inputs.to }}")
          fi
          node scripts/turns/run-source-sweep.mjs "${args[@]}"

      # research-sweep.mjs (lane RSRCH, 2026-09-02): a SUBJECT of this same source-sweep family, not
      # another walker -- it selects its own sources from the registry (sources.category='research') and
      # takes no --from/--to/--feed-url. Writes its harness-run artifact into the SAME
      # scripts/harness-runs/source-sweep/ directory the step above does (see that script's own header),
      # so the commit-and-PR step below needs no change to pick it up.
      - name: research-sweep.mjs
        if: ${{ inputs.walker == 'research' }}
        run: node scripts/turns/research-sweep.mjs --mode "${{ inputs.mode }}"

      # Commit the family's own harness-run artifact (scripts/harness-runs/source-sweep/**) so the run
      # this dispatch produced survives past the Actions log — same posture corpus-turn.yml applies to
      # discover-for-items/forward-events. A dispatch normally runs against master, which is typically
      # branch-protected, so this lands on its own branch and opens a PR (corpus-turn.yml's own pattern)
      # rather than pushing straight to whatever ref triggered the run.
      - name: Remove run-id claim markers (nothing is hydrated from sibling branches any more)
        if: always()
        run: |
          rm -rf scripts/harness-runs/*/.claims

      - name: Land the source-sweep harness-run artifact into harness_runs
        if: always()
        run: bash scripts/turns/deliver-artifact-branch.sh "Source sweep (walker=${{ inputs.walker }}, mode=${{ inputs.mode }}, run ${{ github.run_id }})"

      # R22 (2026-10-01, Actions-storage remediation): narrowed from the whole fsi-app/scripts/_snapshots/
      # tree (guarded-write snapshots, regenerable per CLAUDE.md rule 5) to this run's own harness
      # artifact. Retention 7 days, down from 90. See docs/runbooks/fleet-budget-control.md.
      - name: Upload this run's harness artifact as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-sweep-${{ github.run_id }}
          path: fsi-app/scripts/harness-runs/source-sweep/
          if-no-files-found: ignore
          retention-days: 7
