name: Bug-class guard

# The non-answer -> definitive-answer bug class, wired into CI so the pattern cannot
# reintroduce unflagged. TWO tiers, deliberately:
#   HARD  — the discrimination selftests (deterministic; 11/11 + 6/6 + the SSOT units). A
#           regression here means the detector lost discrimination or a fixed SSOT regressed.
#           This job FAILS the build.
#   SOFT  — the repo-wide scans (inconclusive-report + type-consumer-probe). These flag
#           CANDIDATES for review and are REPORT-ONLY (exit 0) because the lexicon still has
#           documented false-positive classes; a hard-fail on a noisy detector would train
#           people to bypass it. Read the job log; new live CANDIDATE_CORRUPT is a review signal.
# When the lexicon is hardened (false-positive classes eliminated), promote the soft scan to a
# diff-gate (fail only on NEW candidates vs the merge base).

# MASTER PUSH RUNS AGAIN (2026-10-11, CI-MIN-1 addendum, ADR-047). CI-MIN-0 removed the push trigger because strict
# branch protection made the pull_request run the exact merge result. The operator ruled on 2026-10-11 that master
# protection no longer requires an up-to-date branch, so a pull_request run no longer validates what lands and a
# push to master runs this workflow again. A master push run is never cancelled (the concurrency group below keys a
# push on its ref and cancels only pull_request runs). A dispatch trigger is deliberately not added.
#
# SCOPED JOBS (CI-MIN-1, ADR-047 decision 5). On a pull_request the `inputs` job classifies the diff
# (fsi-app/.discipline/governance/job-inputs.mjs, the one classifier) and a job whose inputs are untouched is
# skipped at job level; a skipped required context satisfies branch protection, a path-filtered workflow does not.
# On a push every job runs.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# COST CONTROL (2026-08-12). Same reasoning as discipline.yml: supersede obsolete
# pull_request runs, never cancel a master validation. The group key embeds
# github.workflow, so this workflow and discipline.yml occupy SEPARATE groups and
# cannot cancel each other — a shared key would drop real coverage rather than waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    name: Inputs (which scoped jobs this change touches)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      discrimination_guard: ${{ steps.classify.outputs.discrimination_guard }}
      bug_class_scan: ${{ steps.classify.outputs.bug_class_scan }}
    steps:
      - name: Checkout (the merge commit and its base parent)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Classify the touched scoped jobs
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node fsi-app/.discipline/governance/job-inputs.mjs --pr-merge --github-output
          else
            node fsi-app/.discipline/governance/job-inputs.mjs --all --github-output
          fi

  discrimination-guard:
    name: HARD — detector discrimination + SSOT units
    needs: inputs
    if: github.event_name != 'pull_request' || needs.inputs.outputs.discrimination_guard == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fsi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: fsi-app/package-lock.json
      # The detector rides the surface registry -> drift-check.mjs -> imports `typescript`, so the
      # selftests need node_modules on a fresh CI checkout (same reason discipline.yml installs).
      - name: Install deps
        run: npm ci --prefer-offline --no-audit
      - name: Detector + SSOT selftests (must pass)
        run: |
          node --test \
            scripts/lib/inconclusive-probe.npmtest.mjs \
            scripts/lib/type-consumer-probe.selftest.mjs \
            scripts/lib/reachability.selftest.mjs \
            scripts/lib/entity-gate.selftest.mjs \
            scripts/lib/fetch-now-decision.selftest.mjs \
            scripts/lib/check-sources-decision.selftest.mjs \
            scripts/lib/verification-decision.selftest.mjs \
            scripts/lib/error-drop-probe.selftest.mjs

  bug-class-scan:
    name: SOFT — bug-class repo scan (review signal, never fails the build)
    needs: inputs
    if: github.event_name != 'pull_request' || needs.inputs.outputs.bug_class_scan == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fsi-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: fsi-app/package-lock.json
      - name: Install deps
        run: npm ci --prefer-offline --no-audit
      - name: Non-answer -> definitive scan (forms 1-4) — report only
        run: node scripts/lib/inconclusive-report.mjs . || true
      - name: Unguarded type-consumer scan (item_type migration precondition) — report only
        run: node scripts/lib/type-consumer-probe.mjs . || true
      - name: Supabase error-drop scan (const { data } without error) — report only
        run: node scripts/lib/error-drop-probe.mjs . || true
      # Duplicate migration-prefix scan (2026-08-08). REPORT-ONLY BY DOCTRINE,
      # not by noise: the 2026-08-02 retraction (session-log) verified Supabase
      # applies by timestamp — duplicate prefixes are cosmetic, renaming applied
      # migrations is harmful, so this must never gate a merge. It surfaces
      # accidental double-claims of the next free number while they are still
      # pre-apply and safely renameable.
      - name: Duplicate migration-prefix scan — report only
        run: node scripts/verify/migration-number-collision.mjs || true
