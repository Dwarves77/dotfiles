name: Live smoke

# What a signed-in customer actually receives is checked by a gate, not by a person (lane GATES-2,
# 2026-10-05). Four defects were visible on production that no automated check caught: raw ledger JSON
# rendered as text, a 1108px theme strip on a 375px screen, raw tag slugs and bare scores in the theme
# analysis card, a source row showing two tiers. The rendering guard mounts fixtures and never sees stored
# data; this job loads the real pages of a real deployment, READ-ONLY, and asserts named invariants over them.
#
# Triggers
#   deployment_status   a Vercel deployment to the Production environment reported success. The target is the
#                       event's environment_url. (GitHub runs a deployment_status workflow from the default
#                       branch's copy of this file.) PREVIEWS ARE EXCLUDED until a Vercel protection bypass
#                       exists: a protected preview answers with Vercel's own login page, so every preview run
#                       would fail as session-invalid and teach people to ignore the check. A preview can still
#                       be checked by hand with workflow_dispatch.
#   workflow_dispatch   on demand, with a `url` input (https, carosledge.com or a *.vercel.app deployment).
#
# Required repository secrets (names registered in .discipline/governance/secrets-registry.mjs; never printed):
#   LIVE_SMOKE_EMAIL     the email of a dedicated READ-ONLY smoke account (a normal customer login).
#   LIVE_SMOKE_PASSWORD  that account's password.
# With either unset the job stops in its first step with a named message, before any install.
#
# What it visits (at 1440x900 and 375x812): the dashboard, the four list pages, the first item on each list,
# the item the first theme chip links to, and (lane SMOKE-3) the items the live data names as carrying each
# conditional element (live-candidates.mjs). Invariants live in
# fsi-app/.discipline/rendering/live/live-assertions.mjs; the phone-width scroll-container rule is the SAME
# module the rendering guard imports (fsi-app/.discipline/rendering/overflow-rule.mjs).
#
# NOT A REQUIRED CHECK YET. To make it one, all of these must be true: (1) both secrets exist and the smoke
# account signs in on production; (2) three consecutive green runs on master, the same stability bar the
# rendering-guard job in discipline.yml states; (3) an admin adds the job name "Live smoke" to the branch
# protection required-check set. Until then a red run is a visible signal, not a merge block. The job has
# no continue-on-error: a failure is red on its own run, it simply is not in the required set.
#
# No npm ci step: the runner imports only relative modules and Playwright (installed here with --no-save,
# the same way the rendering-guard job does), so a dependency install would add minutes and no coverage.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'Deployment to check, https only (for example https://carosledge.com)'
        required: true
        type: string
      repeat:
        description: 'Visits of the home page at 375px, each in a fresh context (diagnostic for an intermittent hydration error; the evidence is written into the report)'
        required: false
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: live-smoke-${{ github.event.inputs.url || github.event.deployment_status.environment_url || github.run_id }}
  cancel-in-progress: true

jobs:
  live-smoke:
    name: Live smoke
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production' && github.event.deployment_status.environment_url != '')
    runs-on: ubuntu-latest
    # Same container as the rendering-guard job in discipline.yml (lane GATE-6, 2026-10-08): chromium and its
    # OS libraries come from the image, so no browser install runs. The tag is the ONE place the Playwright
    # version is written in this file; the install step reads it back out of this file.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Trust the workspace for git (the container user does not own the checkout)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Note the start time
        run: echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Preflight (secrets and target, fails fast, nothing installed yet)
        env:
          LIVE_SMOKE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url }}
          LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
          LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
        run: node fsi-app/.discipline/rendering/live/live-smoke.mjs --preflight

      - name: Install the Playwright npm package matching the image (browsers come from the image)
        run: |
          version="$(sed -n 's|^ *image: mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*$|\1|p' .github/workflows/live-smoke.yml)"
          test -n "$version"
          echo "playwright npm package: $version"
          cd fsi-app
          npm install --no-save "playwright@${version}" --no-audit --no-fund

      # Conditional invariants are chosen FROM LIVE DATA (lane SMOKE-3, 2026-10-10). This step asks the database, read-only
      # through the service client, which customer-visible items SHOULD carry each conditional element (an inference, a
      # record grade, a source with bias tags), prints the count and up to three paths per class, and writes them to a
      # file the browser step reads. The browser step itself carries NO database credential. Zero candidates for a class
      # is a named HOLD in the report (absent data is expected during the population hold); any candidate makes the
      # invariant a hard FAIL if its element is missing from a candidate page. Without database credentials this step
      # writes an UNRESOLVED file and exits 0 (an unresolved HOLD, never a pass); with credentials a failed read exits 1.
      - name: Resolve conditional-invariant candidates from live data (read-only)
        working-directory: fsi-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LIVE_SMOKE_CANDIDATES: ${{ runner.temp }}/live-smoke-candidates.json
        run: node .discipline/rendering/live/live-candidates.mjs

      - name: Run live smoke (read-only, two viewports)
        working-directory: fsi-app
        env:
          LIVE_SMOKE_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url }}
          LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
          LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
          LIVE_SMOKE_REPORT: ${{ runner.temp }}/live-smoke-report.json
          LIVE_SMOKE_CANDIDATES: ${{ runner.temp }}/live-smoke-candidates.json
          LIVE_SMOKE_REPEAT: ${{ github.event.inputs.repeat || '1' }}
        run: node .discipline/rendering/live/live-smoke.mjs

      # Record this family's harness-run artifact on EVERY firing, including one that failed before it produced a
      # report (the artifact then says report_missing, never a clean run), then land it into harness_runs so the
      # closure gate has dispatch evidence. The landing step self-skips without database credentials.
      - name: Record this run's harness-run artifact (live-smoke family)
        if: always()
        working-directory: fsi-app
        env:
          LS_REPORT: ${{ runner.temp }}/live-smoke-report.json
          LS_STARTED_AT: ${{ env.STARTED_AT }}
          LS_URL: ${{ github.event.inputs.url || github.event.deployment_status.environment_url }}
        run: node scripts/turns/emit-live-smoke-artifact.mjs

      - name: Land the live-smoke harness-run artifact into harness_runs
        if: always()
        working-directory: fsi-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: bash scripts/turns/deliver-artifact-branch.sh "Live smoke (run ${{ github.run_id }})"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-smoke-report
          path: |
            ${{ runner.temp }}/live-smoke-report.json
            ${{ runner.temp }}/live-smoke-candidates.json
          if-no-files-found: ignore
          retention-days: 7
