name: Discipline engine

# Runs the Rules-as-Code (RaC) discipline engine on every push to master
# and every pull request targeting master. Server-side enforcement of the
# 11 binding rules from fsi-app/.claude/skills/sprint-followups-discipline/SKILL.md,
# so a local --no-verify or a missing/disabled commit-msg hook cannot bypass
# the policy. Engine, predicates, and rule modules live in
# fsi-app/.discipline/ (Sprint Foundation Waves 0-2).
#
# FIVE jobs run independently on the same triggers:
#
#   validate-commits       executes the engine against the relevant commit(s)
#                          and fails the build on any rule FAIL.
#   test-discipline-engine executes the unit tests for the engine itself
#                          (predicates + every rule + runner) plus the
#                          invariant-coverage meta-gate, so a rule regression
#                          is caught before it merges.
#   consistency-backstop   runs the C3/C4/C5 reality checks unconditionally,
#                          override-aware.
#   fitness-check          npm ci, then the fitness function suite and the
#                          npm-dependent proofs.
#   rendering-guard        real-browser layout leg, NON-BLOCKING, and by a wide
#                          margin the most expensive job here: it installs
#                          Playwright chromium and carries a 10-minute timeout
#                          against everything else's 5.
#
# The header said "Two jobs" from Wave 2 until 2026-08-12 while the file had
# grown to five. A comment that miscounts the jobs it documents is the same
# defect class the engine exists to catch, one level up, so it is corrected
# here rather than left as harmless drift.
#
# RECORDED HONESTLY: the first draft of this correction said FOUR, because it was
# written from a partial read of the file that stopped before rendering-guard. It
# was caught by parsing the YAML and enumerating jobs[] rather than by reading
# harder. Counting by hand is how the original miscount happened; the count above
# is machine-derived.
#
# Any job failing fails the workflow; PR merge is blocked when this
# workflow is set as a required check (Repo -> Settings -> Branches).

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# COST CONTROL (2026-08-12, operator-directed after a GitHub storage alert whose
# diagnosis found the real exposure was MINUTES, not storage).
#
# Measured on the billing usage page, 1-12 August: Actions Linux 1,295 min of the
# 2,000 included, projecting to roughly 3,345 min for the month, about $8 of
# overage. Actions storage was 359 GB-hr against a 372 GB-hr allowance, worth
# about $0.19. The alert named storage; the money was in minutes.
#
# WHY THIS WORKFLOW IS THE CONSUMER. Five jobs fire on every pull_request event,
# seven counting bug-class-guard, and GitHub rounds EVERY job up to a whole
# billable minute, so a short job costs a full minute even when it takes twenty
# seconds. One of the five, rendering-guard, installs Playwright chromium and is
# NON-BLOCKING, so on a superseded commit it is pure spend against a result that
# could never have gated the merge anyway. Delivery to this repo
# is by GitHub web upload, which is scoped to one directory per commit, so one
# logical unit lands as five or six commits. Without a concurrency group each of
# those commits ran a full four-job pass to completion, and the first five passes
# were obsolete before they finished.
#
# WHY cancel-in-progress IS CONDITIONAL. On a pull_request, a superseded run is
# waste: a newer commit on the same branch will be validated instead, so
# cancelling loses no coverage. On a push to master, every commit is a distinct
# thing that must be validated on its own, and cancelling would silently skip
# validation of a merged commit. So the flag is TRUE for pull_request and FALSE
# for everything else, rather than a blanket true.
#
# This changes no trigger and no path filter. Filtering paths was considered and
# REJECTED: a skipped required check reports neither success nor failure, so
# branch protection blocks the merge forever, and a docs-only commit is exactly
# when someone would least expect a permanent block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-commits:
    name: Validate commits against discipline rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 gives full history so:
          #   - push to master: --commit=$GITHUB_SHA can read the commit + its parents
          #   - pull_request:   origin/<base>..HEAD range resolution works
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run discipline engine (push to master)
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -u
          echo "Validating commit $COMMIT_SHA"
          node fsi-app/.discipline/runner.mjs \
            --mode=ci \
            --commit="$COMMIT_SHA"

      - name: Run discipline engine (pull request)
        if: github.event_name == 'pull_request'
        env:
          # PR head SHA (not the synthetic merge commit) so the engine
          # validates the actual commits the PR proposes to add.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -u
          # Make sure origin/<base> is resolvable from the checkout. The
          # checkout action gives us refs/remotes/origin/<base> for the
          # target branch on pull_request events, but we re-fetch defensively
          # in case of a force-push between checkout and run.
          git fetch --no-tags origin "$BASE_REF" || true
          RANGE="origin/${BASE_REF}..${HEAD_SHA}"
          echo "Validating commit range $RANGE"
          node fsi-app/.discipline/runner.mjs \
            --mode=ci \
            --range="$RANGE"

      # ── Memory gate (2026-08-13) ─────────────────────────────────────────
      # WHY. docs/ is the project memory, and memory that is not committed does
      # not exist for any other session: cloud (Cowork) sessions clone from
      # GitHub and never see local-disk edits, and a fresh local session that
      # skipped /done starts blind. This step makes the write-back a property of
      # the merge, not of anyone remembering a command: a change that touches
      # code must, in the same range, touch docs/ops/session-log.md or
      # docs/PROGRAM-BOARD.md.
      #
      # BLOCKING ON pull_request ONLY, warn on push, deliberately. Delivery to
      # this repo is by GitHub web upload, scoped to one directory per commit
      # (see the cost-control header above), so one logical unit lands as
      # several pushes and the code piece may arrive before the docs piece. A
      # push-event hard fail would false-fail that path on every unit. The PR
      # range contains the whole unit, branch protection makes PR checks the
      # real gate, and the push-event warning still surfaces a direct-to-master
      # commit that skipped the vault.
      #
      # Lives as a STEP inside validate-commits, not a sixth job: GitHub bills
      # every job up to a whole minute, and the cost-control header above is
      # why we do not add jobs for twenty seconds of work.
      - name: Memory gate — code must not outrun the vault
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          if [ "$EVENT_NAME" = "push" ]; then
            case "$PUSH_BEFORE" in
              0000000000000000000000000000000000000000|"")
                RANGE="${PUSH_SHA}~1..${PUSH_SHA}" ;;   # branch-creation push: no before
              *)
                RANGE="${PUSH_BEFORE}..${PUSH_SHA}" ;;
            esac
          else
            git fetch --no-tags origin "$BASE_REF" || true
            RANGE="origin/${BASE_REF}...${PR_HEAD}"
          fi
          CHANGED=$(git diff --name-only "$RANGE")
          # Run RECORDS are not code: scripts/harness-runs/** (every family's run artifacts, PENDING-RUN.md
          # and LAST-PROPOSER-PASS.md — F28 audits these as the run's own memory) and the corpus-turn
          # marker scripts/turns/LAST-TURN.json are emitted by the GitHub-Actions runtimes
          # (corpus-turn.yml, source-sweep.yml) on their own branches. Gating those PRs on a session-log
          # addendum would demand a first-person memory entry from a machine (corpus-turn PR #509 failed
          # here, 2026-09-01). The proposer pass over those artifacts is a human/coordinator act that
          # lands with its own addendum, as it always has.
          CODE=$(printf '%s\n' "$CHANGED" | grep -E '^fsi-app/(src|supabase/migrations|scripts|\.discipline)/' | grep -vE '^fsi-app/scripts/(harness-runs/|turns/LAST-TURN\.json$)' || true)
          MEMORY=$(printf '%s\n' "$CHANGED" | grep -E '^docs/(ops/session-log\.md|PROGRAM-BOARD\.md)$' || true)
          if [ -n "$CODE" ] && [ -z "$MEMORY" ]; then
            MSG="Memory gate: this range ($RANGE) touches code but neither docs/ops/session-log.md nor docs/PROGRAM-BOARD.md. The vault is the project memory; a change it does not record is invisible to every future session. Append a session-log addendum (or update PROGRAM-BOARD) in this PR."
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::error::$MSG"; exit 1
            else
              echo "::warning::$MSG (warn-only on push: piecewise web-upload delivery lands code and docs as separate pushes)"
            fi
          else
            echo "memory gate OK"
          fi
          # ── UX compliance gate (2026-09-03, RD-60 / DP-2) ─────────────────────
          # A change that touches a customer surface (.tsx or .css under fsi-app/src) must carry a
          # "UX compliance" block in the session-log addendum of the same range: per screen, the
          # reader's primary goal, the path to it, the one primary action, and the feedback state for
          # every asynchronous action (docs/design/ux-laws.md; DP-2). The measurement half (F35 +
          # the rendering guard's UX smoke slot) proves the layout; this half proves the lane named
          # the goal. Blocking on pull_request, warn on push, for the memory gate's reasons above.
          SURFACE=$(printf '%s\n' "$CHANGED" | grep -E '^fsi-app/src/.*\.(tsx|css)$' || true)
          if [ -n "$SURFACE" ]; then
            if git diff "$RANGE" -- docs/ops/session-log.md | grep -qE '^\+.*UX compliance'; then
              echo "UX compliance gate OK"
            else
              MSG="UX compliance gate: this range ($RANGE) touches a customer surface ($(printf '%s\n' "$SURFACE" | head -3 | tr '\n' ' ')…) but the session-log addendum added in the same range has no 'UX compliance' block (docs/design/ux-laws.md, DP-2). Add it: per screen, the primary goal, the path, the one primary action, the feedback state per async action."
              if [ "$EVENT_NAME" = "pull_request" ]; then
                echo "::error::$MSG"; exit 1
              else
                echo "::warning::$MSG (warn-only on push)"
              fi
            fi
          fi

  test-discipline-engine:
    name: Discipline engine unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The unit tests and the invariant-coverage meta-gate use fixtures / git-tracked-file scans and
          # do not need history, but the closure gate below (added 2026-09-04) shells out to `git log`,
          # `git blame`, and `git merge-base --is-ancestor` to resolve train numbering and MUST see full
          # history — a shallow checkout here would silently misnumber every train and either false-fail
          # or (worse) false-pass every check. Same fetch-depth as validate-commits/consistency-backstop.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Run discipline test suite
        # PARITY BY CONSTRUCTION (operator ruling 2026-07-04): the test list lives in ONE place —
        # fsi-app/.discipline/run-test-suite.sh — invoked by BOTH this CI job AND the pre-push hook (step 3),
        # so they can never drift. (Previously the two lists were maintained separately and a test present in
        # CI but missing from pre-push let a non-portable import pass locally and only red in CI.)
        run: bash fsi-app/.discipline/run-test-suite.sh

      - name: Invariant-coverage meta-gate (per-invariant wiring of all 6 skills)
        # Fails CI if any skill invariant is neither enforced (by a resolving mechanism)
        # nor exempt-with-reason, or if any anchor/baseline drifted. Makes "wired" non-optional.
        run: node fsi-app/.discipline/governance/invariant-coverage.mjs

      - name: Closure gate (never-run steps, stale NEXT rows, writer/reader orphans, lane-contract drift)
        # Lane CLOSURE-GATE, 2026-09-04 — the enforcement docs/plans/complete-system-build-plan-2026-09-04.md
        # W7.5 names as missing: nothing today fails when a maintenance.yml step or dispatchable workflow has
        # never run, when a PROGRAM-BOARD.md row stays NEXT with no owning train, when a table created by a
        # recent migration has a writer and no reader (or the reverse), or when the lane-common-contract lacks
        # the plan's §0 done-conditions. Placed in THIS job (not fitness-check) because it needs the
        # fetch-depth:0 checkout above for its git-log/blame/merge-base train-numbering — fitness-check's
        # checkout is shallow (F9's tsc invocation is its only need). Every failure is ratchet-only: an
        # allowlisted item fails once its own committed expiry train passes — see
        # fsi-app/.discipline/governance/closure-gate.mjs's header.
        run: node fsi-app/.discipline/governance/closure-gate.mjs

      - name: Orphan-module + dead-export census (B1 Appendix A/B method — reports, never fails)
        # W7.3 (docs/plans/complete-system-build-plan-2026-09-04.md; lane F25-WIDE, 2026-09-04). Runs
        # docs/audits/wiring-audit-2026-09-04/B1-modules.md's own two named methods (Appendix A:
        # only-test-importer orphans; Appendix B: dead exports on otherwise-wired modules) against every CI
        # run, independent of F25's allowlist — the standing census the audit's method would produce today.
        # Deliberately non-gating (orphan-modules.mjs's own header: "a REPORT, not a gate" — F25 (widened,
        # above) is the CI-FAILING enforcement for the orphan-module class, with a reasoned expiring
        # allowlist; dead-exports is reported-not-failing this train per the plan, since a mechanical
        # whole-word scan can false-positive on a dynamic access pattern). This `run:` line is also how F25's
        # own findDispatchRoots() sees orphan-modules.mjs as wired (a workflow bare-path mention), so this
        # governance module does not itself become an F25 UNWIRED MODULE violation.
        run: node fsi-app/.discipline/governance/orphan-modules.mjs --all

  consistency-backstop:
    name: Consistency layer (C3/C4/C5 reality — always-on backstop)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # WHY a standalone job (g1): rule 014 only fires the consistency runner when a commit TOUCHES
    # docs/inventories/*.md, so for the vast majority of commits the C3/C4/C5 reality checks never ran in
    # CI — a structurally vacuous CI leg (a migration added without its inventory row would sail through).
    # This job runs the runner UNCONDITIONALLY on every push/PR and asserts exit 0 OR a valid documented
    # Consistency-Override, via the SAME override-aware primitive rule 014 + the pre-push hook use.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # full history so --commit reads the pushed commit and origin/<base>..HEAD resolves for PRs
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Consistency runner (push to master) — override-aware
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -u
          node fsi-app/.discipline/consistency/override-check.mjs --commit="$COMMIT_SHA"

      - name: Consistency runner (pull request) — override-aware
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -u
          git fetch --no-tags origin "$BASE_REF" || true
          node fsi-app/.discipline/consistency/override-check.mjs --range="origin/${BASE_REF}..${HEAD_SHA}"

  fitness-check:
    name: Fitness functions (application-layer enforcement)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        # Fitness functions scan the working tree at the checked-out SHA;
        # a shallow checkout is sufficient since they do not consult git history.

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install fsi-app deps (required for F9 tsc invocation)
        # F9 (build-compiles) runs tsc --noEmit; tsc is the fsi-app local devDep.
        # Without npm install, F9 fails to invoke tsc on a fresh CI checkout.
        # Surfaced 2026-05-21 via failed CI on commit cf03400.
        working-directory: fsi-app
        run: npm ci --prefer-offline --no-audit

      - name: Run fitness functions
        # Whole-repo glob + read + check across the F1-F9 function suite.
        # Exit 0 = no violations; exit 1 = at least one violation; exit 2 = engine error.
        # Violations print file:line with the function id, message, and source skill section.
        run: node fsi-app/.discipline/fitness/runner.mjs

      - name: App unit tests requiring npm deps (*.npmtest.mjs + named npm-dependent proofs)
        # The NAMED exclusion from run-test-suite.sh's no-npm-ci glob (red-merge-class fix,
        # 2026-07-08): tests importing npm deps (jiti for TS module import) run HERE, after
        # npm ci — glob-by-construction, so a new *.npmtest.mjs joins automatically.
        #
        # NAMED LIST ADDED 2026-08-11 (wiring census). Seven proofs were tracked, green, and executed
        # by NOTHING. They cannot join the no-npm suite because each reaches an npm package — most of
        # them TRANSITIVELY, through a relative helper (batch-primitives.test.mjs imports only a
        # relative module, which imports `pg`), so they look portable to a direct-import check and
        # pass locally where node_modules exists. They are not renamed to *.npmtest.mjs because
        # renaming a proof breaks every citation to it in the invariant registry; naming them here
        # wires them with no identity change. Deps are already in package.json (pg, typescript,
        # @supabase/supabase-js), so `npm ci` above resolves all of them.
        run: |
          set -u
          globbed=$(git ls-files 'fsi-app/src/**/*.npmtest.mjs')
          named="fsi-app/scripts/lib/batch-primitives.test.mjs
          fsi-app/scripts/lib/pg-conn.test.mjs
          fsi-app/scripts/lib/decision-anchors.selftest.mjs
          fsi-app/scripts/lib/drift-check.selftest.mjs
          fsi-app/scripts/lib/exclusion-audit.selftest.mjs
          fsi-app/scripts/lib/inconclusive-probe.selftest.mjs
          fsi-app/scripts/lib/surface-registry.selftest.mjs
          fsi-app/src/lib/sources/reconcile.selftest.mjs"
          files=$(printf '%s\n%s\n' "$globbed" "$named" | tr -s ' ' | sed '/^$/d')
          if [ -n "$files" ]; then node --test $files; else echo "no npm-dep test files"; fi

      - name: Behavioral goldens (scripts/verify/*.golden.mjs)
        # WIRING-TRUTH FIX (2026-08-09, Decision 2): the behavioral goldens were `selftest:`-cited as
        # invariant enforcement, git-tracked, and run by NOTHING — two were silently red for weeks. This
        # step runs every golden (glob-by-construction in run-goldens.mjs) after npm ci (some goldens
        # import jiti). Pure goldens pass here; LIVE-DB goldens self-skip (exit 2) for want of secrets and
        # run for real in the data-audit lane. A real golden FAIL fails this job.
        working-directory: fsi-app
        run: node scripts/verify/run-goldens.mjs

  rendering-guard:
    name: Rendering guard (overflow / placeholder / hydration — real-browser layout)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NON-BLOCKING LANE (operator policy 2026-07-11): a flaky required check is a merge embargo on the
    # whole program, so this browser leg runs ALWAYS-ON but NON-BLOCKING (continue-on-error, the same
    # data-audit-lane / SOFT pattern as the bug-class scan) and does NOT enter the required-check set
    # until it has 3 CONSECUTIVE GREEN runs on master post-merge. Stability is proven before it gates.
    #
    # WHY its own job (RENDER-1, 2026-07-11): the overflow leg needs a REAL layout engine
    # (scrollWidth/clientWidth are all-zero in jsdom), so this job installs Playwright chromium and
    # renders the extreme-data fixtures at every app breakpoint tier. It makes the L-1/L-4/L-6 overflow,
    # F-1 placeholder, and V-07 hydration classes build-visible (invariant SF-10-customer-surface-
    # rendering). The pure detector core is ALSO unit-proven red-then-green in the REQUIRED no-npm suite
    # (fsi-app/.discipline/rendering/assertions.test.mjs, in the Discipline-engine-unit-tests job), so
    # the detection logic already gates; this job is the supplementary real-browser layer.
    #
    # KNOWN OPEN (guard's day-one catch, registered — see docs/ops/rendering-guard-followups-2026-07-11.md):
    # the timeline-labels GREEN fixture approximates the real InteractiveTimeline (which is absolute-
    # positioned on a % track) with a flex space-between row AND does not bundle Plus Jakarta Sans, so
    # Linux-CI font-fallback digits overflow +11px at 380px where Windows fits — a fixture fidelity +
    # cross-OS font-nondeterminism issue, NOT a confirmed production defect. Fix (fidelity + deterministic
    # font, + verify the real strip @380px in the live-data mobile E2E) precedes required-status.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright + chromium (scoped, not added to package.json)
        working-directory: fsi-app
        run: |
          npm install --no-save playwright@1.61.1 --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run rendering guard (fixtures × breakpoint tiers, real layout measurement)
        working-directory: fsi-app
        run: node .discipline/rendering/run-rendering-guard.mjs
