name: Discipline engine

# Runs the Rules-as-Code (RaC) discipline engine on every push to master
# and every pull request targeting master. Server-side enforcement of the
# 11 binding rules from fsi-app/.claude/skills/sprint-followups-discipline/SKILL.md,
# so a local --no-verify or a missing/disabled commit-msg hook cannot bypass
# the policy. Engine, predicates, and rule modules live in
# fsi-app/.discipline/ (Sprint Foundation Waves 0-2).
#
# FIVE jobs run independently on the same triggers:
#
#   validate-commits       executes the engine against the relevant commit(s)
#                          and fails the build on any rule FAIL.
#   test-discipline-engine executes the unit tests for the engine itself
#                          (predicates + every rule + runner) plus the
#                          invariant-coverage meta-gate, so a rule regression
#                          is caught before it merges.
#   consistency-backstop   runs the C3/C4/C5 reality checks unconditionally,
#                          override-aware.
#   fitness-check          npm ci, then the fitness function suite and the
#                          npm-dependent proofs.
#   rendering-guard        real-browser layout leg, REQUIRED (lane GATE-4,
#                          2026-10-07: continue-on-error removed now that
#                          BUILD_MODE suspends the baseline clock), and by a
#                          wide margin the most expensive job here: it runs in the
#                          Playwright container image (lane GATE-6, no browser
#                          install) and carries a 15-minute timeout against
#                          everything else's 5.
#
# The header said "Two jobs" from Wave 2 until 2026-08-12 while the file had
# grown to five. A comment that miscounts the jobs it documents is the same
# defect class the engine exists to catch, one level up, so it is corrected
# here rather than left as harmless drift.
#
# RECORDED HONESTLY: the first draft of this correction said FOUR, because it was
# written from a partial read of the file that stopped before rendering-guard. It
# was caught by parsing the YAML and enumerating jobs[] rather than by reading
# harder. Counting by hand is how the original miscount happened; the count above
# is machine-derived.
#
# Any job failing fails the workflow; PR merge is blocked when this
# workflow is set as a required check (Repo -> Settings -> Branches).
#
# PUSH TO MASTER RUNS THE SLIM JOB SET (lane GATE-4, 2026-10-07, gate plan 2026-10-08).
# On a push to master only validate-commits and consistency-backstop run (the app build is checked by
# build-proof.yml, its own workflow, which already triggers on push). test-discipline-engine, fitness-check
# and rendering-guard carry `if: github.event_name == 'pull_request'`: a pull_request run checks out the
# merge of the PR head into the base, so the suite, the fitness functions and the rendering guard have
# already passed on the content that lands. Measured (gate evaluation B, 30 days to 2026-10-08): the 370
# master-push runs were about 38 percent of the estimated discipline job-minutes, re-running checks the
# PR run had already passed. The consistency layer stays because it is the unconditional C3/C4/C5 reality
# backstop. A skipped job on a push blocks nothing (merge protection reads the PR checks), so this does not
# reopen the "skipped required check blocks the merge" problem the cost-control note below rejects path
# filters for.
#
# THE HONEST FORMS (lane GATE-9, 2026-10-08, AUD-AT-5). Every multi-command run: step of this file starts with
# `set -euo pipefail` (a step's exit status is its last command's unless the shell is told otherwise, and
# `+o pipefail` or `|&` quietly made the rule engine's verdict tee's); a push to master validates EVERY commit in
# the pushed range, not only its head; the memory gate FAILS on a push as it does on a pull request; the docs-only
# fast path classes a rename by its source and never skips a governing doc (docs-only-range.mjs); and a tracked test
# or golden that no runner executes fails the "Test discovery" step. The shape of this file is asserted by
# fsi-app/.discipline/fitness/functions/F52-workflow-file-validity.test.mjs (no continue-on-error, no paths-ignore,
# pull_request on master only, no verdict step made conditional or neutered), so an edit that would leave a gate
# unable to fail is itself a failing test.
#
# GATE FIRINGS ARE A CI ARTIFACT (doctrine point 6 of the gate plan). validate-commits uploads the rule
# firing lines (gate-firings-validate-commits) and fitness-check uploads fitness-firings.json
# (gate-firings-fitness-check) on every run, pass or fail, so the next evaluation of the gates is a query
# over artifacts and not a fact lane over logs: docs/runbooks/gate-evaluation.md. One artifact per job
# because upload-artifact v4 refuses a second upload under the same name within one run.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# COST CONTROL (2026-08-12, operator-directed after a GitHub storage alert whose
# diagnosis found the real exposure was MINUTES, not storage).
#
# Measured on the billing usage page, 1-12 August: Actions Linux 1,295 min of the
# 2,000 included, projecting to roughly 3,345 min for the month, about $8 of
# overage. Actions storage was 359 GB-hr against a 372 GB-hr allowance, worth
# about $0.19. The alert named storage; the money was in minutes.
#
# WHY THIS WORKFLOW IS THE CONSUMER. Five jobs fire on every pull_request event,
# seven counting bug-class-guard, and GitHub rounds EVERY job up to a whole
# billable minute, so a short job costs a full minute even when it takes twenty
# seconds. One of the five, rendering-guard, runs in the Playwright container image; it was
# NON-BLOCKING when this note was written (it is required since lane GATE-4), and
# on a superseded commit it is spend against a result that no longer applies. Delivery to this repo
# is by GitHub web upload, which is scoped to one directory per commit, so one
# logical unit lands as five or six commits. Without a concurrency group each of
# those commits ran a full four-job pass to completion, and the first five passes
# were obsolete before they finished.
#
# WHY cancel-in-progress IS CONDITIONAL. On a pull_request, a superseded run is
# waste: a newer commit on the same branch will be validated instead, so
# cancelling loses no coverage. On a push to master, every commit is a distinct
# thing that must be validated on its own, and cancelling would silently skip
# validation of a merged commit. So the flag is TRUE for pull_request and FALSE
# for everything else, rather than a blanket true.
#
# This changes no trigger and no path filter. Filtering paths was considered and
# REJECTED: a skipped required check reports neither success nor failure, so
# branch protection blocks the merge forever, and a docs-only commit is exactly
# when someone would least expect a permanent block.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-commits:
    name: Validate commits against discipline rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # fetch-depth: 0 gives full history so:
          #   - push to master: --commit=$GITHUB_SHA can read the commit + its parents
          #   - pull_request:   origin/<base>..HEAD range resolution works
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # GATE FIRINGS LOG (lane GATE-4, gate plan doctrine point 6). The rule engine's own output (one
      # PASS / SKIP / FAIL line per rule, FAIL with its message) is teed to this file by the two engine
      # steps below, then uploaded by the last step of the job on every run. The header line carries the
      # event, branch and commit so a downloaded file is self-describing.
      - name: Prepare gate firings log
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p fsi-app/.discipline/out
          printf '# gate-firings event=%s branch=%s sha=%s\n' "$GATE_EVENT" "$GATE_BRANCH" "$GATE_SHA" > fsi-app/.discipline/out/rules-ci-firings.log

      - name: Run discipline engine (push to master)
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # GATE-9 (AUD-AT-5 VC-2): validate every commit the push brought in (before..after), not its head. A push of
          # two commits whose first adds a banned glyph passed because only the head was read. A branch-creation push
          # (no before) or a before that is no longer reachable (a force push) falls back to the head commit.
          if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "Validating commit $COMMIT_SHA (no usable before sha)"
            node fsi-app/.discipline/runner.mjs --mode=ci --commit="$COMMIT_SHA" 2>&1 | tee -a fsi-app/.discipline/out/rules-ci-firings.log
          else
            echo "Validating push range ${PUSH_BEFORE}..${COMMIT_SHA}"
            node fsi-app/.discipline/runner.mjs --mode=ci --range="${PUSH_BEFORE}..${COMMIT_SHA}" 2>&1 | tee -a fsi-app/.discipline/out/rules-ci-firings.log
          fi

      - name: Run discipline engine (pull request)
        if: github.event_name == 'pull_request'
        env:
          # PR head SHA (not the synthetic merge commit) so the engine
          # validates the actual commits the PR proposes to add.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Make sure origin/<base> is resolvable from the checkout. The
          # checkout action gives us refs/remotes/origin/<base> for the
          # target branch on pull_request events, but we re-fetch defensively
          # in case of a force-push between checkout and run.
          git fetch --no-tags origin "$BASE_REF" || true
          # LANE R23 (2026-10-02) [CONFIRMED twice, PRs #866 and #869]: this step used to build
          # RANGE="origin/${BASE_REF}..${HEAD_SHA}" by hand -- two dots against the base ref's TIP, not
          # its merge-base with HEAD_SHA. `git diff` does not merge-base-correct a two-dot range, so once
          # origin/master picked up a fix AFTER this branch's fork point, that fix's lines read as
          # "added" on this branch's own whole-range diff (rule 022 flagged 111 inherited em dashes in a
          # file this branch never touched). Fix: do not build the range here at all. BASE_REF + PR_HEAD
          # are passed as env vars; runner.mjs resolves the range itself via change-range.mjs's
          # resolveRange() (base = git merge-base origin/${BASE_REF} ${PR_HEAD}, range = base..PR_HEAD),
          # the SAME function the pre-push hook and F51 resolve through, so this step cannot drift from
          # either.
          echo "Validating PR range: base=origin/${BASE_REF} head=${PR_HEAD} (range resolved by runner.mjs via change-range.mjs)"
          node fsi-app/.discipline/runner.mjs \
            --mode=ci 2>&1 | tee -a fsi-app/.discipline/out/rules-ci-firings.log

      # ── Memory gate (2026-08-13) ─────────────────────────────────────────
      # WHY. docs/ is the project memory, and memory that is not committed does
      # not exist for any other session: cloud (Cowork) sessions clone from
      # GitHub and never see local-disk edits, and a fresh local session that
      # skipped /done starts blind. This step makes the write-back a property of
      # the merge, not of anyone remembering a command: a change that touches
      # code must, in the same range, touch docs/ops/session-log.md,
      # docs/PROGRAM-BOARD.md, or its own docs/ops/session-log.d/YYYY-MM-DD-
      # <slug>.md file (D28, defect-fix-plan-2026-09-12.md, W9 lane L18: every
      # lane appending to the ONE session-log.md file made every rebase onto a
      # master that had merged another lane's own entry conflict on it; a
      # per-lane-per-day file under session-log.d/ satisfies the same vault
      # requirement with nothing shared to conflict on -- see
      # docs/ops/session-log.d/README.md).
      #
      # BLOCKING ON BOTH EVENTS (lane GATE-9, 2026-10-08, AUD-AT-5 VC-3). It was warn-only on push on the
      # reasoning that piecewise web-upload delivery lands code and docs as separate pushes; a warning on the
      # protected branch is a gate that cannot fail, and the register showed a code-only push passing it. The push
      # range is before..after, so a unit pushed together satisfies it.
      #
      # Lives as a STEP inside validate-commits, not a sixth job: GitHub bills
      # every job up to a whole minute, and the cost-control header above is
      # why we do not add jobs for twenty seconds of work.
      - name: Memory gate — code must not outrun the vault
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Task 7.8 (2026-09-12): both checks below (memory gate + UX compliance gate) now live in ONE
          # script, fsi-app/.discipline/governance/memory-gate.mjs, run by BOTH this step and pre-push
          # step 2b, so the two surfaces cannot silently disagree the way they did for PR #647 (task
          # 6.2b went red here while the lane's own pre-push run was green: pre-push had no memory-gate
          # step at all). This step only computes the same RANGE it always has and hands it to the
          # script; the classification rules and messages live in that one file now, not here (D20,
          # defect-fix-plan-2026-09-12.md, lane L12, 2026-09-13: the script's CODE_EXCLUDE_RE gained
          # fsi-app/scripts/turns/record-briefs/batches/ -- a batch file is lane-emitted DATA on an
          # apply-target branch that is never merged, the same posture harness-runs/** and
          # turns/LAST-TURN.json already had, so it is excluded from CODE and does not demand a
          # session-log entry on that throwaway branch).
          #
          # DELIBERATE PARITY DEVIATION (review-7.8.md finding F1, coordinator ruling D6, 2026-09-12):
          # this inline shell used to `exit 1` the instant the memory gate failed on a pull_request
          # event, so a range failing both checks only ever showed the memory gate's error. The script
          # evaluates and prints both verdicts unconditionally, so a combined failure now shows two
          # error lines instead of one. Kept on purpose: a lane sees every failure in one run. The exit
          # code (and therefore what CI enforces) is unchanged either way.
          if [ "$EVENT_NAME" = "push" ]; then
            case "$PUSH_BEFORE" in
              0000000000000000000000000000000000000000|"")
                RANGE="${PUSH_SHA}~1..${PUSH_SHA}" ;;   # branch-creation push: no before
              *)
                RANGE="${PUSH_BEFORE}..${PUSH_SHA}" ;;
            esac
            node fsi-app/.discipline/governance/memory-gate.mjs --range="$RANGE"
          else
            git fetch --no-tags origin "$BASE_REF" || true
            RANGE="origin/${BASE_REF}...${PR_HEAD}"
            node fsi-app/.discipline/governance/memory-gate.mjs --range="$RANGE"
          fi

      - name: Upload gate firings (rule engine output)
        # Every run, pass or fail. An absent file uploads nothing and does not fail the job. One artifact
        # per job because upload-artifact v4 refuses a second upload under the same name in one run. The
        # retention is the F68 budget (7 days); docs/runbooks/gate-evaluation.md says how to query these.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-validate-commits
          path: fsi-app/.discipline/out/rules-ci-firings.log
          if-no-files-found: ignore
          retention-days: 7

      # The governance gates' own firings (lib/gate-firings.mjs, lane GATE-8): the memory gate runs in this job.
      - name: Upload gate firings (governance gates, validate-commits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-governance-validate-commits
          path: fsi-app/.discipline/out/governance-firings.json
          if-no-files-found: ignore
          retention-days: 7

  test-discipline-engine:
    name: Discipline engine unit tests
    # PR head only (lane GATE-4): a push to master skips this job, see the header's slim job set note.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Lane DORMANT-1 (2026-10-09, coordinator grant): contents read as before, plus actions read so the closure gate can
    # ask the Actions API whether each dispatchable workflow has run (and whether GitHub has it disabled).
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # The unit tests and the invariant-coverage meta-gate use fixtures / git-tracked-file scans and
          # do not need history, but the closure gate below (added 2026-09-04) shells out to `git log`,
          # `git blame`, and `git merge-base --is-ancestor` to resolve train numbering and MUST see full
          # history — a shallow checkout here would silently misnumber every train and either false-fail
          # or (worse) false-pass every check. Same fetch-depth as validate-commits/consistency-backstop.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # R22 (2026-10-01, docs-only fast path). Computes the SAME docs-only verdict
      # fsi-app/.discipline/hooks/pre-push's own fast path computes, through the ONE shared primitive
      # (fsi-app/.discipline/governance/docs-only-range.mjs) both surfaces call, so the two cannot drift.
      # This is NOT the path-trigger filtering this file's own 2026-08-12 header rejected ("a skipped
      # required check reports neither success nor failure"): this job still RUNS (Checkout, Setup Node,
      # this step, and the Memory gate's sibling validate-commits job are untouched) and reports a real
      # pass/fail; only the heavy steps below (the test suite, the meta-gates, the orphan census) are
      # skipped on a provably docs-only diff. The rule checks this file runs on EVERY diff regardless
      # (rule 022 + rule 014 in validate-commits, the consistency-backstop job's C3/C4/C5 reality checks)
      # are untouched by this gate.
      - name: Resolve docs-only fast path
        id: docs_only
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            case "$PUSH_BEFORE" in
              0000000000000000000000000000000000000000|"")
                RANGE="${PUSH_SHA}~1..${PUSH_SHA}" ;;
              *)
                RANGE="${PUSH_BEFORE}..${PUSH_SHA}" ;;
            esac
          else
            git fetch --no-tags origin "$BASE_REF" || true
            RANGE="origin/${BASE_REF}...${PR_HEAD}"
          fi
          if node fsi-app/.discipline/governance/docs-only-range.mjs --range="$RANGE"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run discipline test suite
        # PARITY BY CONSTRUCTION (operator ruling 2026-07-04): the test list lives in ONE place —
        # fsi-app/.discipline/run-test-suite.sh — invoked by BOTH this CI job AND the pre-push hook (step 3),
        # so they can never drift. (Previously the two lists were maintained separately and a test present in
        # CI but missing from pre-push let a non-portable import pass locally and only red in CI.)
        if: steps.docs_only.outputs.docs_only != 'true'
        env:
          # Lane DORMANT-1: closure-gate.test.mjs's LIVE NEVER-RUN test runs the same live lookup as the gate step below.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash fsi-app/.discipline/run-test-suite.sh

      - name: Test discovery (every tracked test and golden is run by a suite or listed as not a test)
        # Lane GATE-9 (2026-10-08, AUD-AT-5 TD-1 to TD-4, FC-3, FC-5): the suite runs what discovery finds, so a
        # test the discovery rules do not see (a .test.ts, a .spec.mjs, a test at the repo-root scripts/ or under
        # docs/, an npmtest or golden outside its glob) was tracked, run by nothing, and green. This step lists
        # every tracked file whose name says it is a test and fails on one that no runner executes and that is
        # not named, with a reason, in test-discovery.mjs NOT_A_TEST_ALLOWLIST.
        if: steps.docs_only.outputs.docs_only != 'true'
        run: node fsi-app/.discipline/lib/test-discovery.mjs --check-unrun

      - name: Invariant-coverage meta-gate (per-invariant wiring of all 6 skills)
        # Fails CI if any skill invariant is neither enforced (by a resolving mechanism)
        # nor exempt-with-reason, or if any anchor/baseline drifted. Makes "wired" non-optional.
        if: steps.docs_only.outputs.docs_only != 'true'
        run: node fsi-app/.discipline/governance/invariant-coverage.mjs

      - name: Closure gate (never-run steps, stale NEXT rows, writer/reader orphans, lane-contract drift)
        # Lane CLOSURE-GATE, 2026-09-04 — the enforcement docs/plans/complete-system-build-plan-2026-09-04.md
        # W7.5 names as missing: nothing today fails when a maintenance.yml step or dispatchable workflow has
        # never run, when a PROGRAM-BOARD.md row stays NEXT with no owning train, when a table created by a
        # recent migration has a writer and no reader (or the reverse), or when the lane-common-contract lacks
        # the plan's §0 done-conditions. Placed in THIS job (not fitness-check) because it needs the
        # fetch-depth:0 checkout above for its git-log/blame/merge-base train-numbering (fitness-check's
        # own checkout also gained fetch-depth:0 under R22, 2026-10-01, but only for its docs-only fast
        # path's git diff; this closure gate itself stays here, not duplicated there). Every failure is ratchet-only: an
        # allowlisted item fails once its own committed expiry train passes — see
        # fsi-app/.discipline/governance/closure-gate.mjs's header.
        if: steps.docs_only.outputs.docs_only != 'true'
        env:
          # Lane DORMANT-1 (2026-10-09): the gate's live lookup (fetchLiveRun, fetchWorkflowState) runs only when a token is present.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node fsi-app/.discipline/governance/closure-gate.mjs

      - name: "Skill-contract drift (U8: skill/code citation pin, F25 W7.1)"
        # Lane W71-WIRE, 2026-09-05 (plan §W7.1): skill-contract-map.mjs (U8, flywheel build plan
        # 2026-08-10) existed with only its own .discipline/skill-drift-gate.test.mjs as an importer and
        # no CI reference — a real gate nothing ran. Placed in THIS job, after the closure gate above and
        # before the orphan-module census, matching that census's own precedent: this `run:` line is also
        # how F25's findDispatchRoots() sees this file as wired (a workflow bare-path mention), so it does
        # not itself become an F25 UNWIRED MODULE violation once its W7.1 allowlist entry is removed.
        if: steps.docs_only.outputs.docs_only != 'true'
        run: node fsi-app/.discipline/governance/skill-contract-map.mjs --check

      - name: Orphan-module + dead-export census (B1 Appendix A/B method — reports, never fails)
        # W7.3 (docs/plans/complete-system-build-plan-2026-09-04.md; lane F25-WIDE, 2026-09-04). Runs
        # docs/audits/wiring-audit-2026-09-04/B1-modules.md's own two named methods (Appendix A:
        # only-test-importer orphans; Appendix B: dead exports on otherwise-wired modules) against every CI
        # run, independent of F25's allowlist — the standing census the audit's method would produce today.
        # Deliberately non-gating (orphan-modules.mjs's own header: "a REPORT, not a gate" — F25 (widened,
        # above) is the CI-FAILING enforcement for the orphan-module class, with a reasoned expiring
        # allowlist; dead-exports is reported-not-failing this train per the plan, since a mechanical
        # whole-word scan can false-positive on a dynamic access pattern). This `run:` line is also how F25's
        # own findDispatchRoots() sees orphan-modules.mjs as wired (a workflow bare-path mention), so this
        # governance module does not itself become an F25 UNWIRED MODULE violation.
        if: steps.docs_only.outputs.docs_only != 'true'
        run: node fsi-app/.discipline/governance/orphan-modules.mjs --all

      # The governance gates' own firings (lib/gate-firings.mjs, lane GATE-8): the closure gate, the invariant
      # coverage meta-gate and the skill-contract gate run in this job. Every run, pass or fail; an absent file
      # (a docs-only run skips the gates) uploads nothing. Retention is the F68 budget.
      - name: Upload gate firings (governance gates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-governance-test-discipline-engine
          path: fsi-app/.discipline/out/governance-firings.json
          if-no-files-found: ignore
          retention-days: 7

  consistency-backstop:
    name: Consistency layer (C3/C4/C5 reality — always-on backstop)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # WHY a standalone job (g1): rule 014 only fires the consistency runner when a commit TOUCHES
    # docs/inventories/*.md, so for the vast majority of commits the C3/C4/C5 reality checks never ran in
    # CI — a structurally vacuous CI leg (a migration added without its inventory row would sail through).
    # This job runs the runner UNCONDITIONALLY on every push/PR and asserts exit 0 OR a valid documented
    # Consistency-Override, via the SAME override-aware primitive rule 014 + the pre-push hook use.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # full history so --commit reads the pushed commit and origin/<base>..HEAD resolves for PRs
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Consistency runner (push to master) — override-aware
        if: github.event_name == 'push'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node fsi-app/.discipline/consistency/override-check.mjs --commit="$COMMIT_SHA"

      - name: Consistency runner (pull request) — override-aware
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" || true
          # LANE R23 item 1 (2026-10-02): dropped the hand-built --range="origin/${BASE_REF}..${HEAD_SHA}"
          # (tip-vs-tip). BASE_REF + PR_HEAD are env vars; override-check.mjs resolves the range itself via
          # change-range.mjs's resolveRange(), the same function the validate-commits job and F51 use.
          node fsi-app/.discipline/consistency/override-check.mjs

  fitness-check:
    name: Fitness functions (application-layer enforcement)
    # PR head only (lane GATE-4): a push to master skips this job, see the header's slim job set note.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        # R22 (2026-10-01): fetch-depth: 0 (was the implicit depth-1 default) -- the docs-only fast-path
        # step below needs real history to diff origin/<base>..HEAD / <before>..<sha> against. Fitness
        # functions themselves still only scan the checked-out working tree, not git history.
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: fsi-app/package-lock.json

      # R22 (2026-10-01, docs-only fast path). Same shared primitive and same posture as the sibling gate
      # in test-discipline-engine above: this job still runs (Checkout, Setup Node, this step) and reports
      # a real pass/fail; only the heavy npm-install-dependent steps below are skipped on a provably
      # docs-only diff. See that job's own "Resolve docs-only fast path" step for the full rationale
      # (including why this is not the trigger-level path filtering this file's 2026-08-12 header rejected).
      - name: Resolve docs-only fast path
        id: docs_only
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            case "$PUSH_BEFORE" in
              0000000000000000000000000000000000000000|"")
                RANGE="${PUSH_SHA}~1..${PUSH_SHA}" ;;
              *)
                RANGE="${PUSH_BEFORE}..${PUSH_SHA}" ;;
            esac
          else
            git fetch --no-tags origin "$BASE_REF" || true
            RANGE="origin/${BASE_REF}...${PR_HEAD}"
          fi
          if node fsi-app/.discipline/governance/docs-only-range.mjs --range="$RANGE"; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install fsi-app deps (required for F9 tsc invocation)
        # F9 (build-compiles) runs tsc --noEmit; tsc is the fsi-app local devDep.
        # Without npm install, F9 fails to invoke tsc on a fresh CI checkout.
        # Surfaced 2026-05-21 via failed CI on commit cf03400.
        if: steps.docs_only.outputs.docs_only != 'true'
        working-directory: fsi-app
        run: npm ci --prefer-offline --no-audit

      - name: ESLint (max-warnings 0)
        # Lane R7-LINT-CI, 2026-10-01 (remediation plan Lane 7, closes CF-SEC-10: eslint.config.mjs and
        # package.json's lint script existed with no CI or pre-push step ever invoking them, so a lint
        # violation could land on master unnoticed). Runs after npm ci (ESLint and eslint-config-next are
        # fsi-app devDeps, same ordering requirement as the tsc step below). max-warnings=0 so a warning
        # (e.g. react-hooks/exhaustive-deps, @next/next/no-img-element) fails the build the same as an
        # error; npm run lint's own "lint": "eslint" script takes no args by default, so the flag is
        # passed through the npm-run-script `--` separator here rather than changed in package.json,
        # keeping that file outside this lane's write set.
        if: steps.docs_only.outputs.docs_only != 'true'
        working-directory: fsi-app
        run: npm run lint -- --max-warnings=0

      - name: Run fitness functions
        # Whole-repo glob + read + check across the F1-F9 function suite.
        # Exit 0 = no violations; exit 1 = at least one violation; exit 2 = engine error.
        # Violations print file:line with the function id, message, and source skill section.
        if: steps.docs_only.outputs.docs_only != 'true'
        run: node fsi-app/.discipline/fitness/runner.mjs

      - name: Cache actionlint tarball (version-keyed)
        # Lane GATE-4: one network-reset failure on the release download in the evaluation window (run
        # 37607165874). The pinned release tarball is cached under a key that carries the version, so a
        # version bump is a new key; the step below verifies the sha256 on EVERY run, hit or miss.
        if: steps.docs_only.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/actionlint.tar.gz
          key: actionlint-v1.7.12-linux-amd64

      - name: actionlint (pinned, checksum-verified) over .github/workflows
        # Lane F52, 2026-09-20 (invariant RD-77; see docs/runbooks/CORPUS-TURN-RUNBOOK.md "Workflow-file
        # validity gate"). F52-workflow-file-validity.mjs is a five-check structural floor, not a full
        # linter (no YAML parser is a direct dependency of this repository); actionlint is the real
        # linter, pinned to v1.7.12 and its sha256 read verbatim from actionlint's own release checksums
        # file (rhysd/actionlint, tag v1.7.12, asset actionlint_1.7.12_linux_amd64.tar.gz,
        # actionlint_1.7.12_checksums.txt), so a compromised or mismatched download fails the step rather
        # than running unverified code. Correction, 2026-09-20 (CI run 35538991257): the first real run
        # found 29 findings, all shellcheck notes on existing run: scripts (13 SC2129 style, 11 SC2086
        # info, 3 SC2016 info, 2 SC2012 info; discipline.yml, ledger-consume.yml, maintenance.yml,
        # population-turn.yml), zero from actionlint's own workflow-validity checks (syntax, contexts,
        # expressions, needs, inputs). This step guards workflow validity (RD-77), a different class from
        # shell style inside run scripts, so the shellcheck and pyflakes integrations are switched off
        # below, keeping the exit code, the pin, and the checksum verification. The 29 notes are recorded
        # in docs/tech-debt-log.md under "2026-09-20 (lane F52): workflow run-script shellcheck notes",
        # owner lane "W-shell" (unassigned); that lane switches -shellcheck= back on once fixed.
        if: steps.docs_only.outputs.docs_only != 'true'
        run: |
          set -euo pipefail
          # Lane GATE-4: use the cached tarball when its checksum matches; otherwise download (with retries on
          # a transient network error) and verify. Either way the checksum is verified before anything runs.
          SUM="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz"
          if ! echo "$SUM" | sha256sum -c - >/dev/null 2>&1; then
            curl -sSL --retry 3 --retry-all-errors -o /tmp/actionlint.tar.gz \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            echo "$SUM" | sha256sum -c -
          fi
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color -shellcheck= -pyflakes= .github/workflows/*.yml

      - name: App unit tests requiring npm deps (*.npmtest.mjs)
        # The NAMED exclusion from run-test-suite.sh's no-npm-ci glob (red-merge-class fix,
        # 2026-07-08): tests importing npm deps (jiti for TS module import) run HERE, after
        # npm ci, glob-by-construction, so a new *.npmtest.mjs joins automatically.
        #
        # WIDENED (plan 6.8, Rule A, lane N1) from 'fsi-app/src/**/*.npmtest.mjs' to
        # 'fsi-app/**/*.npmtest.mjs', and the named list this step used to carry is deleted. The nine
        # files that list named (batch-primitives, pg-conn, decision-anchors, drift-check,
        # exclusion-audit, inconclusive-probe, surface-registry, reconcile, layout-guard) are renamed
        # to *.npmtest.mjs in the same lane, so the wider glob covers them by construction; the five
        # scripts/**/*.npmtest.mjs files the list separately named (apply-record-briefs,
        # section-list-drift, resolve-provisional-sources, backfill-format-type,
        # backfill-item-timelines) were only named because the old glob was scoped to fsi-app/src/**
        # and never reached fsi-app/scripts/**; the wider glob covers those by construction too. A new
        # *.npmtest.mjs anywhere under fsi-app/ now joins this step with no edit here, and
        # execution-wiring.mjs's own npmtestMatcher() is widened to match (see that lane's report).
        #
        # ONE HOME (lane G2, 2026-09-21, invariant RD-79): the discovery + command below moved into
        # fsi-app/.discipline/hooks/lib/run-npmtest-suites.sh, which this step and the pre-push hook's
        # step 3e both call, so the two surfaces cannot drift the way they did on PR #769 (CI failed
        # this step; the push gate never ran it at all). Do not inline the command back here.
        if: steps.docs_only.outputs.docs_only != 'true'
        run: sh fsi-app/.discipline/hooks/lib/run-npmtest-suites.sh

      - name: Behavioral goldens (scripts/verify/*.golden.mjs)
        # WIRING-TRUTH FIX (2026-08-09, Decision 2): the behavioral goldens were `selftest:`-cited as
        # invariant enforcement, git-tracked, and run by NOTHING — two were silently red for weeks. This
        # step runs every golden (glob-by-construction in run-goldens.mjs) after npm ci (some goldens
        # import jiti). Pure goldens pass here; LIVE-DB goldens self-skip (exit 2) for want of secrets and
        # run for real in the data-audit lane. A real golden FAIL fails this job.
        if: steps.docs_only.outputs.docs_only != 'true'
        working-directory: fsi-app
        run: node scripts/verify/run-goldens.mjs

      - name: Upload gate firings (fitness functions)
        # Every run, pass or fail. The fitness runner writes fitness-firings.json (lane GATE-3); when it is
        # absent (a docs-only run skips the runner, or the runner predates the file) nothing is uploaded and
        # the job does not fail. See validate-commits for why the artifact name carries the job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-fitness-check
          path: fsi-app/.discipline/out/fitness-firings.json
          if-no-files-found: ignore
          retention-days: 7

  rendering-guard:
    name: Rendering guard (overflow / placeholder / hydration — real-browser layout)
    # PR head only (lane GATE-4): a push to master skips this job, see the header's slim job set note.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # CONTAINER, NOT AN INSTALL (lane GATE-6, 2026-10-08). The job runs in the official Playwright image, so
    # chromium and its OS libraries are already present and `playwright install --with-deps` is not run at
    # all. Why: four Rendering guard runs were cancelled at the 10 minute limit (PRs 1007, 1009 first attempt,
    # 1016, 1020), and the 1020 log shows the install stalled about 7 minutes on apt package downloads before
    # any test ran, while the same code had passed in 8m6s on the prior push. The image tag below is the ONE
    # place the Playwright version is written: the install step reads it back out of this file, so the npm
    # package and the image's browsers cannot drift (the F52 workflow-shape test asserts the derivation).
    # `job.container.image` does not exist in the job context (only id and network), hence the file read.
    # To bump Playwright, change the tag; the distro is noble (published for 1.61, proven by the first run).
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    # SHELL (lane GATE-9): a container job's steps run under `sh -e` (dash) by default, which has no `-o pipefail`
    # (the first GATE-9 run died with "set: Illegal option -o pipefail"). The image has bash, so the job says so.
    defaults:
      run:
        shell: bash
    # TIMEOUT 15 MINUTES (was 10). Measured by GATE-4 (docs/ops/session-log.d/2026-10-07-gate4-ci.md): the guard
    # run itself is median 231 s, p90 433 s, max 604 s, checkout 5 s, and the install (44 s typical) is gone,
    # so the longest observed run plus startup is about 11 minutes; 15 leaves headroom without letting a
    # stall run to the old limit unnoticed. The per-check timeouts inside the guard are untouched. The guard's
    # own runtime is printed as a `guard run: <s> s` step summary line so the next evaluation reads a number.
    timeout-minutes: 15
    # REQUIRED JOB (lane GATE-4, 2026-10-07, gate plan 2026-10-08). This job used to carry
    # continue-on-error (operator policy 2026-07-11: a flaky required check is a merge embargo, so the
    # browser leg stayed non-blocking until it proved stable). The condition that mattered at the end is
    # met: BUILD_MODE (fsi-app/.discipline/governance/build-mode.mjs) suspends the layout-guard baseline
    # clock, so the calendar rule that turned this job red on its own no longer applies, and a NEW finding
    # blocks while a baselined one does not. Its non-pass rate over the 301 sampled runs was about 1.5
    # percent (gate evaluation B section 8). A job that cannot fail the workflow gates nothing, which is
    # why the soft pattern is removed here and not kept. It runs on the pull_request head only (see the
    # header); the timeout is set above.
    #
    # WHY its own job (RENDER-1, 2026-07-11): the overflow leg needs a REAL layout engine
    # (scrollWidth/clientWidth are all-zero in jsdom), so this job runs in the Playwright image (chromium
    # included) and renders the extreme-data fixtures at every app breakpoint tier. It makes the L-1/L-4/L-6 overflow,
    # F-1 placeholder, and V-07 hydration classes build-visible (invariant SF-10-customer-surface-
    # rendering). The pure detector core is ALSO unit-proven red-then-green in the REQUIRED no-npm suite
    # (fsi-app/.discipline/rendering/assertions.test.mjs, in the Discipline-engine-unit-tests job), so
    # the detection logic already gates; this job is the supplementary real-browser layer.
    #
    # KNOWN OPEN (guard's day-one catch, registered, see docs/ops/rendering-guard-followups-2026-07-11.md):
    # the timeline-labels GREEN fixture approximates the real InteractiveTimeline (which is absolute-
    # positioned on a % track) with a flex space-between row. The font half of that finding (Linux-CI
    # fallback digits overflowing +11px at 380px) was closed by RD-80, which vendors the fonts the app
    # ships; the fixture fidelity half is still a fixture approximation, NOT a confirmed production defect.
    steps:
      # DEPTH 1, NO EXTRA REF FETCH (lane GATE-4). This step used to check out with `fetch-depth: 0`
      # (task 0.1, FACETFIX, 2026-09-11) so `latestTrainWave()` (F25-module-liveness.mjs) could read the
      # landed-wave history and a push run and a pull_request run would agree. That fetched every remote
      # branch on every run (hundreds of `[new branch]` lines). Both reasons are gone: this job now runs
      # on pull_request only, so there is no push-versus-PR pair to reconcile, and the three consumers of
      # the oracle (exemptions-375.mjs, exemptions-law2-desktop.mjs, layout-guard/manifests.mjs) are
      # unaffected by a depth-1 checkout: the two dated exemption lists fail CLOSED on an unknown wave
      # (expired at waves 58 and 70, so none is active either way) and manifests.mjs carries no numbered
      # expiry. The checkout action fetches the PR merge ref alone at depth 1.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Trust the workspace for git (the container user does not own the checkout)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install the Playwright npm package matching the image (browsers come from the image)
        run: |
          set -euo pipefail
          version="$(sed -n 's|^ *image: mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*$|\1|p' .github/workflows/discipline.yml)"
          test -n "$version"
          echo "playwright npm package: $version"
          cd fsi-app
          npm install --no-save "playwright@${version}" --no-audit --no-fund

      - name: Run rendering guard (fixtures × breakpoint tiers, real layout measurement)
        working-directory: fsi-app
        run: |
          set -euo pipefail
          start="$(date +%s)"
          status=0
          node .discipline/rendering/run-rendering-guard.mjs || status=$?
          line="guard run: $(( $(date +%s) - start )) s"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
