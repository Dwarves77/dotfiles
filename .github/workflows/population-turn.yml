name: Population turn

# RECORD-GRADE POPULATION RUNTIME (Lane POP, 2026-09-02) — the runtime docs/plans/
# record-tier-population-plan-2026-09-01.md §6 named as its own execution sequence but could not build
# itself (§3: "not a pure, DB-less script, and therefore out of run-mint-batch.mjs's own scope"). This
# workflow is that sequence, end to end: stamp the WO-26 archive-reason hygiene gap so the M4 holder
# check can tell an already-ruled-on exclusion from a real collision, export an enriched census-row batch
# (fsi-app/scripts/mint/export-census-rows.mjs), run it through the mint family's EXISTING gate
# (run-mint-batch.mjs --census-rows --grade record --execute — unmodified, unwritten by this lane), then
# apply the validator-green payloads through the guarded write path (apply-mint-batch.mjs) exactly the way
# mint-run-005/006's coordinator-apply pass did by hand. No new harness family: this reuses "mint"
# (scripts/harness-runs/mint/), per the record-tier plan's own framing — apply-mint-batch.mjs ENRICHES
# that family's existing run artifact, it does not mint a new one.
#
# DISPATCH-ONLY, mode dry|apply, same posture every runtime workflow in this repo states for itself
# (operator ruling 2026-09-01, "no standing schedules during build"):
#   schedule:
#     - cron: '0 9 * * 2'   # BUILD MODE placeholder cadence only — stays commented out until the
#                            # operator explicitly re-arms it (see source-sweep.yml / corpus-turn.yml for
#                            # the same posture on the other runtime families).
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY — the
# same pair every guarded script in fsi-app/scripts/lib/db.mjs already requires (registered in
# .discipline/governance/secrets-registry.mjs's WORKFLOW_SECRETS; no new secret name is introduced here).
#
# WHAT "apply" MODE ACTUALLY WRITES: stamp-wo26-archive-reason.mjs --apply (descriptive archive_reason
# metadata only — never is_archived/provenance_status; see that script's own header) and
# apply-mint-batch.mjs --apply (intelligence_items / agent_run_searches / intelligence_item_sections /
# section_claim_provenance / item_gate_a_state / intelligence_item_citations / a census_worklist
# enumeration_status stamp, all through scripts/lib/db.mjs's guarded, cited, snapshotted path).
#
# THE FLYWHEEL, MANDATORY, NEVER A SEPARATE COORDINATOR PASS (lane TANDEM, 2026-09-04). THE DEFECT this
# closes [CONFIRMED]: this workflow used to END after apply-mint-batch.mjs + an unconditional
# propose-tags.mjs --dry preview — MINT-RUNBOOK.md §8 ("MANDATORY, post-apply — the flywheel": discovery,
# forward-event extraction, recluster, IN ORDER) and §9 (--outcomes enrichment) were documented as a
# SEPARATE, hand-run coordinator pass that nothing in this runtime ever triggered. Population runs
# #15-#20 (2026-09-03/04, ~650 items, mint-run-017..022) were applied with no flywheel pass and no
# outcomes: every one of those items carries zero item_cross_references, zero item_forward_events, no
# obligations, no tags, no signals. Operator ruling (2026-09-04), verbatim: "there is no thing within this
# entire build that works on its own ever. Everything works in tandem... that's the purpose of the
# flywheel and the harness." `scripts/turns/run-population-flywheel.mjs` is that missing runtime — it runs
# immediately after `screen-reconcile-records.mjs` below (still inside THIS job, still gating THIS job's
# own exit code — never a "note for a coordinator") and, in `apply` mode, actually WRITES: connection
# edges (`discover-for-items.mjs`, guarded `write-edges.mjs`), `item_forward_events`
# (`run-extraction.mjs --execute` + `apply-extraction-output.mjs --execute` — self-emits its OWN
# `scripts/harness-runs/forward-events/forward-events-run-NNN.json`), `connection_themes` /
# `integrity_flags` (`analyze-corpus.mjs --signals`), `obligations` (`derive-obligations.mjs`),
# `integrity_flags` TAG proposals + ratified `intelligence_items.*_tags` (`tag-proposals.mjs` /
# `tag-ratification.mjs --arg auto`), and finally enriches THIS batch's own `mint-run-NNN.json` with the
# §9 corpus-outcome metrics (`run-mint-batch.mjs --outcomes`) and advances
# `scripts/turns/LAST-TURN.json` so a later `corpus-turn` dispatch never re-covers what this run already
# connected. See `scripts/turns/run-population-flywheel.mjs`'s own header for the full step-by-step
# contract, and `docs/runbooks/POPULATION-TURN-RUNBOOK.md` for the coordinator-facing summary. A green
# run of THIS workflow now means minted AND connected AND recorded — a run whose flywheel step fails
# fails the whole job (no `|| true` on that step), by design.
#
# THE GATE, WIDENED (apply mode only, run BEFORE export-census-rows.mjs — lane TANDEM-2, 2026-09-04). THE
# DEFECT this closes [CONFIRMED by the coordinator reading the landed code]: the gate used to read only
# the SINGLE newest mint-run artifact (by started_at) — a dry artifact (a rows_file preview, or a live
# export that minted nothing) has metrics.minted absent/0 by construction, so whenever a dry artifact
# happened to be newest, it read as "nothing to connect" and let a new apply through, while apply
# artifacts BEHIND it on the timeline stayed unconnected. `run-population-flywheel.mjs --check-gate` now
# scans EVERY mint-run artifact on this checkout (including hydrated unmerged siblings, see below) and
# refuses if ANY of them minted items but was left without the §9 outcome keys — a dry artifact still
# never counts on its own, but it no longer masks a stale artifact elsewhere in the list. Still a pure,
# filesystem-only, no-DB-creds-needed check, so a defect in a PRIOR run (or a hand-run predecessor from
# before this lane) is caught before this run spends any fetch/mint budget on a slice this repo cannot yet
# connect either. THE GATE'S OWN REFUSAL NAMES THE FIX: dispatch this workflow again with
# `flywheel_backlog: true` (see below) — never a hand-run coordinator pass.
#
# BACKLOG MODE (lane TANDEM-2, 2026-09-04) — `flywheel_backlog: true`. Clears exactly what THE GATE
# refuses, without minting anything new: when set, this job SKIPS `stamp-wo26-archive-reason.mjs`,
# `export-census-rows.mjs`, `run-mint-batch.mjs`, `apply-mint-batch.mjs`,
# `rederive-record-provenance.mjs`, and `screen-reconcile-records.mjs` entirely (there is no new batch to
# prepare or apply) and runs `run-population-flywheel.mjs --backlog` instead — see that script's own
# header ("BACKLOG MODE" / "COST PROJECTION") for the full step-by-step contract, its default
# `--max-artifacts` and the [INFERRED] cost reasoning behind it, and `docs/runbooks/
# POPULATION-TURN-RUNBOOK.md`'s backlog section for the coordinator-facing dispatch instructions. `mode:
# dry` lists the stale mint-run artifacts and each one's item count and writes nothing at all (no DB
# creds needed); `mode: apply` enriches up to `backlog_max_artifacts` of them, oldest first, each one
# checkpointed to disk (its own `mint-run-NNN.json`) the moment it finishes — so a job that hits
# `timeout-minutes` mid-backlog still leaves everything processed so far fully connected and THE GATE
# correctly narrowed for the next dispatch. THE GATE itself never runs on a `flywheel_backlog: true`
# dispatch (see below) — gating the one dispatch whose entire purpose is clearing the gate would be
# circular. `timeout-minutes` is raised 30 → 60 in this lane specifically to give a default-sized backlog
# apply (2 artifacts) real headroom — see the cost projection this raise is based on in
# `run-population-flywheel.mjs`'s own header.
#
# rows_file (Lane POP2, 2026-09-02, first live dry run): the browser-capture escape hatch made a
# first-class runtime input. MINT-RUNBOOK.md §1a's operator ruling is "a site that refuses the runner is
# read through the browser, never reported as a blocker" — this input is how a coordinator lands rows
# captured that way without hand-running run-mint-batch.mjs/apply-mint-batch.mjs locally: build the
# enriched-row JSON (MINT-RUNBOOK.md §11's browser-capture procedure), commit it under
# scripts/_snapshots/population-browser/, then dispatch this workflow with rows_file pointing at it. When
# set, the export-census-rows.mjs step is skipped entirely and run-mint-batch.mjs/apply-mint-batch.mjs run
# against that file directly — export-census-rows.mjs's own automated capture is simply not on the path
# for those rows.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = plan every step and write only harness-run artifacts to disk. apply = also write through the guarded DB path.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      limit:
        description: 'Max census_worklist rows this run considers (export-census-rows.mjs --limit).'
        required: false
        default: '50'
        type: string
      source_id:
        description: 'Optional sources.id — narrow the export to one source.'
        required: false
        type: string
      celex_prefix:
        description: 'Optional CELEX prefix (e.g. 32024) — narrow the export to one instrument-identifier prefix.'
        required: false
        type: string
      capture:
        description: 'Politely fetch document_url for rows with no existing agent_run_searches capture ($0, 1 req/s).'
        required: true
        default: true
        type: boolean
      rows_file:
        description: 'Optional repo path to a pre-built enriched-row JSON (e.g. scripts/_snapshots/population-browser/<batch>.json) captured through the browser per MINT-RUNBOOK.md §11''s browser-capture procedure. When set, the export-census-rows.mjs step is SKIPPED and this file drives run-mint-batch.mjs/apply-mint-batch.mjs directly. Ignored when flywheel_backlog is true (which skips export/mint entirely).'
        required: false
        type: string
      flywheel_backlog:
        description: 'true = skip export/mint entirely and instead run the population flywheel (MINT-RUNBOOK.md §8/§9) over EXISTING mint-run artifacts THE GATE currently refuses, oldest first, enriching each in place (mode=dry lists them and writes nothing; mode=apply connects up to backlog_max_artifacts of them). See run-population-flywheel.mjs --backlog and docs/runbooks/POPULATION-TURN-RUNBOOK.md''s backlog section.'
        required: true
        default: false
        type: boolean
      backlog_max_artifacts:
        description: 'Only used when flywheel_backlog=true. Max stale mint-run artifacts to enrich in ONE dispatch. Leave blank to use run-population-flywheel.mjs''s own documented default (see that script''s header for the cost reasoning).'
        required: false
        type: string
  # schedule:
  #   - cron: '0 9 * * 2'   # BUILD MODE (2026-09-02) — see header above; stays commented out until the
  #                          # operator explicitly re-arms it.

concurrency:
  group: population-turn
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # deliver-artifact-branch.sh's fallback when PR creation is refused (see that script)

jobs:
  population:
    runs-on: ubuntu-latest
    # 30 -> 60 (lane TANDEM-2, 2026-09-04): a flywheel_backlog=true apply dispatch can run the full
    # per-artifact §8/§9 step plan up to backlog_max_artifacts times in one job (default 2 — see
    # run-population-flywheel.mjs's own "COST PROJECTION" for the [INFERRED] reasoning). A normal
    # single-batch apply is unaffected and keeps the same margin it always had.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cache flush after a real apply (PERF train, 2026-09-03): scripts/lib/revalidate.mjs POSTs the
      # ledger/detail cache tags to /api/revalidate. Same secret pair change-detection.yml already uses;
      # absent, the helper skips and the 60 s / 300 s cache backstops bound staleness.
      APP_URL: ${{ secrets.APP_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      - name: This run's gates
        run: |
          echo "trigger      = ${{ github.event_name }}"
          echo "mode         = ${{ inputs.mode }}"
          echo "limit        = ${{ inputs.limit }}"
          echo "source_id    = ${{ inputs.source_id }}"
          echo "celex_prefix = ${{ inputs.celex_prefix }}"
          echo "capture      = ${{ inputs.capture }}"
          echo "rows_file    = ${{ inputs.rows_file }}"
          echo "flywheel_backlog     = ${{ inputs.flywheel_backlog }}"
          echo "backlog_max_artifacts = ${{ inputs.backlog_max_artifacts }}"
          echo "EXPORT_DIR=scripts/_snapshots/population-${{ github.run_id }}" >> "$GITHUB_ENV"
          if [ "${{ inputs.flywheel_backlog }}" = "true" ]; then
            echo "flywheel_backlog=true — export/mint steps below are skipped; CENSUS_ROWS_PATH/CENSUS_ROWS_BASENAME are unused this dispatch."
            echo "CENSUS_ROWS_PATH=" >> "$GITHUB_ENV"
            echo "CENSUS_ROWS_BASENAME=" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ -n "${{ inputs.rows_file }}" ]; then
            CENSUS_ROWS_PATH="${{ inputs.rows_file }}"
            echo "using rows_file — export-census-rows.mjs will be skipped: $CENSUS_ROWS_PATH"
          else
            CENSUS_ROWS_PATH="scripts/_snapshots/population-${{ github.run_id }}/census-rows.json"
          fi
          echo "CENSUS_ROWS_PATH=$CENSUS_ROWS_PATH" >> "$GITHUB_ENV"
          # run-mint-batch.mjs's own basename convention (base = basename(inputPath, extname(inputPath)))
          # names its apply-ready/report files — reproduced here so apply-mint-batch.mjs's --apply-ready
          # path matches EXACTLY regardless of whether the input came from the live export (basename
          # "census-rows") or an arbitrary rows_file (e.g. basename "batch-001").
          BASE="$(basename "$CENSUS_ROWS_PATH")"
          echo "CENSUS_ROWS_BASENAME=${BASE%.json}" >> "$GITHUB_ENV"

      # ── hydrate UNMERGED sibling artifacts so this run's mint-run_id (and, now, forward-events-run_id)
      # cannot collide ────────────────────────────────────────────────────────────────────────────────
      # Same problem, same fix as source-sweep.yml's own step (see that file's comment for the full
      # rationale): claimRunId (scripts/lib/run-artifact.mjs) numbers the next <family>-run-NNN from the
      # files it can see in the checked-out tree, i.e. master. Artifacts land through a PR, so a
      # population-turn dispatched before a PREVIOUS population-turn's (or a hand-run mint batch's) PR
      # merged would see a stale count and claim the SAME run_id. Extended (lane TANDEM, 2026-09-04) to
      # also hydrate scripts/harness-runs/forward-events/: run-population-flywheel.mjs's own
      # forward-event-extraction step self-emits a NEW forward-events-run-NNN.json every apply run, the
      # exact same collision risk mint-run-NNN.json already had. The unmerged sibling branches are
      # fetched and both families' artifacts placed in the working tree (untracked; removed again before
      # the commit step, never committed by this run) so each family's claim counts above them.
      - name: Hydrate unmerged mint + forward-events artifacts from sibling population branches (run_id collision guard)
        run: |
          git fetch --no-tags origin '+refs/heads/population/*:refs/remotes/origin/population/*' || true
          : > /tmp/hydrated-artifacts.txt
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/population/*'); do
            for family_dir in fsi-app/scripts/harness-runs/mint/ fsi-app/scripts/harness-runs/forward-events/; do
              for f in $(git ls-tree -r --full-tree --name-only "$b" -- "$family_dir"); do
                rel="${f#fsi-app/}"
                if [ ! -e "$rel" ]; then
                  mkdir -p "$(dirname "$rel")"
                  git show "$b:$f" > "$rel"
                  echo "$rel" >> /tmp/hydrated-artifacts.txt
                fi
              done
            done
          done
          echo "hydrated $(wc -l < /tmp/hydrated-artifacts.txt) unmerged mint/forward-events file(s) from sibling population branches"

      # THE GATE (apply mode only, and never on a flywheel_backlog dispatch — that dispatch's whole job IS
      # to clear what THE GATE refuses, so gating it would be circular) — see the header comment above for
      # the full rationale. Filesystem-only (readRunHistory over whatever mint-run-NNN.json files are on
      # this checkout, hydrated siblings included), so it runs before "Verify required secrets" would even
      # matter and before this run spends any budget on export-census-rows.mjs.
      - name: 'Gate: refuse a new slice while a prior one is left unconnected (apply mode only, not on a backlog dispatch)'
        if: ${{ inputs.mode == 'apply' && inputs.flywheel_backlog != 'true' }}
        run: node scripts/turns/run-population-flywheel.mjs --check-gate --harness-runs-dir scripts/harness-runs/mint

      - name: Snapshot existing mint-run artifacts (for this run's new run_id discovery)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: |
          ls scripts/harness-runs/mint/mint-run-*.json 2>/dev/null | sort > /tmp/mint-before.txt || true

      - name: stamp-wo26-archive-reason.mjs (archive_reason hygiene — apply only in apply mode)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then
            node scripts/mint/stamp-wo26-archive-reason.mjs --apply
          else
            node scripts/mint/stamp-wo26-archive-reason.mjs
          fi

      - name: export-census-rows.mjs
        if: ${{ inputs.rows_file == '' }}
        run: |
          if [ "${{ inputs.flywheel_backlog }}" = "true" ]; then
            echo "flywheel_backlog=true — export-census-rows.mjs skipped (backlog mode mints nothing)."
            exit 0
          fi
          mkdir -p "$EXPORT_DIR"
          args=(--limit "${{ inputs.limit }}" --out "$CENSUS_ROWS_PATH")
          if [ -n "${{ inputs.source_id }}" ]; then args+=(--source-id "${{ inputs.source_id }}"); fi
          if [ -n "${{ inputs.celex_prefix }}" ]; then args+=(--celex-prefix "${{ inputs.celex_prefix }}"); fi
          if [ "${{ inputs.capture }}" = "true" ]; then args+=(--capture); fi
          node scripts/mint/export-census-rows.mjs "${args[@]}"

      - name: Skip export-census-rows.mjs (rows_file supplied)
        if: ${{ inputs.rows_file != '' && inputs.flywheel_backlog != 'true' }}
        run: |
          mkdir -p "$EXPORT_DIR"
          if [ ! -f "$CENSUS_ROWS_PATH" ]; then
            echo "::error::rows_file '$CENSUS_ROWS_PATH' does not exist in the checked-out tree — commit it (e.g. under scripts/_snapshots/population-browser/) before dispatching with rows_file set."
            exit 1
          fi
          echo "export-census-rows.mjs skipped — using rows_file: $CENSUS_ROWS_PATH"

      # run-mint-batch.mjs exits 1 when any payload fails validation (metrics.invalid > 0) — an EXPECTED
      # outcome for a batch that includes held/malformed census rows, not a fatal condition for this
      # workflow (the apply-ready file it wrote still carries every payload that DID validate). The `||
      # true` here is deliberate; the artifact + apply-ready file are the record of what happened, not
      # this step's own exit code.
      - name: run-mint-batch.mjs --census-rows --grade record --execute (the mint family's EXISTING gate, unmodified)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: |
          node scripts/mint/run-mint-batch.mjs \
            --census-rows "$CENSUS_ROWS_PATH" \
            --grade record \
            --execute \
            --out-dir "$EXPORT_DIR" \
            || true

      - name: Discover this run's new mint-run-NNN.json (set by run-mint-batch.mjs's collision-safe claim)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: |
          ls scripts/harness-runs/mint/mint-run-*.json 2>/dev/null | sort > /tmp/mint-after.txt || true
          NEW_MINT_RUN="$(comm -13 /tmp/mint-before.txt /tmp/mint-after.txt | head -1)"
          if [ -z "$NEW_MINT_RUN" ]; then
            echo "::error::no new scripts/harness-runs/mint/mint-run-NNN.json appeared after run-mint-batch.mjs — cannot proceed to apply-mint-batch.mjs."
            exit 1
          fi
          echo "NEW_MINT_RUN=$NEW_MINT_RUN" >> "$GITHUB_ENV"
          echo "This run's mint-run artifact: $NEW_MINT_RUN"

      - name: apply-mint-batch.mjs (coordinator-apply — apply only in apply mode)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: |
          # --report is technically optional (apply-mint-batch.mjs derives the same path from
          # --apply-ready's own basename, defaultReportPathFor) — named explicitly here anyway, so the
          # validation_failed hold-back (lane URL-GUIL, 2026-09-03) has an unambiguous input regardless of
          # any future change to that derivation.
          args=(--apply-ready "$EXPORT_DIR/${CENSUS_ROWS_BASENAME}.apply-ready.json" --report "$EXPORT_DIR/${CENSUS_ROWS_BASENAME}.mint-batch-report.json" --census-rows "$CENSUS_ROWS_PATH" --mint-run "$NEW_MINT_RUN")
          if [ "${{ inputs.mode }}" = "apply" ]; then args+=(--apply); fi
          node scripts/mint/apply-mint-batch.mjs "${args[@]}"

      # Post-apply reconciliation: a record-grade row whose provenance_status is stale against what
      # validate_item_provenance derives now is touched through the guarded path so the trigger re-derives
      # it (run #8, 2026-09-02: ten items stamped quarantined before their gate row existed). Dry in dry
      # mode (lists), apply in apply mode. Never sets the status itself.
      - name: rederive-record-provenance.mjs (heal stale provenance stamps — apply only in apply mode)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then node scripts/mint/rederive-record-provenance.mjs --apply; else node scripts/mint/rederive-record-provenance.mjs; fi

      # Relevance reconciliation: any LIVE record-grade item the screen (rules + the operator's reviewed
      # verdicts) rules off-vertical is archived reversibly (archive_reason off_vertical) through the
      # guarded path; ambiguous items are listed for a ruling. Runs #9–#11 minted from the unscreened
      # pool (2026-09-02); the export gate stops the recurrence, this step reconciles what landed.
      # Ruled 2026-09-02: the five flagged verdicts (TEN-T, aerodynamic devices, CCNR positions, CEF,
      # authorised weight) are on-vertical and the screen was corrected; the remainder of the off-vertical
      # list stands. Apply mode archives them reversibly (archive_reason off_vertical, snapshot per chunk);
      # ambiguous items are listed, never archived.
      - name: screen-reconcile-records.mjs (archive off-vertical record items reversibly — apply only in apply mode)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: |
          if [ "${{ inputs.mode }}" = "apply" ]; then node scripts/mint/screen-reconcile-records.mjs --apply; else node scripts/mint/screen-reconcile-records.mjs; fi

      # THE FLYWHEEL (lane TANDEM, 2026-09-04) — MANDATORY, MINT-RUNBOOK.md §8/§9, run by the workflow
      # itself; the coordinator's job is to read the outcomes. Runs after screen-reconcile-records.mjs so
      # any item that step just archived off-vertical is naturally excluded (discover-for-items.mjs's own
      # corpus load filters is_archived=false; an id no longer in scope is reported "not found in the
      # verified/live corpus," never a crash). --mint-run reads THIS run's own (apply-mint-batch.mjs-
      # enriched) mint-run-NNN.json, extracts exactly the item ids this batch actually minted, and runs
      # discovery + forward-event extraction + recluster + derive-obligations + tag-proposals +
      # tag-ratification + the §9 outcomes write, in order — see that script's own header for the full
      # per-step contract and the dry-mode preview it runs instead when mode=dry. NO `|| true`: a failed
      # flywheel step fails this job — a green run means minted AND connected AND recorded, never merely
      # minted. Supersedes the old unconditional `propose-tags.mjs --dry` preview step (Lane
      # TAG-PROPOSALS, 2026-09-03) — that step only ever logged what tag-proposals.mjs WOULD write; this
      # step's own tag-proposals stage actually writes it, scoped to this batch's own minted ids
      # (`--arg ids:<...>`), then tag-ratification's auto-adoption sweep (`--arg auto`) actually applies
      # the high-confidence subset — no separate, later MAINT dispatch is needed for a population-turn
      # batch's own newly-minted items.
      - name: run-population-flywheel.mjs (discovery + forward-events + recluster + tags + §9 outcomes — MANDATORY, MINT-RUNBOOK.md §8/§9)
        if: ${{ inputs.flywheel_backlog != 'true' }}
        run: node scripts/turns/run-population-flywheel.mjs --mint-run "$NEW_MINT_RUN" --mode ${{ inputs.mode }}

      # BACKLOG MODE (lane TANDEM-2, 2026-09-04) — see the header comment above ("BACKLOG MODE") and
      # run-population-flywheel.mjs --backlog's own header for the full contract. Runs INSTEAD of every
      # export/mint/apply/reconcile/normal-flywheel step above (all skipped via flywheel_backlog != 'true'
      # on this dispatch) — this mode mints nothing; it only connects what earlier runs already minted.
      # NO `|| true` here either: the same "a green run means connected, never merely attempted" posture.
      - name: run-population-flywheel.mjs --backlog (MINT-RUNBOOK.md §8/§9 over the EXISTING gate backlog, oldest first)
        if: ${{ inputs.flywheel_backlog == 'true' }}
        run: |
          args=(--backlog --mode "${{ inputs.mode }}" --harness-runs-dir scripts/harness-runs/mint)
          if [ -n "${{ inputs.backlog_max_artifacts }}" ]; then args+=(--max-artifacts "${{ inputs.backlog_max_artifacts }}"); fi
          node scripts/turns/run-population-flywheel.mjs "${args[@]}"

      - name: Remove hydrated sibling artifacts (they belong to their own branches)
        if: always()
        run: |
          if [ -s /tmp/hydrated-artifacts.txt ]; then xargs -a /tmp/hydrated-artifacts.txt rm -f; fi
          rm -rf scripts/harness-runs/*/.claims

      # scripts/_snapshots/ is gitignored (guarded-write prior-value snapshots stay off the repo by
      # default) — EXCEPT this run's own census-rows/apply-ready/report/held files, which are the
      # population-turn's full trace and are force-added here deliberately. db.mjs's own per-write
      # prior-value snapshot JSONL files land directly under scripts/_snapshots/*.jsonl (a DIFFERENT path
      # than $EXPORT_DIR), so they are never swept up by this add and stay off the repo, unchanged.
      #
      # Both scripts/harness-runs/mint (this run's enriched mint-run-NNN.json, now carrying the §9
      # outcomes) AND scripts/harness-runs/forward-events (the flywheel step's own forward-events-run-NNN.json,
      # emitted by run-extraction.mjs/apply-extraction-output.mjs as part of MINT-RUNBOOK.md §8) must be
      # staged here — a green run means minted AND connected AND recorded, and "recorded" covers both
      # families' artifacts, not just mint's.
      - name: Commit the mint + forward-events harness-run artifacts and this run's snapshot dir, and open a PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/harness-runs/mint
          git add scripts/harness-runs/forward-events
          # EXPORT_DIR is empty on a flywheel_backlog dispatch (export/mint are skipped entirely, so
          # nothing was ever written there) — guard the add so it never fails a step git runs with -e.
          if [ -n "$EXPORT_DIR" ] && [ -d "$EXPORT_DIR" ]; then git add -f "$EXPORT_DIR"; fi
          if git diff --cached --quiet; then
            echo "No new population-turn artifacts to commit."
            exit 0
          fi
          branch="population/${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "population-turn ${{ inputs.mode }}: run ${{ github.run_id }}"
          git push origin HEAD:"$branch"
          if [ "${{ inputs.flywheel_backlog }}" = "true" ]; then
            {
              echo "Automated population turn — BACKLOG (run ${{ github.run_id }})."
              echo
              echo "Mode: ${{ inputs.mode }}"
              echo "backlog_max_artifacts: ${{ inputs.backlog_max_artifacts || '(script default)' }}"
              echo
              echo "Minted NOTHING new — export/mint were skipped entirely. Ran run-population-flywheel.mjs --backlog over the mint-run artifacts THE GATE currently refuses (oldest first), enriching each in place with its own §9 outcomes (edges_discovered/forward_events_extracted/isolated_items). See that step's own log for exactly which artifacts this dispatch processed and how many remain."
            } > /tmp/pr-body.md
          else
            {
              echo "Automated population turn (run ${{ github.run_id }})."
              echo
              echo "Mode: ${{ inputs.mode }}"
              echo "Limit: ${{ inputs.limit }}"
              echo "Source id: ${{ inputs.source_id }}"
              echo "CELEX prefix: ${{ inputs.celex_prefix }}"
              echo "Capture: ${{ inputs.capture }}"
              echo "Rows file: ${{ inputs.rows_file || '(none — live export)' }}"
              echo
              echo "Lands this run's enriched mint-run artifact (${NEW_MINT_RUN:-none}, now carrying §9 outcomes: edges_discovered/forward_events_extracted/isolated_items), its export/apply-ready/report files (${EXPORT_DIR}/), and the flywheel's own forward-events harness-run artifact (scripts/harness-runs/forward-events/)."
            } > /tmp/pr-body.md
          fi
          bash scripts/turns/deliver-artifact-branch.sh "$branch" "Population turn: $branch (mode=${{ inputs.mode }})" /tmp/pr-body.md

      - name: Upload scripts/_snapshots as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-turn-snapshots-${{ github.run_id }}
          path: fsi-app/scripts/_snapshots/
          if-no-files-found: ignore
          retention-days: 90
