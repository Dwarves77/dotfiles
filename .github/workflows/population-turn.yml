name: Population turn

# RECORD-GRADE POPULATION RUNTIME (Lane POP, 2026-09-02) — the runtime docs/plans/
# record-tier-population-plan-2026-09-01.md §6 named as its own execution sequence but could not build
# itself (§3: "not a pure, DB-less script, and therefore out of run-mint-batch.mjs's own scope"). This
# workflow is that sequence, end to end: stamp the WO-26 archive-reason hygiene gap so the M4 holder
# check can tell an already-ruled-on exclusion from a real collision, export an enriched census-row batch
# (fsi-app/scripts/mint/export-census-rows.mjs), run it through the mint family's EXISTING gate
# (run-mint-batch.mjs --census-rows --grade record --execute — unmodified, unwritten by this lane), then
# apply the validator-green payloads through the guarded write path (apply-mint-batch.mjs) exactly the way
# mint-run-005/006's coordinator-apply pass did by hand. No new harness family: this reuses "mint"
# (scripts/harness-runs/mint/), per the record-tier plan's own framing — apply-mint-batch.mjs ENRICHES
# that family's existing run artifact, it does not mint a new one.
#
# DISPATCH-ONLY, mode dry|apply, same posture every runtime workflow in this repo states for itself
# (operator ruling 2026-09-01, "no standing schedules during build"):
#   schedule:
#     - cron: '0 9 * * 2'   # BUILD MODE placeholder cadence only — stays commented out until the
#                            # operator explicitly re-arms it (see source-sweep.yml / corpus-turn.yml for
#                            # the same posture on the other runtime families).
#
# EVENT-DRIVEN CHAINING (lane CHAIN, 2026-09-04, build plan W1.4 / audit wiring-audit-2026-09-04 §5
# reading (a)) — a `workflow_run` trigger on "Ledger consume" completed, NOT a schedule. Rule 16 forbids a
# standing cadence (`schedule:`/cron); it does not forbid firing off the COMPLETION of another workflow's
# run, which is what this is — the audit's own §5.2 names this exact mechanism as rule-16-compliant ("does
# not touch the `schedule:` blocks rule 16 forbids arming"). See "CHAINING — HOW THIS RUN DECIDES WHAT TO
# DO" below for the full contract, and docs/runbooks/POPULATION-TURN-RUNBOOK.md's "Chaining" section for
# the coordinator-facing summary.
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY — the
# same pair every guarded script in fsi-app/scripts/lib/db.mjs already requires (registered in
# .discipline/governance/secrets-registry.mjs's WORKFLOW_SECRETS; no new secret name is introduced here).
#
# WHAT "apply" MODE ACTUALLY WRITES: stamp-wo26-archive-reason.mjs --apply (descriptive archive_reason
# metadata only — never is_archived/provenance_status; see that script's own header) and
# apply-mint-batch.mjs --apply (intelligence_items / agent_run_searches / intelligence_item_sections /
# section_claim_provenance / item_gate_a_state / intelligence_item_citations / a census_worklist
# enumeration_status stamp, all through scripts/lib/db.mjs's guarded, cited, snapshotted path).
#
# THE FLYWHEEL, MANDATORY, NEVER A SEPARATE COORDINATOR PASS (lane TANDEM, 2026-09-04). THE DEFECT this
# closes [CONFIRMED]: this workflow used to END after apply-mint-batch.mjs + an unconditional
# propose-tags.mjs --dry preview — MINT-RUNBOOK.md §8 ("MANDATORY, post-apply — the flywheel": discovery,
# forward-event extraction, recluster, IN ORDER) and §9 (--outcomes enrichment) were documented as a
# SEPARATE, hand-run coordinator pass that nothing in this runtime ever triggered. Population runs
# #15-#20 (2026-09-03/04, ~650 items, mint-run-017..022) were applied with no flywheel pass and no
# outcomes: every one of those items carries zero item_cross_references, zero item_forward_events, no
# obligations, no tags, no signals. Operator ruling (2026-09-04), verbatim: "there is no thing within this
# entire build that works on its own ever. Everything works in tandem... that's the purpose of the
# flywheel and the harness." `scripts/turns/run-population-flywheel.mjs` is that missing runtime — it runs
# immediately after `screen-reconcile-records.mjs` below (still inside THIS job, still gating THIS job's
# own exit code — never a "note for a coordinator") and, in `apply` mode, actually WRITES: connection
# edges (`discover-for-items.mjs`, guarded `write-edges.mjs`), `item_forward_events`
# (`run-extraction.mjs --execute` + `apply-extraction-output.mjs --execute` — self-emits its OWN
# `scripts/harness-runs/forward-events/forward-events-run-NNN.json`), `connection_themes` /
# `integrity_flags` (`analyze-corpus.mjs --signals`), `obligations` (`derive-obligations.mjs`),
# `integrity_flags` TAG proposals + ratified `intelligence_items.*_tags` (`tag-proposals.mjs` /
# `tag-ratification.mjs --arg auto`), and finally enriches THIS batch's own `mint-run-NNN.json` with the
# §9 corpus-outcome metrics (`run-mint-batch.mjs --outcomes`) and advances
# `scripts/turns/LAST-TURN.json` so a later `corpus-turn` dispatch never re-covers what this run already
# connected. See `scripts/turns/run-population-flywheel.mjs`'s own header for the full step-by-step
# contract, and `docs/runbooks/POPULATION-TURN-RUNBOOK.md` for the coordinator-facing summary. A green
# run of THIS workflow now means minted AND connected AND recorded — a run whose flywheel step fails
# fails the whole job (no `|| true` on that step), by design.
#
# THE GATE, WIDENED (apply mode only, run BEFORE export-census-rows.mjs — lane TANDEM-2, 2026-09-04). THE
# DEFECT this closes [CONFIRMED by the coordinator reading the landed code]: the gate used to read only
# the SINGLE newest mint-run artifact (by started_at) — a dry artifact (a rows_file preview, or a live
# export that minted nothing) has metrics.minted absent/0 by construction, so whenever a dry artifact
# happened to be newest, it read as "nothing to connect" and let a new apply through, while apply
# artifacts BEHIND it on the timeline stayed unconnected. `run-population-flywheel.mjs --check-gate` now
# scans EVERY mint-run artifact on this checkout (including hydrated unmerged siblings, see below) and
# refuses if ANY of them minted items but was left without the §9 outcome keys — a dry artifact still
# never counts on its own, but it no longer masks a stale artifact elsewhere in the list. Still a pure,
# filesystem-only, no-DB-creds-needed check, so a defect in a PRIOR run (or a hand-run predecessor from
# before this lane) is caught before this run spends any fetch/mint budget on a slice this repo cannot yet
# connect either. THE GATE'S OWN REFUSAL NAMES THE FIX: dispatch this workflow again with
# `flywheel_backlog: true` (see below) — never a hand-run coordinator pass. THE GATE still applies exactly
# the same way on a chained (`workflow_run`) dispatch as on a hand dispatch — chaining changes WHO fires
# this workflow, never what it is allowed to do once it runs.
#
# BACKLOG MODE (lane TANDEM-2, 2026-09-04) — `flywheel_backlog: true`. Clears exactly what THE GATE
# refuses, without minting anything new: when set, this job SKIPS `stamp-wo26-archive-reason.mjs`,
# `export-census-rows.mjs`, `run-mint-batch.mjs`, `apply-mint-batch.mjs`,
# `rederive-record-provenance.mjs`, and `screen-reconcile-records.mjs` entirely (there is no new batch to
# prepare or apply) and runs `run-population-flywheel.mjs --backlog` instead — see that script's own
# header ("BACKLOG MODE" / "COST PROJECTION") for the full step-by-step contract, its default
# `--max-artifacts` and the [INFERRED] cost reasoning behind it, and `docs/runbooks/
# POPULATION-TURN-RUNBOOK.md`'s backlog section for the coordinator-facing dispatch instructions. `mode:
# dry` lists the stale mint-run artifacts and each one's item count and writes nothing at all (no DB
# creds needed); `mode: apply` enriches up to `backlog_max_artifacts` of them, oldest first, each one
# checkpointed to disk (its own `mint-run-NNN.json`) the moment it finishes — so a job that hits
# `timeout-minutes` mid-backlog still leaves everything processed so far fully connected and THE GATE
# correctly narrowed for the next dispatch. THE GATE itself never runs on a `flywheel_backlog: true`
# dispatch (see below) — gating the one dispatch whose entire purpose is clearing the gate would be
# circular. `timeout-minutes` is raised 30 → 60 in this lane specifically to give a default-sized backlog
# apply (2 artifacts) real headroom — see the cost projection this raise is based on in
# `run-population-flywheel.mjs`'s own header. Backlog mode is `workflow_dispatch`-only — a `workflow_run`
# chained dispatch never sets `flywheel_backlog` (see below).
#
# rows_file (Lane POP2, 2026-09-02, first live dry run): the browser-capture escape hatch made a
# first-class runtime input. MINT-RUNBOOK.md §1a's operator ruling is "a site that refuses the runner is
# read through the browser, never reported as a blocker" — this input is how a coordinator lands rows
# captured that way without hand-running run-mint-batch.mjs/apply-mint-batch.mjs locally: build the
# enriched-row JSON (MINT-RUNBOOK.md §11's browser-capture procedure), commit it under
# scripts/_snapshots/population-browser/, then dispatch this workflow with rows_file pointing at it. When
# set, the export-census-rows.mjs step is skipped entirely and run-mint-batch.mjs/apply-mint-batch.mjs run
# against that file directly — export-census-rows.mjs's own automated capture is simply not on the path
# for those rows. `rows_file` is `workflow_dispatch`-only — a chained dispatch always uses the live export.
#
# ── CHAINING — HOW THIS RUN DECIDES WHAT TO DO (lane CHAIN, 2026-09-04) ─────────────────────────────────
#
# `on.workflow_run: workflows: ["Ledger consume"], types: [completed]` fires this workflow every time a
# `ledger-consume.yml` run finishes, in ADDITION to `workflow_dispatch`. The FIRST step below ("Resolve
# run parameters, trigger context, and the chaining/pause gate") is the ONE place that decides, for BOTH
# trigger shapes, what this run actually does — every other step downstream reads its RUN_* outputs
# (RUN_MODE/RUN_LIMIT/RUN_SOURCE_ID/RUN_CELEX_PREFIX/RUN_CAPTURE/RUN_ROWS_FILE/RUN_FLYWHEEL_BACKLOG/
# RUN_BACKLOG_MAX_ARTIFACTS/RUN_SKIP/RUN_SKIP_REASON/RUN_TRIGGER_CONTEXT) instead of `inputs.*` directly,
# so a `workflow_run` dispatch (whose `inputs` context is always empty — a `type: boolean` input compared
# to a bare `${{ inputs.x }}` on that trigger is exactly the class of silent-wrong-default bug "Gate:
# refuse a new slice..." below already scarred on once, see its own comment) can never fall through to a
# stale/default reading of a hand-dispatch-only input.
#
# ON A workflow_dispatch: RUN_* mirrors `inputs.*` exactly — unchanged behavior, byte for byte, from
# before this lane.
#
# ON A workflow_run (fired by "Ledger consume" completing): RUN_MODE=apply, RUN_LIMIT=<resolved max_items,
# see "THE POPULATION CAP" below, default 25>, every other input at its hand-dispatch default
# (RUN_CAPTURE=true, RUN_FLYWHEEL_BACKLOG=false, RUN_SOURCE_ID/RUN_CELEX_PREFIX/RUN_ROWS_FILE empty) —
# ONLY IF ALL of the following hold, checked in this order (any failure sets RUN_SKIP=true with a named
# reason logged via `::notice::` and every real step below skips, so the JOB ITSELF STILL EXITS 0 GREEN —
# a refused chain is never a red run, exactly A9/§5's "never a coordinator failure" posture):
#   1. The upstream run's own `conclusion` (`github.event.workflow_run.conclusion`) is `"success"`.
#   2. The upstream run's own harness-run row, read from `harness_runs` by scripts/lib/upstream-artifact.mjs
#      (THE MECHANISM below), passes the gate for THIS run's mode. In a dry run (build mode forces every
#      chained firing dry) the row only has to exist and not be a no-op: this run then executes its REAL steps
#      dry on whatever the upstream recorded, which is what proves the chain's wiring while the cadence is off.
#      In an apply run the row must show REAL work: `config.mode == "apply"` AND `config.apply_disarmed ==
#      false` (a real, non-disarmed apply, not a plan run and not an apply request that armed on zero committed
#      verdict batches) AND `metrics.promoted > 0` (candidates actually reached census_worklist). What arms an
#      apply (lane M2, 2026-09-18): run-ledger-consume.mjs's own `isApplyArmed` check plus the `max_promote`
#      cap, an apply is armed the moment at least one verdict batch is committed under
#      `scripts/turns/ledger-verdicts/`. `metrics.promoted` alone is NOT sufficient: PROMOTED_LIKE_DISPOSITIONS
#      (run-ledger-consume.mjs) counts a PLAN run's `would_mint` outcomes under the same key, so an apply gate
#      that checked promoted without mode/apply_disarmed would chain a real apply off a run that wrote nothing.
#
# THE MECHANISM (lane CHAIN-1, 2026-10-07, chain-fire-2026-10-06 finding F2). `ledger-consume.yml` lands its
# harness-run artifact in the `harness_runs` table (deliver-artifact-branch.sh, operator ruling 2026-09-26: no
# branch, no PR), so this run reads it there: `node scripts/lib/upstream-artifact.mjs read --consumer
# population-turn --upstream-name <workflow> --upstream-run-id <github.event.workflow_run.id> --run-mode
# <RUN_MODE>` looks the family up from the upstream's workflow NAME (loop-run-id.mjs's one map) and reads the row
# whose github_run_id is that run. This file used to look for a `ledger-consume/<run_id>` git branch that
# nothing pushes any more, so a chained Population turn was a NO-OP on every firing. A missing row, an upstream
# that was itself a no-op, or an apply request without real upstream work is a named no-op, and a no-op still
# records its own `mint` row (`upstream-artifact.mjs noop`, config.noop and noop_reason, honest trigger, the
# upstream run id stamped) so the loop firing evidence can place hop 03 on a run that decided to do nothing. A
# read failure is a red run, never a silent no-op.
#
# THE POPULATION CAP  --  `max_items` (lane M3, 2026-09-19, build plan section 6.1 row M3). RETIRES
# `POPULATION_PAUSED` (lane CHAIN, 2026-09-04's flag-style stop) as this workflow's own gap-closure lane:
# the T46 validation window this plan's section 6.2 names has since been superseded by build plan section
# 6's own machine-first sequence, and a binary repository-variable flag left every chained dispatch a
# named no-op regardless of size  --  a blunt instrument for a plan that now wants the machine bounded, not
# stopped. `max_items` (workflow_dispatch input, default '25', optional) is the bound instead: on a
# workflow_run-chained dispatch RUN_LIMIT resolves to this input's value (or 25 when left blank, which is
# the normal case  --  a chained dispatch carries no `inputs.*` at all); a hand dispatch keeps its own
# `limit` input entirely unaffected (max_items is never read on that trigger). The hard ceiling (100) is
# enforced in the RUNNER, not here  --  `export-census-rows.mjs`'s own `--max-items` flag (`resolveExportLimit`,
# that script's own header) refuses anything above 100, so a bad repository-level value can never slip a
# slice larger than the ceiling past this workflow's own bash resolution. No writer, no reader, no
# repository variable to flip: the cap bounds every chained run identically, every time, with no
# coordinator action required to arm or disarm it. See `docs/runbooks/POPULATION-TURN-RUNBOOK.md`'s
# "Population cap" section for the coordinator-facing summary.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = plan every step and write only harness-run artifacts to disk. apply = also write through the guarded DB path.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      limit:
        description: 'Max census_worklist rows this run considers (export-census-rows.mjs --limit). Only read on a hand workflow_dispatch  --  a workflow_run-chained dispatch uses max_items below instead.'
        required: false
        default: '50'
        type: string
      max_items:
        description: 'Lane M3 (2026-09-19): the cap a workflow_run-chained dispatch (fired by "Ledger consume" completing) actually uses in place of limit above  --  replaces the retired POPULATION_PAUSED repository-variable stop with a bounded slice size instead of a binary flag. Hard ceiling 100, enforced in export-census-rows.mjs (--max-items, resolveExportLimit). Not read by a hand workflow_dispatch (which uses limit above); present here so the cap is a visible, documented input rather than a value only the chained code path knows about.'
        required: false
        default: '25'
        type: string
      source_id:
        description: 'Optional sources.id — narrow the export to one source.'
        required: false
        type: string
      celex_prefix:
        description: 'Optional CELEX prefix (e.g. 32024) — narrow the export to one instrument-identifier prefix.'
        required: false
        type: string
      capture:
        description: 'Politely fetch document_url for rows with no existing agent_run_searches capture ($0, 1 req/s).'
        required: true
        default: true
        type: boolean
      rows_file:
        description: 'Optional repo path to a pre-built enriched-row JSON (e.g. scripts/_snapshots/population-browser/<batch>.json) captured through the browser per MINT-RUNBOOK.md §11''s browser-capture procedure. When set, the export-census-rows.mjs step is SKIPPED and this file drives run-mint-batch.mjs/apply-mint-batch.mjs directly. Ignored when flywheel_backlog is true (which skips export/mint entirely).'
        required: false
        type: string
      flywheel_backlog:
        description: 'true = skip export/mint entirely and instead run the population flywheel (MINT-RUNBOOK.md §8/§9) over EXISTING mint-run artifacts THE GATE currently refuses, oldest first, enriching each in place (mode=dry lists them and writes nothing; mode=apply connects up to backlog_max_artifacts of them). See run-population-flywheel.mjs --backlog and docs/runbooks/POPULATION-TURN-RUNBOOK.md''s backlog section.'
        required: true
        default: false
        type: boolean
      backlog_max_artifacts:
        description: 'Only used when flywheel_backlog=true. Max stale mint-run artifacts to enrich in ONE dispatch. Leave blank to use run-population-flywheel.mjs''s own documented default (see that script''s header for the cost reasoning).'
        required: false
        type: string
  # workflow_run (lane CHAIN, 2026-09-04): event-driven off a completed run, NOT a schedule (rule 16 is
  # about `schedule:`/cron blocks — see this file's own header "EVENT-DRIVEN CHAINING" section and audit
  # wiring-audit-2026-09-04 §5's own rule-16 check). Fires once per "Ledger consume" run, any conclusion;
  # the first job step decides whether that run's outcome actually earns a chained dispatch.
  workflow_run:
    workflows: ["Ledger consume"]
    types: [completed]
  # schedule:
  #   - cron: '0 9 * * 2'   # BUILD MODE (2026-09-02) — see header above; stays commented out until the
  #                          # operator explicitly re-arms it.

concurrency:
  group: population-turn
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # deliver-artifact-branch.sh's fallback when PR creation is refused (see that script)

jobs:
  population:
    runs-on: ubuntu-latest
    # 30 -> 60 (lane TANDEM-2, 2026-09-04): a flywheel_backlog=true apply dispatch can run the full
    # per-artifact §8/§9 step plan up to backlog_max_artifacts times in one job (default 2 — see
    # run-population-flywheel.mjs's own "COST PROJECTION" for the [INFERRED] reasoning). A normal
    # single-batch apply is unaffected and keeps the same margin it always had.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cache flush after a real apply (PERF train, 2026-09-03): scripts/lib/revalidate.mjs POSTs the
      # ledger/detail cache tags to /api/revalidate. Same secret pair change-detection.yml already uses;
      # absent, the helper skips and the 60 s / 300 s cache backstops bound staleness.
      APP_URL: ${{ secrets.APP_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      # fetch-depth: 0 (lane STATUTORY-WRITER, 2026-09-29, coordinator finding on PR #824, propagation-
      # drain run 36534640498: the rebase below fails outright on a shallow checkout, the same class
      # #812/gate-a-rescan and #819/maintenance each independently fixed in their own workflow). This
      # workflow's commit step also carries the mint + forward-events snapshot dir alongside the harness
      # artifact, so the branch/push/rebase itself is intentionally NOT removed here.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── CHAINED DRY-RUN GUARD (rule 16, lane CHAINED-DRY-GUARD, 2026-09-29) ─────────────────────────
      # Build mode (system_state.scrape_cadence='off') means every runtime fires by explicit dispatch;
      # a workflow_run-chained firing is not one, so it MUST run dry regardless of whatever hardcoded
      # apply/plan default this workflow's own resolve step below would otherwise pick. Runs BEFORE
      # npm ci (chained-dry-guard.mjs is a zero-npm-dependency raw fetch) so nothing downstream can
      # reach an apply path before this gate has spoken. Exports CHAINED_FORCED_DRY (true/false) and
      # CHAINED_TRIGGER_LABEL, consumed below wherever this file currently hardcodes an apply/plan
      # default for a workflow_run firing. See scripts/lib/chained-dry-guard.mjs's own header.
      - name: Chained dry-run guard (build mode, rule 16)
        working-directory: fsi-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # --requested-mode (lane CHAIN-1, 2026-10-07, finding F5): the REAL requested mode, not a hardcoded apply.
          # A hand dispatch asks for inputs.mode; a chained firing has no inputs and asks for the apply default the
          # resolve step below uses, which the guard forces to dry while build mode is live. A dry dispatch used to
          # log "resolved mode=apply", which read as an armed run when it was not.
          node scripts/lib/chained-dry-guard.mjs --event "${{ github.event_name }}" --requested-mode "${{ inputs.mode || 'apply' }}" >> "$GITHUB_ENV"

      # ── THE ONE PLACE that resolves inputs.* (workflow_dispatch) vs. the chained defaults +
      # promoted/pause gate (workflow_run) into a single RUN_* vocabulary every step below reads —
      # see this file's own header "CHAINING" section for the full contract. Runs BEFORE setup-node/
      # npm ci (cheap: git fetch of one small branch, no Node needed) so a no-op chained dispatch never
      # pays the install cost. ALWAYS runs and ALWAYS logs its decision (trigger, gate readings, RUN_SKIP
      # + reason) — a skipped run is still a run that says why in its own log, never a silent no-op.
      - name: Resolve run parameters, trigger context, and the chaining gate
        run: |
          set -u
          EVENT="${{ github.event_name }}"
          echo "event = $EVENT"

          RUN_SKIP=false
          RUN_SKIP_REASON=""
          RUN_TRIGGER_CONTEXT=""

          if [ "$EVENT" = "workflow_dispatch" ]; then
            RUN_MODE="${{ inputs.mode }}"
            RUN_LIMIT="${{ inputs.limit }}"
            RUN_LIMIT_FLAG="--limit"
            RUN_SOURCE_ID="${{ inputs.source_id }}"
            RUN_CELEX_PREFIX="${{ inputs.celex_prefix }}"
            RUN_CAPTURE="${{ inputs.capture }}"
            RUN_ROWS_FILE="${{ inputs.rows_file }}"
            RUN_FLYWHEEL_BACKLOG="${{ inputs.flywheel_backlog }}"
            RUN_BACKLOG_MAX_ARTIFACTS="${{ inputs.backlog_max_artifacts }}"

          elif [ "$EVENT" = "workflow_run" ]; then
            UPSTREAM_NAME="${{ github.event.workflow_run.name }}"
            UPSTREAM_RUN_ID="${{ github.event.workflow_run.id }}"
            UPSTREAM_CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            echo "upstream = $UPSTREAM_NAME (run $UPSTREAM_RUN_ID), conclusion=$UPSTREAM_CONCLUSION"

            # Chained defaults: mode=apply, RUN_LIMIT bounded by THE POPULATION CAP (see this file's own
            # header  --  max_items' own default, 25; ceiling 100 enforced in export-census-rows.mjs), every
            # other input at its hand-dispatch default  --  a chained run is never wider or narrower than a
            # person would pick, and never unbounded the way the retired POPULATION_PAUSED flag's absence
            # would be. A LITERAL, not `${{ inputs.max_items }}`  --  this file's own header ("CHAINING") and
            # the "Gate: refuse a new slice..." step below already document why: `inputs.*` is a
            # workflow_dispatch-only context, and a workflow_run event reading it is exactly the class of
            # silent-wrong-default bug this workflow was already burned by once.
            # RUN_MODE forced to "dry" by the CHAINED_FORCED_DRY guard step above whenever build mode
            # (system_state.scrape_cadence='off') is live (rule 16, lane CHAINED-DRY-GUARD, 2026-09-29).
            RUN_MODE="apply"
            if [ "${CHAINED_FORCED_DRY:-false}" = "true" ]; then RUN_MODE="dry"; fi
            RUN_LIMIT="25"
            # --max-items, NOT --limit: export-census-rows.mjs enforces the hard ceiling of 100 only on
            # --max-items (resolveExportLimit, that script's own header)  --  the chained path must always
            # pass this flag, never the uncapped --limit, so a future edit that widens RUN_LIMIT above
            # cannot silently exceed THE POPULATION CAP this file's header documents.
            RUN_LIMIT_FLAG="--max-items"
            RUN_SOURCE_ID=""
            RUN_CELEX_PREFIX=""
            RUN_CAPTURE="true"
            RUN_ROWS_FILE=""
            RUN_FLYWHEEL_BACKLOG="false"
            RUN_BACKLOG_MAX_ARTIFACTS=""
            RUN_TRIGGER_CONTEXT="$(jq -nc --arg name "$UPSTREAM_NAME" --argjson run_id "$UPSTREAM_RUN_ID" --arg conclusion "$UPSTREAM_CONCLUSION" '{name:$name, run_id:$run_id, conclusion:$conclusion}' 2>/dev/null || true)"
            echo "trigger_context = $RUN_TRIGGER_CONTEXT"

            if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
              RUN_SKIP=true
              RUN_SKIP_REASON="upstream run $UPSTREAM_RUN_ID ($UPSTREAM_NAME) concluded '$UPSTREAM_CONCLUSION', not success — no-op, nothing to chain from."
            else
              # THE MECHANISM, see this file's header: read the upstream's harness_runs row and apply the gate
              # for this run's mode. The reader prints KEY=VALUE lines; a node failure (a read error, missing
              # credentials in Actions) fails this step loudly, it is never read as "nothing upstream".
              HANDOFF="$(node scripts/lib/upstream-artifact.mjs read --consumer population-turn --upstream-name "$UPSTREAM_NAME" --upstream-run-id "$UPSTREAM_RUN_ID" --run-mode "$RUN_MODE")"
              HANDOFF_SKIP="$(printf '%s\n' "$HANDOFF" | sed -n 's/^CHAIN_SKIP=//p')"
              HANDOFF_REASON="$(printf '%s\n' "$HANDOFF" | sed -n 's/^CHAIN_SKIP_REASON=//p')"
              echo "upstream hand-off: skip=$HANDOFF_SKIP row=$(printf '%s\n' "$HANDOFF" | sed -n 's/^CHAIN_UPSTREAM_ROW_ID=//p')"
              if [ "$HANDOFF_SKIP" != "false" ]; then
                RUN_SKIP=true
                RUN_SKIP_REASON="${HANDOFF_REASON:-the upstream hand-off returned no answer} - no-op, nothing to chain from."
              fi
            fi

          else
            RUN_SKIP=true
            RUN_SKIP_REASON="unrecognized trigger event '$EVENT' — no-op."
            RUN_MODE="dry"; RUN_LIMIT="50"; RUN_LIMIT_FLAG="--limit"; RUN_SOURCE_ID=""; RUN_CELEX_PREFIX=""; RUN_CAPTURE="true"
            RUN_ROWS_FILE=""; RUN_FLYWHEEL_BACKLOG="false"; RUN_BACKLOG_MAX_ARTIFACTS=""
          fi

          # EXPORT_DIR/CENSUS_ROWS_PATH/CENSUS_ROWS_BASENAME — same derivation the pre-chaining "This
          # run's gates" step always did, now keyed off RUN_* rather than inputs.* so it reads correctly
          # for BOTH trigger shapes. Skipped (left empty) when this dispatch is a no-op — nothing downstream
          # reads them in that case, but every later step still gets a real (empty) value, never unset.
          EXPORT_DIR=""
          CENSUS_ROWS_PATH=""
          CENSUS_ROWS_BASENAME=""
          if [ "$RUN_SKIP" != "true" ]; then
            EXPORT_DIR="scripts/_snapshots/population-${{ github.run_id }}"
            if [ "$RUN_FLYWHEEL_BACKLOG" = "true" ]; then
              echo "flywheel_backlog=true — export/mint steps below are skipped; CENSUS_ROWS_PATH/CENSUS_ROWS_BASENAME are unused this dispatch."
            elif [ -n "$RUN_ROWS_FILE" ]; then
              CENSUS_ROWS_PATH="$RUN_ROWS_FILE"
              echo "using rows_file — export-census-rows.mjs will be skipped: $CENSUS_ROWS_PATH"
            else
              CENSUS_ROWS_PATH="scripts/_snapshots/population-${{ github.run_id }}/census-rows.json"
            fi
            if [ -n "$CENSUS_ROWS_PATH" ]; then
              BASE="$(basename "$CENSUS_ROWS_PATH")"
              CENSUS_ROWS_BASENAME="${BASE%.json}"
            fi
          fi

          {
            echo "RUN_MODE=$RUN_MODE"
            echo "RUN_LIMIT=$RUN_LIMIT"
            echo "RUN_LIMIT_FLAG=$RUN_LIMIT_FLAG"
            echo "RUN_UPSTREAM_RUN_ID=${UPSTREAM_RUN_ID:-}"
            echo "RUN_UPSTREAM_NAME=${UPSTREAM_NAME:-}"
            # The run id writeRunArtifact stamps as every artifact's top-level upstream_run_id (lane CHAIN-1,
            # 2026-10-07, finding F3): the same convention ledger-consume/corpus-turn/fetch-drain already use.
            echo "GITHUB_EVENT_WORKFLOW_RUN_ID=${UPSTREAM_RUN_ID:-}"
            echo "RUN_SOURCE_ID=$RUN_SOURCE_ID"
            echo "RUN_CELEX_PREFIX=$RUN_CELEX_PREFIX"
            echo "RUN_CAPTURE=$RUN_CAPTURE"
            echo "RUN_ROWS_FILE=$RUN_ROWS_FILE"
            echo "RUN_FLYWHEEL_BACKLOG=$RUN_FLYWHEEL_BACKLOG"
            echo "RUN_BACKLOG_MAX_ARTIFACTS=$RUN_BACKLOG_MAX_ARTIFACTS"
            echo "RUN_SKIP=$RUN_SKIP"
            echo "EXPORT_DIR=$EXPORT_DIR"
            echo "CENSUS_ROWS_PATH=$CENSUS_ROWS_PATH"
            echo "CENSUS_ROWS_BASENAME=$CENSUS_ROWS_BASENAME"
          } >> "$GITHUB_ENV"
          {
            echo "RUN_TRIGGER_CONTEXT<<__RUN_TRIGGER_CONTEXT_EOF__"
            echo "$RUN_TRIGGER_CONTEXT"
            echo "__RUN_TRIGGER_CONTEXT_EOF__"
            echo "RUN_SKIP_REASON<<__RUN_SKIP_REASON_EOF__"
            echo "$RUN_SKIP_REASON"
            echo "__RUN_SKIP_REASON_EOF__"
          } >> "$GITHUB_ENV"

          if [ "$RUN_SKIP" = "true" ]; then
            echo "::notice::population-turn NO-OP — $RUN_SKIP_REASON"
          else
            echo "population-turn proceeding: mode=$RUN_MODE limit=$RUN_LIMIT flywheel_backlog=$RUN_FLYWHEEL_BACKLOG trigger_context=${RUN_TRIGGER_CONTEXT:-(none - workflow_dispatch)}"
          fi

      # UNCONDITIONAL (lane CHAIN-1, 2026-10-07): a NO-OP firing records its own row (the "Record a NO-OP run"
      # step below) and lands it, and landing needs @supabase/supabase-js, so Node and the install run on every
      # firing, the same posture downstream-chain.yml already holds for its always-recorded artifact.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        if: ${{ env.RUN_SKIP != 'true' }}
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      # ── hydrate UNMERGED sibling artifacts so this run's mint-run_id (and, now, forward-events-run_id)
      # cannot collide ────────────────────────────────────────────────────────────────────────────────
      # Same problem, same fix as source-sweep.yml's own step (see that file's comment for the full
      # rationale). Extended (lane TANDEM, 2026-09-04) to also hydrate scripts/harness-runs/forward-events/.
      - name: Hydrate unmerged mint + forward-events artifacts from sibling population branches (run_id collision guard)
        if: ${{ env.RUN_SKIP != 'true' }}
        run: |
          git fetch --no-tags origin '+refs/heads/population/*:refs/remotes/origin/population/*' || true
          : > /tmp/hydrated-artifacts.txt
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/population/*'); do
            for family_dir in fsi-app/scripts/harness-runs/mint/ fsi-app/scripts/harness-runs/forward-events/; do
              for f in $(git ls-tree -r --full-tree --name-only "$b" -- "$family_dir"); do
                rel="${f#fsi-app/}"
                if [ ! -e "$rel" ]; then
                  mkdir -p "$(dirname "$rel")"
                  git show "$b:$f" > "$rel"
                  echo "$rel" >> /tmp/hydrated-artifacts.txt
                fi
              done
            done
          done
          echo "hydrated $(wc -l < /tmp/hydrated-artifacts.txt) unmerged mint/forward-events file(s) from sibling population branches"

      # THE GATE (apply mode only, and never on a flywheel_backlog dispatch — that dispatch's whole job IS
      # to clear what THE GATE refuses, so gating it would be circular) — see the header comment above for
      # the full rationale. Filesystem-only (readRunHistory over whatever mint-run-NNN.json files are on
      # this checkout, hydrated siblings included), so it runs before "Verify required secrets" would even
      # matter and before this run spends any budget on export-census-rows.mjs.
      # (coordinator, 2026-09-04, first backlog dispatch, Population turn #22 FAILED at the discover step): a
      # `type: boolean` input is a BOOLEAN in expressions; comparing it to the STRING 'true' coerces both to
      # numbers (true -> 1, 'true' -> NaN), so `!= 'true'` was always true and every skipped step ran. Compare
      # to the bare boolean `true`; inside `run:` blocks the interpolated text "true" is still correct.
      # (lane CHAIN, 2026-09-04): now reads env.RUN_MODE/env.RUN_FLYWHEEL_BACKLOG (plain strings written by
      # the resolve step above via GITHUB_ENV, never `inputs.*` directly) — the exact class of bug this
      # comment already warns about would otherwise resurface on a workflow_run dispatch, whose `inputs`
      # context is always empty.
      - name: 'Gate: refuse a new slice while a prior one is left unconnected (apply mode only, not on a backlog dispatch)'
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_MODE == 'apply' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: node scripts/turns/run-population-flywheel.mjs --check-gate --harness-runs-dir scripts/harness-runs/mint

      - name: Snapshot existing mint-run artifacts (for this run's new run_id discovery)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          ls scripts/harness-runs/mint/mint-run-*.json 2>/dev/null | sort > /tmp/mint-before.txt || true

      - name: stamp-wo26-archive-reason.mjs (archive_reason hygiene — apply only in apply mode)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/mint/stamp-wo26-archive-reason.mjs --apply
          else
            node scripts/mint/stamp-wo26-archive-reason.mjs
          fi

      - name: export-census-rows.mjs
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_ROWS_FILE == '' }}
        run: |
          if [ "$RUN_FLYWHEEL_BACKLOG" = "true" ]; then
            echo "flywheel_backlog=true — export-census-rows.mjs skipped (backlog mode mints nothing)."
            exit 0
          fi
          mkdir -p "$EXPORT_DIR"
          # RUN_LIMIT_FLAG is --limit on a hand workflow_dispatch, --max-items on a workflow_run-chained
          # dispatch (THE POPULATION CAP, this file's own header)  --  export-census-rows.mjs's own
          # resolveExportLimit enforces the hard ceiling of 100 only on --max-items, so the chained path
          # must never fall back to the uncapped --limit flag.
          args=("$RUN_LIMIT_FLAG" "$RUN_LIMIT" --out "$CENSUS_ROWS_PATH")
          if [ -n "$RUN_SOURCE_ID" ]; then args+=(--source-id "$RUN_SOURCE_ID"); fi
          if [ -n "$RUN_CELEX_PREFIX" ]; then args+=(--celex-prefix "$RUN_CELEX_PREFIX"); fi
          if [ "$RUN_CAPTURE" = "true" ]; then args+=(--capture); fi
          node scripts/mint/export-census-rows.mjs "${args[@]}"

      - name: Skip export-census-rows.mjs (rows_file supplied)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_ROWS_FILE != '' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          mkdir -p "$EXPORT_DIR"
          if [ ! -f "$CENSUS_ROWS_PATH" ]; then
            echo "::error::rows_file '$CENSUS_ROWS_PATH' does not exist in the checked-out tree — commit it (e.g. under scripts/_snapshots/population-browser/) before dispatching with rows_file set."
            exit 1
          fi
          echo "export-census-rows.mjs skipped — using rows_file: $CENSUS_ROWS_PATH"

      # run-mint-batch.mjs exits 1 when any payload fails validation (metrics.invalid > 0) — an EXPECTED
      # outcome for a batch that includes held/malformed census rows, not a fatal condition for this
      # workflow (the apply-ready file it wrote still carries every payload that DID validate). The `||
      # true` here is deliberate; the artifact + apply-ready file are the record of what happened, not
      # this step's own exit code.
      - name: run-mint-batch.mjs --census-rows --grade record --execute (the mint family's EXISTING gate, unmodified)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          args=(--census-rows "$CENSUS_ROWS_PATH" --grade record --execute --out-dir "$EXPORT_DIR")
          # THE POPULATION CAP + loop_run_id (lane M3, 2026-09-19, Amendment 2 item 4): only on a
          # workflow_run-chained dispatch (RUN_LIMIT_FLAG is --max-items only in that branch of the
          # resolve step above) does RUN_LIMIT hold the population cap this run actually used; a hand
          # dispatch's own --limit is a different concept and is never recorded as max_items.
          # RUN_UPSTREAM_RUN_ID is this dispatch's own upstream ledger-consume run id (empty on a hand
          # dispatch), already known from github.event.workflow_run.id, never a jq-derived value.
          if [ "$RUN_LIMIT_FLAG" = "--max-items" ]; then args+=(--max-items "$RUN_LIMIT"); fi
          if [ -n "$RUN_UPSTREAM_RUN_ID" ]; then args+=(--upstream-run-id "$RUN_UPSTREAM_RUN_ID"); fi
          node scripts/mint/run-mint-batch.mjs "${args[@]}" || true

      - name: Discover this run's new mint-run-NNN.json (set by run-mint-batch.mjs's collision-safe claim)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          ls scripts/harness-runs/mint/mint-run-*.json 2>/dev/null | sort > /tmp/mint-after.txt || true
          NEW_MINT_RUN="$(comm -13 /tmp/mint-before.txt /tmp/mint-after.txt | head -1)"
          if [ -z "$NEW_MINT_RUN" ]; then
            echo "::error::no new scripts/harness-runs/mint/mint-run-NNN.json appeared after run-mint-batch.mjs — cannot proceed to apply-mint-batch.mjs."
            exit 1
          fi
          echo "NEW_MINT_RUN=$NEW_MINT_RUN" >> "$GITHUB_ENV"
          echo "This run's mint-run artifact: $NEW_MINT_RUN"

      - name: apply-mint-batch.mjs (coordinator-apply — apply only in apply mode)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          # --report is technically optional (apply-mint-batch.mjs derives the same path from
          # --apply-ready's own basename, defaultReportPathFor) — named explicitly here anyway, so the
          # validation_failed hold-back (lane URL-GUIL, 2026-09-03) has an unambiguous input regardless of
          # any future change to that derivation.
          args=(--apply-ready "$EXPORT_DIR/${CENSUS_ROWS_BASENAME}.apply-ready.json" --report "$EXPORT_DIR/${CENSUS_ROWS_BASENAME}.mint-batch-report.json" --census-rows "$CENSUS_ROWS_PATH" --mint-run "$NEW_MINT_RUN")
          if [ "$RUN_MODE" = "apply" ]; then args+=(--apply); fi
          node scripts/mint/apply-mint-batch.mjs "${args[@]}"

      # Post-apply reconciliation: a record-grade row whose provenance_status is stale against what
      # validate_item_provenance derives now is touched through the guarded path so the trigger re-derives
      # it (run #8, 2026-09-02: ten items stamped quarantined before their gate row existed). Dry in dry
      # mode (lists), apply in apply mode. Never sets the status itself.
      - name: rederive-record-provenance.mjs (heal stale provenance stamps — apply only in apply mode)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          if [ "$RUN_MODE" = "apply" ]; then node scripts/mint/rederive-record-provenance.mjs --apply; else node scripts/mint/rederive-record-provenance.mjs; fi

      # Relevance reconciliation: any LIVE record-grade item the screen (rules + the operator's reviewed
      # verdicts) rules off-vertical is archived reversibly (archive_reason off_vertical) through the
      # guarded path; ambiguous items are listed for a ruling. Runs #9–#11 minted from the unscreened
      # pool (2026-09-02); the export gate stops the recurrence, this step reconciles what landed.
      # Ruled 2026-09-02: the five flagged verdicts (TEN-T, aerodynamic devices, CCNR positions, CEF,
      # authorised weight) are on-vertical and the screen was corrected; the remainder of the off-vertical
      # list stands. Apply mode archives them reversibly (archive_reason off_vertical, snapshot per chunk);
      # ambiguous items are listed, never archived.
      - name: screen-reconcile-records.mjs (archive off-vertical record items reversibly — apply only in apply mode)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          if [ "$RUN_MODE" = "apply" ]; then node scripts/mint/screen-reconcile-records.mjs --apply; else node scripts/mint/screen-reconcile-records.mjs; fi

      # THE FLYWHEEL (lane TANDEM, 2026-09-04) — MANDATORY, MINT-RUNBOOK.md §8/§9, run by the workflow
      # itself; the coordinator's job is to read the outcomes. Runs after screen-reconcile-records.mjs so
      # any item that step just archived off-vertical is naturally excluded (discover-for-items.mjs's own
      # corpus load filters is_archived=false; an id no longer in scope is reported "not found in the
      # verified/live corpus," never a crash). --mint-run reads THIS run's own (apply-mint-batch.mjs-
      # enriched) mint-run-NNN.json, extracts exactly the item ids this batch actually minted, and runs
      # discovery + forward-event extraction + recluster + derive-obligations + tag-proposals +
      # tag-ratification + the §9 outcomes write, in order — see that script's own header for the full
      # per-step contract and the dry-mode preview it runs instead when mode=dry. NO `|| true`: a failed
      # flywheel step fails this job — a green run means minted AND connected AND recorded, never merely
      # minted. `--trigger-context` (lane CHAIN, 2026-09-04) passes this dispatch's own RUN_TRIGGER_CONTEXT
      # through unchanged — {name, run_id, conclusion} of the upstream run for a chained dispatch, or
      # nothing (null) for a hand dispatch — so it lands in metrics.trigger_context on this batch's own
      # mint-run-NNN.json (run-population-flywheel.mjs's write-outcomes step, §9) and the coordinator can
      # always tell, from the artifact alone, whether a batch was hand-dispatched or chained and, if
      # chained, exactly which upstream run fired it.
      - name: run-population-flywheel.mjs (discovery + forward-events + recluster + tags + §9 outcomes — MANDATORY, MINT-RUNBOOK.md §8/§9)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG != 'true' }}
        run: |
          args=(--mint-run "$NEW_MINT_RUN" --mode "$RUN_MODE")
          if [ -n "$RUN_TRIGGER_CONTEXT" ]; then args+=(--trigger-context "$RUN_TRIGGER_CONTEXT"); fi
          node scripts/turns/run-population-flywheel.mjs "${args[@]}"

      # BACKLOG MODE (lane TANDEM-2, 2026-09-04) — see the header comment above ("BACKLOG MODE") and
      # run-population-flywheel.mjs --backlog's own header for the full contract. Runs INSTEAD of every
      # export/mint/apply/reconcile/normal-flywheel step above (all skipped via RUN_FLYWHEEL_BACKLOG !=
      # 'true' on this dispatch) — this mode mints nothing; it only connects what earlier runs already
      # minted. NO `|| true` here either: the same "a green run means connected, never merely attempted"
      # posture. `flywheel_backlog` is workflow_dispatch-only (RUN_FLYWHEEL_BACKLOG is always "false" on a
      # workflow_run dispatch — see the resolve step above), so this step never fires on a chained run.
      - name: run-population-flywheel.mjs --backlog (MINT-RUNBOOK.md §8/§9 over the EXISTING gate backlog, oldest first)
        if: ${{ env.RUN_SKIP != 'true' && env.RUN_FLYWHEEL_BACKLOG == 'true' }}
        run: |
          args=(--backlog --mode "$RUN_MODE" --harness-runs-dir scripts/harness-runs/mint)
          if [ -n "$RUN_BACKLOG_MAX_ARTIFACTS" ]; then args+=(--max-artifacts "$RUN_BACKLOG_MAX_ARTIFACTS"); fi
          node scripts/turns/run-population-flywheel.mjs "${args[@]}"

      # CACHE FLUSH AFTER EVERY APPLY (CAP-1000, 2026-09-05, "two defects one cause" audit). apply-
      # mint-batch.mjs already flushes in-process when it mints (minted > 0) — but rederive-record-
      # provenance.mjs (provenance_status), screen-reconcile-records.mjs (is_archived — items disappear
      # from listings), and run-population-flywheel.mjs (obligations via derive-obligations.mjs, tags via
      # tag-ratification.mjs) all write through the guarded path in apply mode with NO flush of their own,
      # in both the normal path and --backlog mode. Flushes unconditionally on any real (non-skipped)
      # apply — revalidateTag is idempotent/cheap, so this is a harmless no-op alongside apply-mint-
      # batch.mjs's own flush, not a duplicate write. Reuses the SAME CLI (scripts/lib/revalidate.mjs's
      # `main()`, tested in revalidate.test.mjs) — no second copy of the POST-to-/api/revalidate logic.
      # `|| true`: best-effort, same "no APP_URL: say so, never fail the job" contract revalidate.mjs's own
      # revalidateTags() already implements.
      - name: Flush public/detail caches after a real apply (every apply, not mint alone)
        if: ${{ always() && env.RUN_SKIP != 'true' && env.RUN_MODE == 'apply' }}
        run: node scripts/lib/revalidate.mjs --apply app-data public-items regulations-detail market-detail operations-detail research-detail || true

      - name: Remove hydrated sibling artifacts (they belong to their own branches)
        if: always()
        run: |
          if [ -s /tmp/hydrated-artifacts.txt ]; then xargs -a /tmp/hydrated-artifacts.txt rm -f; fi
          rm -rf scripts/harness-runs/*/.claims

      # scripts/_snapshots/ is gitignored (guarded-write prior-value snapshots stay off the repo by
      # default) — EXCEPT this run's own census-rows/apply-ready/report/held files, which are the
      # population-turn's full trace and are force-added here deliberately. db.mjs's own per-write
      # prior-value snapshot JSONL files land directly under scripts/_snapshots/*.jsonl (a DIFFERENT path
      # than $EXPORT_DIR), so they are never swept up by this add and stay off the repo, unchanged.
      #
      # Both scripts/harness-runs/mint (this run's enriched mint-run-NNN.json, now carrying the §9
      # outcomes) AND scripts/harness-runs/forward-events (the flywheel step's own forward-events-run-NNN.json,
      # emitted by run-extraction.mjs/apply-extraction-output.mjs as part of MINT-RUNBOOK.md §8) must be
      # staged here — a green run means minted AND connected AND recorded, and "recorded" covers both
      # families' artifacts, not just mint's. On a RUN_SKIP=true (no-op) dispatch nothing was ever written,
      # so `git diff --cached --quiet` is true below and this step is a harmless no-op too.
      # R22 (2026-10-02, coordinator correction): removed the git add / checkout -b / commit / fetch+
      # rebase / push / PR-body sequence that used to precede this call. deliver-artifact-branch.sh's own
      # header has said since lane STATUTORY-WRITER (2026-09-29) that it does "no git add, no branch, no
      # commit, no fetch, no rebase, no push, no PR, anywhere in this pipeline" -- the branch/commit/push
      # code above was dead relative to that rewrite (the operator's own ruling, "not once that I need a
      # pull request from GitHub", quoted in that script's header). Same single-label call shape every
      # other caller in this repo now uses.
      #
      # FLAGGED, NOT FIXED (CLAUDE.md rule 13): this removal is NOT uniform across what the dead step used
      # to commit. scripts/harness-runs/mint, scripts/harness-runs/forward-events, and $EXPORT_DIR
      # (scripts/_snapshots/population-<run_id>/) are all the same regenerable-scratch-or-harness-artifact
      # class the other three corrected workflows carry, and losing their branch delivery matches this
      # lane's posture there. scripts/turns/brief-export/pending is DIFFERENT IN KIND: it is a genuinely
      # tracked, non-gitignored queue directory (its own committed README.md) that task 3.5 step 12 relies
      # on reaching origin for a session lane to drain -- not scratch, not a harness artifact, a real
      # mechanism. Removing its git add/commit/push here means a newly-queued brief-export part this run
      # writes under that path no longer reaches origin at all (it was never uploaded as an Actions
      # artifact either). This lane executed the coordinator's instruction as given, uniformly across all
      # four files, but did not independently verify this specific consequence is intended; see this
      # lane's session-log addendum.
      # A legitimate NO-OP is still a run (lane CHAIN-1, 2026-10-07, finding F3 / rule 17): when the resolve step
      # decided there was nothing to chain from, this writes a `mint` family row (config.noop, noop_reason, the
      # honest trigger, the upstream run id) that the landing step below lands, so the loop firing evidence can
      # place hop 03 on a run that decided to do nothing. Before this, a NO-OP wrote no row and hop 03 looked
      # as if it had never fired.
      - name: Record a NO-OP run (the chain decided there was nothing to do)
        if: ${{ always() && env.RUN_SKIP == 'true' }}
        run: |
          node scripts/lib/upstream-artifact.mjs noop --family mint --mode "$RUN_MODE" --reason "$RUN_SKIP_REASON" --upstream-name "$RUN_UPSTREAM_NAME" --upstream-run-id "$RUN_UPSTREAM_RUN_ID" --started-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Land this run's harness-run artifact(s) into harness_runs
        if: always()
        run: |
          bash scripts/turns/deliver-artifact-branch.sh "Population turn: run ${{ github.run_id }} (mode=${RUN_MODE})"

      # R22 (2026-10-01, Actions-storage remediation): narrowed from the whole fsi-app/scripts/_snapshots/
      # tree (guarded-write snapshots, regenerable per CLAUDE.md rule 5) to this run's own harness
      # artifacts across the three families this dispatch can touch (mint, forward-events,
      # ledger-consume), at a 7-day retention (down from 90). The export/apply-ready/report files, the
      # mint-run artifact, and the brief-export/pending queue entries this run may have written no longer
      # ride a git branch (R22, 2026-10-02, coordinator correction, see the removed commit step above) OR
      # this artifact (F68 forbids any upload path containing _snapshots; brief-export/pending was never
      # part of this upload at all). See docs/runbooks/fleet-budget-control.md and this lane's session-log
      # addendum for the open question this leaves.
      - name: Upload this run's harness artifacts as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: population-turn-${{ github.run_id }}
          path: |
            fsi-app/scripts/harness-runs/mint/
            fsi-app/scripts/harness-runs/forward-events/
            fsi-app/scripts/harness-runs/ledger-consume/
          if-no-files-found: ignore
          retention-days: 7
