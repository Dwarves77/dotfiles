name: Corpus turn

# THE RUNTIME the flywheel scripts (fsi-app/scripts/connections/*.mjs) and the forward-events harness
# (fsi-app/scripts/forward-events/run-extraction.mjs) never had. Same gap ADR-023 named for the data
# producers (producers.yml's own header): every one of these scripts is proven correct in a coordinator's
# sandbox that cannot reach Supabase, so it was born unrunnable — nothing in the design said WHERE a
# "turn" (one discovery + extraction + analysis pass over the corpus) actually executes. This workflow is
# that missing layer, following producers.yml's / data-audit-lane.yml's pattern exactly: GitHub Actions,
# the two repository secrets those workflows already inject, workflow_dispatch with a mode input, and a
# schedule block that stays commented out under the same build-mode ruling.
#
# WHAT ONE TURN DOES, IN ORDER (see docs/runbooks/CORPUS-TURN-RUNBOOK.md for the full walkthrough):
#   1. discover-for-items.mjs   — mint-time connection discovery for items that bypassed the mint hook.
#   2. export-corpus-for-extraction.mjs (new, this lane) — reads items+claims+sections lacking any
#      item_forward_events row into the corpus-file shape run-extraction.mjs consumes.
#   3. run-extraction.mjs       — the forward-events family's own canonical entry point; extracts dated
#      obligation events (writes nothing to the DB itself — PROTOCOL.md's own "the extractor never
#      writes" rule) and ALWAYS self-emits its own scripts/harness-runs/forward-events/ artifact.
#   4. apply-extraction-output.mjs (new, this lane) — the guarded-write-path "load" half PROTOCOL.md
#      always assigns to a coordinator: inserts run-extraction.mjs's emitted events through
#      db.mjs's guardedInsertMany, respecting migration 275's dedupe key (never migration 274's
#      superseded one — see that script's own header).
#   5. analyze-corpus.mjs       — clusters the connection graph into themes, detects coverage gaps, and
#      (behind --signals) proposes L4 signal candidates.
#
# TWO WAYS TO REQUEST A TURN:
#   - workflow_dispatch (Actions tab or `gh workflow run`): the operator/coordinator picks mode + an
#     optional --since override + whether to run the --signals pass. Runs from whatever ref triggered it
#     (normally master) and creates a fresh `turn/<run-id>` branch to land the run's own commit on.
#   - push to a `turn/**` branch: a coordinator session pushes an EMPTY branch named `turn/<date>` (or any
#     turn/* name) to REQUEST a turn without touching the Actions UI. A push-triggered turn always runs in
#     apply mode (a coordinator pushing a turn branch is by definition asking for the real thing, not a
#     preview) and lands its commit directly on that same branch — no new branch is created.
#
# BUILD MODE (operator ruling 2026-09-01, same standing rule producers.yml/data-audit-lane.yml record for
# their own families): no schedule while the site is being built — a turn happens by explicit dispatch or
# push, never on a timer. The schedule block below stays commented out; re-arming it when build mode ends
# is exactly this block, restored in one reviewed diff:
#   schedule:
#     - cron: '0 7 * * *'   # placeholder cadence only — the operator picks the real one at re-arm time
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY — the
# exact pair every guarded script in fsi-app/scripts/lib/db.mjs already requires, and the same pair
# producers.yml / data-audit-lane.yml already inject.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = fetch/read, print the plan, write nothing. apply = write through the guarded path.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      since:
        description: 'ISO date: rescope this turn to items created_at >= this date. Blank = use the last recorded turn date (scripts/turns/LAST-TURN.json), or 1970-01-01 (full backfill) on a repo with no marker yet.'
        required: false
        type: string
      signals:
        description: 'Also run analyze-corpus.mjs''s L4 signal-candidate pass (--signals).'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - 'turn/**'
  # schedule:
  #   - cron: '0 7 * * *'   # BUILD MODE (2026-09-01) — see header above; stays commented out until the
  #                          # operator explicitly re-arms it.

concurrency:
  group: corpus-turn
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  turn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need real branch history to create/push a turn branch and open a PR against master

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      - name: Resolve this run's mode + branch
        id: turn
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            # A coordinator pushed a turn/** branch to REQUEST a turn — always apply, land on that branch.
            echo "mode=apply" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "created_branch=false" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "branch=turn/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "created_branch=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure a real local branch (actions/checkout leaves a push event in detached HEAD)
        run: |
          if [ "${{ steps.turn.outputs.created_branch }}" = "true" ]; then
            git checkout -b "${{ steps.turn.outputs.branch }}"
          else
            git checkout -B "${{ steps.turn.outputs.branch }}"
          fi

      - name: This run's gates
        run: |
          echo "trigger  = ${{ github.event_name }}"
          echo "mode     = ${{ steps.turn.outputs.mode }}"
          echo "branch   = ${{ steps.turn.outputs.branch }}"

      - name: Resolve --since
        id: since
        run: |
          if [ -n "${{ inputs.since }}" ]; then
            echo "value=${{ inputs.since }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(node scripts/turns/last-turn-date.mjs)" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve --signals flag
        id: signals
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.signals }}" = "false" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--signals" >> "$GITHUB_OUTPUT"
          fi

      # ── hydrate UNMERGED sibling artifacts so this run's run_id cannot collide ──────────────────────
      # claimRunId (scripts/lib/run-artifact.mjs) numbers the next artifact from the files it can see in
      # the checked-out tree, i.e. master. Artifacts land through a PR, so a run dispatched before the
      # previous run's PR merged sees a stale count and claims the SAME run_id (source-sweep run #3 on
      # 2026-09-01 wrote a second "source-sweep-run-002" while run #2's was still on its branch). The
      # unmerged sibling branches are fetched and their forward-events artifacts placed in the working tree
      # (untracked; removed again before the commit step, never committed by this run) so the claim
      # counts above them. scripts/turns/LAST-TURN.json is deliberately NOT hydrated: a turn
      # dispatched before the previous apply turn merged simply re-covers a wider --since window, and
      # every step is idempotent (CORPUS-TURN-RUNBOOK.md, "The first full backfill").
      - name: Hydrate unmerged forward-events artifacts from sibling branches (run_id collision guard)
        run: |
          git fetch --no-tags origin '+refs/heads/turn/*:refs/remotes/origin/turn/*' || true
          : > /tmp/hydrated-artifacts.txt
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/turn/*'); do
            for f in $(git ls-tree -r --name-only "$b" -- fsi-app/scripts/harness-runs/forward-events/); do
              rel="${f#fsi-app/}"
              if [ ! -e "$rel" ]; then
                mkdir -p "$(dirname "$rel")"
                git show "$b:$f" > "$rel"
                echo "$rel" >> /tmp/hydrated-artifacts.txt
              fi
            done
          done
          echo "hydrated $(wc -l < /tmp/hydrated-artifacts.txt) unmerged forward-events file(s) from sibling branches"

      # ── 1. discover-for-items — mint-time connection discovery for items that bypassed the mint hook ──
      - name: discover-for-items.mjs
        run: |
          if [ "${{ steps.turn.outputs.mode }}" = "apply" ]; then
            node scripts/connections/discover-for-items.mjs --since "${{ steps.since.outputs.value }}" --execute
          else
            node scripts/connections/discover-for-items.mjs --since "${{ steps.since.outputs.value }}"
          fi

      # ── 2/3. forward-events: export this turn's corpus slice, then run the family's own runner ────────
      - name: export-corpus-for-extraction.mjs
        run: node scripts/turns/export-corpus-for-extraction.mjs --out /tmp/turn-corpus.json --since "${{ steps.since.outputs.value }}"

      # The corpus file and run-extraction.mjs's events/skipped outputs are this turn's FULL TRACES (the
      # forward-events artifact's full_trace_refs point at them). They live under scripts/_snapshots/
      # (gitignored) so the upload-artifact step below retains them for 90 days — forward-events-run-002's
      # refs pointed at /tmp on a runner that no longer exists, so its 276 skip reasons were unreadable.
      - name: run-extraction.mjs (forward-events)
        run: |
          mkdir -p "scripts/_snapshots/turn-${{ github.run_id }}"
          cp /tmp/turn-corpus.json "scripts/_snapshots/turn-${{ github.run_id }}/turn-corpus.json"
          if [ "${{ steps.turn.outputs.mode }}" = "apply" ]; then
            node scripts/forward-events/run-extraction.mjs --input "scripts/_snapshots/turn-${{ github.run_id }}/turn-corpus.json" --execute
          else
            node scripts/forward-events/run-extraction.mjs --input "scripts/_snapshots/turn-${{ github.run_id }}/turn-corpus.json"
          fi

      # ── 4. load the extracted events — apply mode only (dry mode's run-extraction.mjs wrote no events file) ──
      - name: apply-extraction-output.mjs
        if: steps.turn.outputs.mode == 'apply'
        run: node scripts/turns/apply-extraction-output.mjs --events "scripts/_snapshots/turn-${{ github.run_id }}/turn-corpus.events.json" --execute

      # ── 5. analyze-corpus — themes, coverage gaps, and (behind --signals) L4 signal candidates ─────────
      - name: analyze-corpus.mjs
        run: |
          if [ "${{ steps.turn.outputs.mode }}" = "apply" ]; then
            node scripts/connections/analyze-corpus.mjs ${{ steps.signals.outputs.flag }}
          else
            node scripts/connections/analyze-corpus.mjs --dry ${{ steps.signals.outputs.flag }}
          fi

      # ── record the turn marker — apply mode only; a dry run must never advance --since's default ───────
      - name: Record this turn's marker (apply mode only)
        if: steps.turn.outputs.mode == 'apply'
        run: node scripts/turns/last-turn-date.mjs --record "${{ steps.turn.outputs.started_at }}"

      # ── commit the harness-run artifacts (+ the turn marker) to the turn branch ─────────────────────────
      # scripts/_snapshots/** is gitignored (fsi-app/scripts/_snapshots/ in the repo-root .gitignore) — the
      # ruling is to keep it ignored rather than fight the rule, so its contents ride a workflow artifact
      # instead (next step), never a commit.
      - name: Remove hydrated sibling artifacts (they belong to their own branches)
        if: always()
        run: |
          if [ -s /tmp/hydrated-artifacts.txt ]; then xargs -a /tmp/hydrated-artifacts.txt rm -f; fi
          rm -rf scripts/harness-runs/*/.claims

      - name: Commit harness-run artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # LAST-TURN.json exists only after an apply-mode run (see the marker step); a dry run must
          # still commit any harness artifacts it produced. Found by corpus-turn run #1 (2026-09-01).
          git add scripts/harness-runs
          [ -f scripts/turns/LAST-TURN.json ] && git add scripts/turns/LAST-TURN.json || true
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "corpus-turn ${{ steps.turn.outputs.mode }}: run ${{ github.run_id }} (since ${{ steps.since.outputs.value }})"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push turn branch
        if: steps.commit.outputs.changed == 'true'
        run: git push origin HEAD:"${{ steps.turn.outputs.branch }}"

      - name: Upload scripts/_snapshots as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-turn-snapshots-${{ github.run_id }}
          path: fsi-app/scripts/_snapshots/
          if-no-files-found: ignore
          retention-days: 90

      - name: Open PR to master (skip if one is already open for this branch)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="${{ steps.turn.outputs.branch }}"
          existing="$(gh pr list --base master --head "$branch" --json number --jq '.[0].number' || true)"
          if [ -n "$existing" ]; then
            echo "PR #$existing already open for $branch — skipping create."
            exit 0
          fi
          body=$'Automated corpus turn (run ${{ github.run_id }}, trigger ${{ github.event_name }}).\n\nMode: ${{ steps.turn.outputs.mode }}\nSince: ${{ steps.since.outputs.value }}\nSignals flag: "${{ steps.signals.outputs.flag }}"\n\nLands the harness-run artifacts for this turn under scripts/harness-runs/** and the updated turn marker at scripts/turns/LAST-TURN.json. See docs/runbooks/CORPUS-TURN-RUNBOOK.md.'
          if ! gh pr create --base master --head "$branch" \
            --title "Corpus turn: $branch (mode=${{ steps.turn.outputs.mode }})" \
            --body "$body"; then
            # Seen on runs #3 (2026-09-01): "GitHub Actions is not permitted to create or approve pull
            # requests" — the repository setting Settings → Actions → General → Workflow permissions →
            # "Allow GitHub Actions to create and approve pull requests" is off. The turn's DB effects and
            # the pushed branch are both real; only the PR is missing. Open it by hand at the URL below.
            echo "::error::PR creation failed. The turn branch IS pushed. Open the PR by hand: https://github.com/${{ github.repository }}/compare/master...${branch}?expand=1 — or enable 'Allow GitHub Actions to create and approve pull requests' under Settings → Actions → General so future turns open their own."
            exit 1
          fi
