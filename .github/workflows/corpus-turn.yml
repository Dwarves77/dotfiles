name: Corpus turn

# THE RUNTIME the flywheel scripts (fsi-app/scripts/connections/*.mjs) and the forward-events harness
# (fsi-app/scripts/forward-events/run-extraction.mjs) never had. Same gap ADR-023 named for the data
# producers (producers.yml's own header): every one of these scripts is proven correct in a coordinator's
# sandbox that cannot reach Supabase, so it was born unrunnable — nothing in the design said WHERE a
# "turn" (one discovery + extraction + analysis pass over the corpus) actually executes. This workflow is
# that missing layer, following producers.yml's / data-audit-lane.yml's pattern exactly: GitHub Actions,
# the two repository secrets those workflows already inject, workflow_dispatch with a mode input, and a
# schedule block that stays commented out under the same build-mode ruling.
#
# ITEM SELECTION (lane TURNREQ, 2026-09-04 — see docs/runbooks/CORPUS-TURN-RUNBOOK.md and the 2026-09-04
# wiring audit's B1 Gap #2 / B2 §1): ONE mechanism, not two. `corpus_turn_requests` (migration 277) is
# filled by a trigger every time an item's provenance/archive/tag state changes outside the in-app mint
# hooks — a real, per-item record of "this needs a turn." This workflow's DEFAULT scope is now that ticket
# queue: `scripts/turns/consume-turn-requests.mjs` selects the oldest `limit` open tickets (bounded,
# grouped by item — migration 277's own partial-unique index guarantees at most one open ticket per item),
# and every downstream step runs over EXACTLY those item ids. `since` is an EXPLICIT BACKFILL OVERRIDE
# ONLY — set it to bypass the ticket queue entirely and rescope this turn by `created_at` the old way (no
# ticket is read or marked in that mode). The old mechanism, `scripts/turns/last-turn-date.mjs`'s
# `LAST-TURN.json` marker, is retired from this workflow's own selection logic — see that file's own header
# for why it still exists as a library (a different lane's file still imports it) without being called here.
#
# WHAT ONE TURN DOES, IN ORDER (see docs/runbooks/CORPUS-TURN-RUNBOOK.md for the full walkthrough):
#   1. Select this turn's scope   — ticket-queue mode (default): consume-turn-requests.mjs reads+bounds
#      the open queue and writes a snapshot; --since override mode: skip the ticket read entirely.
#   2. discover-for-items.mjs     — mint-time connection discovery for items that bypassed the mint hook,
#      scoped by --ids (ticket mode) or --since (override mode).
#   3. export-corpus-for-extraction.mjs — reads this scope's items+claims+sections lacking any
#      item_forward_events row into the corpus-file shape run-extraction.mjs consumes, scoped the same way.
#   4. run-extraction.mjs         — the forward-events family's own canonical entry point; extracts dated
#      obligation events (writes nothing to the DB itself — PROTOCOL.md's own "the extractor never
#      writes" rule) and self-emits its own scripts/harness-runs/forward-events/ artifact.
#   5. apply-extraction-output.mjs — the guarded-write-path "load" half PROTOCOL.md always assigns to a
#      coordinator: inserts run-extraction.mjs's emitted events through db.mjs's guardedInsertMany,
#      respecting migration 275's dedupe key (never migration 274's superseded one).
#   6. analyze-corpus.mjs         — clusters the WHOLE connection graph into themes, detects coverage
#      gaps, and (behind --signals) proposes L4 signal candidates. Always unscoped, every turn.
#   7. Mark tickets consumed      — apply mode + ticket-queue selection ONLY, and only after steps 2-6 have
#      ALL succeeded (GitHub Actions step ordering with no continue-on-error IS the "only after success"
#      guarantee — this step is simply unreached if an earlier one failed): consume-turn-requests.mjs
#      --mark-file retires EXACTLY the tickets read in step 1, never a fresh "what's open now" re-read.
#   8. Record this family's own harness-run artifact — corpus-turn-run-NNN.json (F28's
#      scripts/harness-runs/CONVENTION.md), every dispatch, dry or apply, "record it every batch, even
#      when zero."
#
# TWO WAYS TO REQUEST A TURN:
#   - workflow_dispatch (Actions tab or `gh workflow run`): the operator/coordinator picks mode + limit +
#     an optional --since override + whether to run the --signals pass. Runs from whatever ref triggered it
#     (normally master) and creates a fresh `turn/<run-id>` branch to land the run's own commit on.
#   - push to a `turn/**` branch: a coordinator session pushes an EMPTY branch named `turn/<date>` (or any
#     turn/* name) to REQUEST a turn without touching the Actions UI. A push-triggered turn always runs in
#     apply mode (a coordinator pushing a turn branch is by definition asking for the real thing, not a
#     preview) with the default limit (push events carry no `inputs.*`) and lands its commit directly on
#     that same branch — no new branch is created.
#
# BUILD MODE (operator ruling 2026-09-01, same standing rule producers.yml/data-audit-lane.yml record for
# their own families): no schedule while the site is being built — a turn happens by explicit dispatch or
# push, never on a timer. The schedule block below stays commented out; re-arming it when build mode ends
# is exactly this block, restored in one reviewed diff:
#   schedule:
#     - cron: '0 7 * * *'   # placeholder cadence only — the operator picks the real one at re-arm time
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY — the
# exact pair every guarded script in fsi-app/scripts/lib/db.mjs already requires, and the same pair
# producers.yml / data-audit-lane.yml already inject.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = fetch/read, print the plan, write nothing (no DB writes, no tickets marked). apply = write through the guarded path.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      limit:
        description: >-
          Max OPEN corpus_turn_requests tickets this turn selects (oldest-first; ignored when `since` is
          set). Default 200 matches THE GATE's own population-slice unit (docs/plans/complete-system-build-plan-2026-09-04.md
          §W2.1: "Slices of 200"). Arithmetic (docs/runbooks/CORPUS-TURN-RUNBOOK.md "First dispatch"):
          1,709 open tickets at registration ÷ 200 ≈ 9 dispatches drains today's backlog; this job's
          45-minute timeout comfortably covers 200 items at the per-item costs already measured elsewhere
          in this repo (mint's own batch step: ~0.45-0.6s/item for full validate+insert, heavier than this
          family's discovery-score + forward-event-extract; forward-events extraction itself measured at
          ~21ms for a whole 89-item batch) with headroom for checkout/npm-ci and the unscoped
          analyze-corpus.mjs pass. New tickets keep arriving via the trigger as items change, so this is a
          recurring, hand-dispatched cadence (rule 16: no schedule), not a one-time drain.
        required: true
        default: '200'
        type: string
      since:
        description: >-
          EXPLICIT BACKFILL OVERRIDE ONLY. An ISO date bypasses the corpus_turn_requests ticket queue
          entirely and rescopes this turn to items created_at >= this date (the pre-ticket mechanism) —
          no ticket is read or marked consumed in this mode. Blank (default) = ticket-queue mode: select
          the oldest `limit` open tickets, run the turn over exactly those items, mark them consumed only
          after every write below succeeds.
        required: false
        type: string
      signals:
        description: 'Also run analyze-corpus.mjs''s L4 signal-candidate pass (--signals).'
        required: true
        default: true
        type: boolean
  push:
    branches:
      - 'turn/**'
  # EVENT CHAINING, NOT A SCHEDULE (lane M3, 2026-09-19, build plan section 6.1 row M3; rule 16 is about
  # `schedule:`/cron blocks, not event chaining  --  see corpus-turn.yml's own W1.4/audit finding this hop
  # closes: "corpus-turn has no upstream"). Fires this workflow every time a `ledger-consume.yml` run
  # finishes; the job-level `if:` below only proceeds when that run's own conclusion was `success`, and
  # "This run's gates + ticket-queue gate" further below (the pre-existing "Select this turn's item scope"
  # step, unmodified) already skips steps 2-6 with a named reason when zero tickets are open  --  the SAME
  # mechanism a hand dispatch already relies on, not a second gate.
  workflow_run:
    workflows: ["Ledger consume"]
    types: [completed]
  # schedule:
  #   - cron: '0 7 * * *'   # BUILD MODE (2026-09-01) — see header above; stays commented out until the
  #                          # operator explicitly re-arms it.

concurrency:
  group: corpus-turn
  cancel-in-progress: false

permissions:
  contents: read # lane STATUTORY-WRITER, 2026-09-29: no git commit/branch/push/PR any more

jobs:
  turn:
    # Only proceed on an explicit dispatch/push, or a workflow_run whose triggering run actually SUCCEEDED
    # -- the SAME conditional fetch-drain.yml/ledger-consume.yml already use for their own workflow_run
    # trigger (a failed/cancelled ledger-consume produced nothing new worth a turn over).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cache flush after a real apply (CAP-1000, 2026-09-05): scripts/lib/revalidate.mjs POSTs the
      # ledger/detail cache tags to /api/revalidate. Same secret pair maintenance.yml/change-detection.yml
      # already use; absent, the helper skips and the 60s/300s cache backstops bound staleness.
      APP_URL: ${{ secrets.APP_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need real branch history to create/push a turn branch and open a PR against master

      # ── CHAINED DRY-RUN GUARD (rule 16, lane CHAINED-DRY-GUARD, 2026-09-29) ─────────────────────────
      # Build mode (system_state.scrape_cadence='off') means every runtime fires by explicit dispatch;
      # a workflow_run-chained firing is not one, so it MUST run dry regardless of whatever hardcoded
      # apply/plan default this workflow's own resolve step below would otherwise pick. Runs BEFORE
      # npm ci (chained-dry-guard.mjs is a zero-npm-dependency raw fetch) so nothing downstream can
      # reach an apply path before this gate has spoken. Exports CHAINED_FORCED_DRY (true/false) and
      # CHAINED_TRIGGER_LABEL, consumed below wherever this file currently hardcodes an apply/plan
      # default for a workflow_run firing. See scripts/lib/chained-dry-guard.mjs's own header.
      - name: Chained dry-run guard (build mode, rule 16)
        working-directory: fsi-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # --requested-mode (lane CHAIN-1, 2026-10-07, finding F5): the REAL requested mode, not a hardcoded apply.
          # A hand dispatch asks for inputs.mode; a chained firing has no inputs and asks for the apply default the
          # resolve step below uses, which the guard forces to dry while build mode is live. A dry dispatch used to
          # log "resolved mode=apply", which read as an armed run when it was not.
          node scripts/lib/chained-dry-guard.mjs --event "${{ github.event_name }}" --requested-mode "${{ inputs.mode || 'apply' }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      # THE UPSTREAM RUN ID (lane M3, 2026-09-19, mirrors ledger-consume.yml's/fetch-drain.yml's own
      # identical step): every run below reads this back through run-artifact.mjs's own writeRunArtifact
      # auto-stamp (config.upstream_run_id, and the loop-manifest gate's "trigger" field) so a
      # workflow_run-fired artifact names the ledger-consume run that triggered it. Empty on an explicit
      # workflow_dispatch/push (github.event.workflow_run.id is unset on those events).
      - name: Export upstream run id (workflow_run chaining only)
        run: echo "GITHUB_EVENT_WORKFLOW_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"

      - name: Resolve this run's mode + branch + limit
        id: turn
        run: |
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            # A coordinator pushed a turn/** branch to REQUEST a turn — always apply, land on that branch.
            # push events carry no workflow_dispatch inputs, so the limit input's default (200) is applied
            # here explicitly rather than left blank.
            echo "mode=apply" >> "$GITHUB_OUTPUT"
            echo "branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "created_branch=false" >> "$GITHUB_OUTPUT"
            echo "limit=200" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            # Chained off "Ledger consume" completing (lane M3, 2026-09-19, build plan section 6.1 row M3,
            # closing S2 finding 5's upstream half). A chained firing is by definition asking for the real
            # thing, the same posture the push trigger above already documents for itself  --  mode=apply, the
            # standard default limit, a fresh turn/<run_id> branch exactly like a hand dispatch creates.
            # Whether there is any real work to do is decided by "Select this turn's item scope" below
            # (has_scope=false, a named reason, when the ticket queue is empty)  --  the same gate a hand
            # dispatch already goes through, not a second one.
            # mode forced to "dry" by the CHAINED_FORCED_DRY guard step above whenever build mode is
            # live (rule 16, lane CHAINED-DRY-GUARD, 2026-09-29) -- a workflow_run firing is not the
            # explicit dispatch the push branch above genuinely is.
            turn_mode="apply"
            if [ "${CHAINED_FORCED_DRY:-false}" = "true" ]; then turn_mode="dry"; fi
            echo "mode=$turn_mode" >> "$GITHUB_OUTPUT"
            echo "branch=turn/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "created_branch=true" >> "$GITHUB_OUTPUT"
            echo "limit=200" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
            echo "branch=turn/${{ github.run_id }}" >> "$GITHUB_OUTPUT"
            echo "created_branch=true" >> "$GITHUB_OUTPUT"
            echo "limit=${{ inputs.limit }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure a real local branch (actions/checkout leaves a push event in detached HEAD)
        run: |
          if [ "${{ steps.turn.outputs.created_branch }}" = "true" ]; then
            git checkout -b "${{ steps.turn.outputs.branch }}"
          else
            git checkout -B "${{ steps.turn.outputs.branch }}"
          fi

      - name: This run's gates
        run: |
          echo "trigger  = ${{ github.event_name }}"
          echo "mode     = ${{ steps.turn.outputs.mode }}"
          echo "branch   = ${{ steps.turn.outputs.branch }}"
          echo "limit    = ${{ steps.turn.outputs.limit }}"

      # ── 1. Select this turn's scope: ticket queue (default) or an explicit --since backfill override ──
      # MODE 1 read only (never --mark-consumed here) — marking happens in a SEPARATE step (below step 6),
      # after this turn's writes have all succeeded, against this exact snapshot file (--mark-file).
      - name: Select this turn's item scope
        id: scope
        run: |
          mkdir -p "scripts/_snapshots/turn-${{ github.run_id }}"
          if [ -n "${{ inputs.since }}" ]; then
            echo "selection=since" >> "$GITHUB_OUTPUT"
            echo "since=${{ inputs.since }}" >> "$GITHUB_OUTPUT"
            echo "has_scope=true" >> "$GITHUB_OUTPUT"
            echo "ticket_count=0" >> "$GITHUB_OUTPUT"
            echo "corpus-turn (since-override mode): items created_at >= ${{ inputs.since }}; corpus_turn_requests is not read or marked in this mode."
          else
            TICKETS_PATH="scripts/_snapshots/turn-${{ github.run_id }}/tickets.json"
            IDS=$(node scripts/turns/consume-turn-requests.mjs --out "$TICKETS_PATH" --limit "${{ steps.turn.outputs.limit }}")
            COUNT=$(node -e "console.log(JSON.parse(require('fs').readFileSync('$TICKETS_PATH','utf8')).count)")
            echo "selection=tickets" >> "$GITHUB_OUTPUT"
            echo "since=" >> "$GITHUB_OUTPUT"
            echo "ids=$IDS" >> "$GITHUB_OUTPUT"
            echo "ticket_count=$COUNT" >> "$GITHUB_OUTPUT"
            echo "tickets_path=$TICKETS_PATH" >> "$GITHUB_OUTPUT"
            if [ "$COUNT" -gt 0 ]; then
              echo "has_scope=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_scope=false" >> "$GITHUB_OUTPUT"
              echo "corpus-turn (ticket-queue mode): 0 open tickets selected — a legitimate steady state, nothing to turn this dispatch."
            fi
          fi

      # ── hydrate UNMERGED sibling artifacts so this run's run_id cannot collide ──────────────────────
      # claimRunId (scripts/lib/run-artifact.mjs) numbers the next artifact from the files it can see in
      # the checked-out tree, i.e. master. Artifacts land through a PR, so a run dispatched before the
      # previous run's PR merged sees a stale count and claims the SAME run_id (source-sweep run #3 on
      # 2026-09-01 wrote a second "source-sweep-run-002" while run #2's was still on its branch). The
      # unmerged sibling branches are fetched and their forward-events (and corpus-turn) artifacts placed
      # in the working tree (untracked; removed again before the commit step, never committed by this run)
      # so the claim counts above them. scripts/turns/LAST-TURN.json is no longer hydrated or written by
      # this workflow (retired as this family's selection mechanism, lane TURNREQ, 2026-09-04 — see
      # scripts/turns/last-turn-date.mjs's own header) — every step is idempotent
      # (CORPUS-TURN-RUNBOOK.md, "The first full backfill").
      - name: Hydrate unmerged run artifacts from sibling branches (run_id collision guard)
        run: |
          git fetch --no-tags origin '+refs/heads/turn/*:refs/remotes/origin/turn/*' || true
          : > /tmp/hydrated-artifacts.txt
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/turn/*'); do
            for dir in forward-events corpus-turn; do
              for f in $(git ls-tree -r --full-tree --name-only "$b" -- "fsi-app/scripts/harness-runs/$dir/"); do
                rel="${f#fsi-app/}"
                if [ ! -e "$rel" ]; then
                  mkdir -p "$(dirname "$rel")"
                  git show "$b:$f" > "$rel"
                  echo "$rel" >> /tmp/hydrated-artifacts.txt
                fi
              done
            done
          done
          echo "hydrated $(wc -l < /tmp/hydrated-artifacts.txt) unmerged artifact file(s) from sibling branches"

      # ── 2. discover-for-items — mint-time connection discovery for items that bypassed the mint hook ──
      - name: discover-for-items.mjs
        if: steps.scope.outputs.has_scope == 'true'
        run: |
          if [ "${{ steps.scope.outputs.selection }}" = "tickets" ]; then
            SEL="--ids ${{ steps.scope.outputs.ids }}"
          else
            SEL="--since ${{ steps.scope.outputs.since }}"
          fi
          if [ "${{ steps.turn.outputs.mode }}" = "apply" ]; then
            node scripts/connections/discover-for-items.mjs $SEL --execute
          else
            node scripts/connections/discover-for-items.mjs $SEL
          fi

      # ── 3/4. forward-events: export this turn's corpus slice, then run the family's own runner ────────
      - name: export-corpus-for-extraction.mjs
        if: steps.scope.outputs.has_scope == 'true'
        run: |
          if [ "${{ steps.scope.outputs.selection }}" = "tickets" ]; then
            node scripts/turns/export-corpus-for-extraction.mjs --out /tmp/turn-corpus.json --ids "${{ steps.scope.outputs.ids }}"
          else
            node scripts/turns/export-corpus-for-extraction.mjs --out /tmp/turn-corpus.json --since "${{ steps.scope.outputs.since }}"
          fi

      # The corpus file and run-extraction.mjs's events/skipped outputs are this turn's FULL TRACES (the
      # forward-events artifact's full_trace_refs point at them). R22 (2026-10-01, Actions-storage
      # remediation): moved from scripts/_snapshots/turn-<run_id>/ (gitignored scratch, regenerable per
      # CLAUDE.md rule 5, and now a forbidden path substring per F68) to
      # scripts/harness-runs/corpus-turn/traces/turn-<run_id>/, the same family directory the harness
      # artifact itself lives in, so the upload-artifact step below retains them for 7 days (down from
      # 90) without re-introducing the _snapshots class. forward-events-run-002's refs pointed at /tmp on
      # a runner that no longer exists, so its 276 skip reasons were unreadable; this still fixes that.
      - name: run-extraction.mjs (forward-events)
        if: steps.scope.outputs.has_scope == 'true'
        run: |
          mkdir -p "scripts/harness-runs/corpus-turn/traces/turn-${{ github.run_id }}"
          cp /tmp/turn-corpus.json "scripts/harness-runs/corpus-turn/traces/turn-${{ github.run_id }}/turn-corpus.json"
          if [ "${{ steps.turn.outputs.mode }}" = "apply" ]; then
            node scripts/forward-events/run-extraction.mjs --input "scripts/harness-runs/corpus-turn/traces/turn-${{ github.run_id }}/turn-corpus.json" --execute
          else
            node scripts/forward-events/run-extraction.mjs --input "scripts/harness-runs/corpus-turn/traces/turn-${{ github.run_id }}/turn-corpus.json"
          fi

      # ── 5. load the extracted events — apply mode only (dry mode's run-extraction.mjs wrote no events file) ──
      - name: apply-extraction-output.mjs
        if: steps.turn.outputs.mode == 'apply' && steps.scope.outputs.has_scope == 'true'
        run: node scripts/turns/apply-extraction-output.mjs --events "scripts/harness-runs/corpus-turn/traces/turn-${{ github.run_id }}/turn-corpus.events.json" --execute

      - name: Resolve --signals flag
        id: signals
        run: |
          if [ "${{ github.event_name }}" != "push" ] && [ "${{ inputs.signals }}" = "false" ]; then
            echo "flag=" >> "$GITHUB_OUTPUT"
          else
            echo "flag=--signals" >> "$GITHUB_OUTPUT"
          fi

      # ── 6. analyze-corpus — themes, coverage gaps, and (behind --signals) L4 signal candidates ─────────
      # Always unscoped, every turn, regardless of has_scope — this is a whole-corpus recluster, not a
      # per-item step (same posture MINT-RUNBOOK.md §8 documents for the equivalent population-turn step).
      - name: analyze-corpus.mjs
        run: |
          if [ "${{ steps.turn.outputs.mode }}" = "apply" ]; then
            node scripts/connections/analyze-corpus.mjs ${{ steps.signals.outputs.flag }}
          else
            node scripts/connections/analyze-corpus.mjs --dry ${{ steps.signals.outputs.flag }}
          fi

      # ── 7. mark tickets consumed — apply mode + ticket-queue selection ONLY, and ONLY after steps 2-6 ──
      # have all succeeded. No continue-on-error anywhere above: if discover/export/extract/apply/analyze
      # failed, this step is simply never reached — that ordering IS the "only after the turn's writes
      # succeeded" guarantee, no extra bookkeeping needed. --mark-file retires EXACTLY the request rows
      # named in step 1's own snapshot (never a fresh "what's open now" re-read — see
      # consume-turn-requests.mjs's own MODE 2 header for why).
      - name: Mark consumed tickets (apply mode, ticket-queue selection, after this turn's writes succeeded)
        if: steps.turn.outputs.mode == 'apply' && steps.scope.outputs.selection == 'tickets' && steps.scope.outputs.has_scope == 'true'
        run: node scripts/turns/consume-turn-requests.mjs --mark-file "${{ steps.scope.outputs.tickets_path }}" --by "corpus-turn-${{ github.run_id }}"

      # CACHE FLUSH AFTER EVERY APPLY (CAP-1000, 2026-09-05, "two defects one cause" audit). Step 5
      # (apply-extraction-output.mjs) writes item_forward_events through the guarded path in apply mode —
      # rows the obligations register embeds (item_forward_events(obligation_text)) and derive-obligations
      # later turns into obligations rows read straight off it. Flushes unconditionally on any real apply
      # (revalidateTag is idempotent/cheap). Reuses the SAME CLI apply-mint-batch.mjs's own in-process call
      # already exercises (scripts/lib/revalidate.mjs's `main()`, tested in revalidate.test.mjs) — no
      # second copy of the POST-to-/api/revalidate logic. `|| true`: best-effort, same "no APP_URL: say so,
      # never fail the job" contract revalidate.mjs's own revalidateTags() already implements.
      - name: Flush public/detail caches after a real apply (every apply, not mint alone)
        if: always() && steps.turn.outputs.mode == 'apply'
        run: node scripts/lib/revalidate.mjs --apply app-data public-items regulations-detail market-detail operations-detail research-detail || true

      # ── 8. record THIS family's own harness-run artifact (F28 / CONVENTION.md) ─────────────────────────
      # "Emission is CODE" — the same posture run-mint-batch.mjs / run-extraction.mjs / screen-worklist.mjs
      # already hold for their own families (PROPOSER-RUNBOOK.md §5): every dispatch, dry or apply, writes
      # one, from a step that runs regardless of earlier failures (`if: always()`, guarded so a missing
      # scope/mode still produces a valid, honestly-empty artifact rather than skipping emission outright).
      - name: Record this turn's own harness-run artifact (corpus-turn family)
        if: always() && steps.turn.outcome == 'success'
        env:
          CT_SELECTION: ${{ steps.scope.outputs.selection }}
          CT_MODE: ${{ steps.turn.outputs.mode }}
          CT_LIMIT: ${{ steps.turn.outputs.limit }}
          CT_SINCE: ${{ steps.scope.outputs.since }}
          CT_TICKET_COUNT: ${{ steps.scope.outputs.ticket_count }}
          CT_HAS_SCOPE: ${{ steps.scope.outputs.has_scope }}
          CT_STARTED_AT: ${{ steps.turn.outputs.started_at }}
          CT_TICKETS_PATH: ${{ steps.scope.outputs.tickets_path }}
          CT_CORPUS_PATH: scripts/harness-runs/corpus-turn/traces/turn-${{ github.run_id }}/turn-corpus.json
          CT_CONSUMED: ${{ steps.turn.outputs.mode == 'apply' && steps.scope.outputs.selection == 'tickets' && steps.scope.outputs.has_scope == 'true' }}
          CT_SIGNALS: ${{ steps.signals.outputs.flag != '' }}
        run: node scripts/turns/emit-corpus-turn-artifact.mjs

      # ── commit the harness-run artifacts to the turn branch ─────────────────────────────────────────
      # scripts/harness-runs/** is NOT gitignored, but this family's own posture (every sibling family) is
      # to land via deliver-artifact-branch.sh (a DB write, no branch/commit/push) and let a workflow
      # artifact carry the raw files for short-lived human inspection instead.
      - name: Remove hydrated sibling artifacts (they belong to their own branches)
        if: always()
        run: |
          if [ -s /tmp/hydrated-artifacts.txt ]; then xargs -a /tmp/hydrated-artifacts.txt rm -f; fi
          rm -rf scripts/harness-runs/*/.claims

      # R22 (2026-10-01, Actions-storage remediation): narrowed from the whole fsi-app/scripts/_snapshots/
      # tree to this run's own harness artifacts (corpus-turn, forward-events); the forward-events
      # artifact's full_trace_refs now point under scripts/harness-runs/corpus-turn/traces/ (moved out of
      # _snapshots/ above), so they stay resolvable from this same upload without re-introducing the
      # _snapshots class or re-uploading every other family's guarded-write snapshots. Retention 7 days,
      # down from 90. See docs/runbooks/fleet-budget-control.md.
      - name: Upload this turn's harness artifacts and traces as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-turn-${{ github.run_id }}
          path: |
            fsi-app/scripts/harness-runs/corpus-turn/
            fsi-app/scripts/harness-runs/forward-events/
          if-no-files-found: ignore
          retention-days: 7

      - name: Land this turn's harness-run artifact(s) into harness_runs
        if: always()
        run: bash scripts/turns/deliver-artifact-branch.sh "Corpus turn (mode=${{ steps.turn.outputs.mode }}, run ${{ github.run_id }})"
