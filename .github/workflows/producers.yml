name: Data producers

# THE LAYER THE PRODUCER DESIGN NEVER HAD. See docs/decisions/ADR-023-producer-execution-model.md.
#
# Waves 4-7 built three stores, the producers that fill them, and the readers that display them, and
# shipped all three empty. Not caution, and not an unfinished producer: the environment that authors
# this codebase has no outbound access to the sources (ec.europa.eu, energy.ec.europa.eu, api.bls.gov
# — all HTTP 000 under the org egress policy, confirmed 2026-08-30) and none to Supabase either.
# Every producer was born unrunnable, because nothing in the design said WHERE one runs. This is that
# missing layer: a named runtime with a schedule.
#
# WHY HERE. This runner reaches the sources, already holds the two secrets a producer needs
# (NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY — the pair data-audit-lane.yml uses), and
# leaves a log an operator can read afterwards. Free minutes; every source is an open,
# unauthenticated, licence-cleared API. $0 in the standing sense: no metered call, no key, no charge.
#
# SCHEDULES MATCH EACH SOURCE'S REAL CADENCE, not a convenient round number:
#   * EU Weekly Oil Bulletin publishes Thursdays -> Friday 06:00 UTC.
#   * Eurostat nrg_pc_205 is bi-annual, BLS OEWS annual -> monthly, 1st at 06:20 UTC. Often enough to
#     catch a release within weeks, rare enough that the run is almost always a no-op upsert.
#     Over-polling an open API is not free in goodwill even when it is free in money.
#
# TWO GATES, GUARDING TWO DIFFERENT QUESTIONS (ADR-023 §3):
#   1. Each producer's source-level `const ENABLED` — "may this producer EVER write?" A
#      reviewed-code-change gate: arming shows up in `git diff`. That is what stops a schedule from
#      silently turning on a producer nobody vetted.
#   2. This workflow's `mode` — "is THIS run allowed to write?" Manual dispatch defaults to `dry`.
#      SCHEDULED RUNS APPLY, because a schedule that only ever dry-runs is theatre.
#   FAST DISARM is the Actions tab: disable this workflow and every producer stops immediately, with
#   no deploy. That matters more than fast arming, and a source constant alone cannot provide it —
#   you cannot stop a misbehaving worker with a pull request.
#
# DESNZ emission-factor seeder: ARMED 2026-08-30, after the gate it was held behind was discharged.
# It was held because its four ttw_co2e values came from a third-party republication rather than the
# primary DESNZ workbook (403 to the sandbox; .xlsx unparseable by the fetch tool). Both halves of
# that blocker were solved on 2026-08-30: the workbook was fetched in-browser from
# assets.publishing.service.gov.uk (clean 200 — the 403 was the sandbox egress proxy, not gov.uk) and
# read cell-for-cell by a manual ZIP central-directory walk + DecompressionStream('deflate-raw'), the
# same technique proven on the EU Weekly Oil Bulletin.
#
# THE HOLD WAS CORRECT. All four values were WRONG: -18.6%, +18.1%, +13.2%, -13.6% against the
# primary. The trap was a column layout that CHANGES within one sheet — 'Freighting goods' blocks
# vans by FUEL but HGVs by LADEN PERCENTAGE (row 40: D=0%, H=50%, L=100%, P=Average laden), so the
# average-laden total for an HGV is column P, not D. The fixture now carries the primary's values,
# the sheet/row/column for each, and gwp_basis AR5_GWP100 (stated verbatim in the workbook).
# "Populated, visible and wrong is worse than empty" held four bad official-class factors out of
# production.
#
# EPA emission-factor seeder: WIRED 2026-08-30, same day, as its own named dispatch option
# (epa-emission-factors), also deliberately excluded from 'all' for the reason stated on that step.
# EPA's two values were primary-verified separately (2025 GHG Emission Factors Hub, Table 8, read
# twice) and were correct from the start — no column trap here. But "correct" and "seeded through a
# guarded runtime" turned out to be two different claims. `emission-factors-common.mjs` and
# `emission-factors-epa.mjs` were both created in commit c6c228ff and untouched until today's
# orderBy fix (d5feb910), so the code path was IDENTICAL when EPA's two rows landed live on
# 2026-08-30 — and that code path was broken the whole time: `readAll` defaults its pagination
# `orderBy` to "id", `emission_factors` has no `id` column (PK is `factor_id`), so the live-rows read
# threw on every call, proven by producers run #11's own log. The seeder is fail-closed
# (`if (apply) throw e`), so an `--apply` through it would have ABORTED, not written. THEREFORE EPA'S
# TWO ROWS WERE NOT WRITTEN BY THIS SEEDER. Both share one `created_at` to the microsecond
# (2026-08-30 09:59:27.594741+00), a single batch insert, and the seeder was wired to no runtime at
# all until this workflow change — they were inserted by direct SQL from a coordinator session, which
# is how they bypassed the broken read. Consequence worth carrying forward: those two rows skipped
# the guarded write path, so they carry no snapshot and no cite. The values are correct and reconcile
# (`co2_fossil + ch4*28 + n2o*265 = ttw_co2e` holds for both), but their provenance trail is thinner
# than rule-015 requires. Re-seeding them through the now-working seeder is NOT authorised by this
# workflow change and must not be attempted here — a duplicate insert is worse than a thin trail, and
# the natural-key skip would refuse the write anyway.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = fetch, parse, print the plan, write nothing. apply = write through the guarded path.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      producer:
        description: 'Which producer to run.'
        required: true
        default: 'all'
        type: choice
        # eia-v2-petroleum-spot (lane SURF, 2026-09-01): scripts/producers/market/
        # eia-v2-petroleum-spot-producer.mjs — WTI/Brent/diesel/jet-fuel/RBOB/propane spot prices into
        # market_series. Listed here as a dispatchable choice per this lane's write-set instruction
        # ("producer choices only"), but deliberately has NO run step below yet and is not in 'all':
        # its live-fetch API key is registered only as a local-.env credential
        # (.discipline/governance/secrets-registry.mjs TOPOLOGY), not a github-actions one, and this
        # repo's secrets-reference-audit fails the build on any workflow secret reference not in
        # WORKFLOW_SECRETS — a run step reading that credential here would trip that gate. Registering
        # the credential as a GitHub Actions secret and adding its name to WORKFLOW_SECRETS (both outside
        # this lane's write set) is the prerequisite; once done, a run step mirroring the EU Weekly Oil
        # Bulletin step's dry/apply shape is the remaining wiring.
        options: [all, eurostat-nrg-pc-205, eurostat-lc-lci-lev, bls-oews, eu-weekly-oil-bulletin, ecb-fx, desnz-emission-factors, epa-emission-factors, eia-v2-petroleum-spot, refresh-published-price-statistics]
      since:
        description: 'Optional backfill start date (YYYY-MM-DD) for the EU Weekly Oil Bulletin history file. Leave empty for the normal latest-week fetch. Ignored by every other producer.'
        required: false
        default: ''
        type: string
  # BUILD MODE (operator ruling 2026-08-30): no schedule while the site is being built — population
  # happens by explicit dispatch, read, then applied. The runtime, both gates, and the cadence notes
  # above all stay, so re-arming when build mode ends is exactly this block, restored in one reviewed
  # diff:
  #   schedule:
  #     - cron: '0 6 * * 5'    # EU Weekly Oil Bulletin — published Thursday, read Friday
  #     - cron: '20 6 1 * *'   # Eurostat (bi-annual) + BLS OEWS (annual) — monthly sweep

concurrency:
  group: data-producers
  cancel-in-progress: false

env:
  # Build mode: dispatch-only, so the mode and producer are exactly what the operator picked. When the
  # schedule block is restored, restore the schedule-aware expressions with it (see git history at this
  # line for the exact pair).
  RUN_MODE: ${{ inputs.mode }}
  RUN_PRODUCER: ${{ inputs.producer }}
  RUN_SINCE: ${{ inputs.since }}

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      - name: This run's gates
        run: |
          echo "trigger  = ${{ github.event_name }} ${{ github.event.schedule }}"
          echo "mode     = $RUN_MODE"
          echo "producer = $RUN_PRODUCER"
          echo "since    = ${RUN_SINCE:-(none — normal latest-week fetch)}"
          echo "A producer whose own ENABLED flag is false no-ops regardless of mode. That is the"
          echo "arming gate working as designed, not a failure — arm it in source, in a reviewed commit."

      - name: Population BEFORE
        run: node scripts/verify/population-report.mjs

      - name: Eurostat nrg_pc_205 -> regional_data_facts
        if: env.RUN_PRODUCER == 'all' || env.RUN_PRODUCER == 'regional' || env.RUN_PRODUCER == 'eurostat-nrg-pc-205'
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/producers/regional/eurostat-nrg-pc-205-producer.mjs --apply
          else
            node scripts/producers/regional/eurostat-nrg-pc-205-producer.mjs
          fi

      # eurostat-lc-lci-lev (lane DP-SURF, system-completion train, 2026-09-02): hourly labour cost levels
      # (EUR/hour, lc_lci_lev) so an EU region carries the wage fact automate-vs-hire reads alongside the
      # nrg_pc_205 energy fact. Same two gates as its siblings (ENABLED const + this workflow's mode); the
      # runtime kill switch is set here exactly as the oil-bulletin and ecb-fx steps set theirs, so the
      # Actions tab remains the fast disarm.
      - name: Eurostat lc_lci_lev -> regional_data_facts
        if: env.RUN_PRODUCER == 'all' || env.RUN_PRODUCER == 'regional' || env.RUN_PRODUCER == 'eurostat-lc-lci-lev'
        env:
          REGIONAL_PRODUCER_EUROSTAT_LC_LCI_LEV_ENABLED: '1'
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/producers/regional/eurostat-lc-lci-lev-producer.mjs --apply
          else
            node scripts/producers/regional/eurostat-lc-lci-lev-producer.mjs
          fi

      - name: BLS OEWS -> regional_data_facts
        if: env.RUN_PRODUCER == 'all' || env.RUN_PRODUCER == 'regional' || env.RUN_PRODUCER == 'bls-oews'
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/producers/regional/bls-oews-producer.mjs --apply
          else
            node scripts/producers/regional/bls-oews-producer.mjs
          fi

      - name: EU Weekly Oil Bulletin -> market_series
        # Two-stage: fetch-oil-bulletin.mjs (2026-08-30) downloads the live workbook and extracts the
        # latest week's EU-average prices to a normalized CSV — writes nothing, no kill switch of its
        # own (see its header). eu-weekly-oil-bulletin.mjs then reads that CSV via --input and does the
        # actual guarded parse -> plan -> write, gated by --apply + the env switch below, unchanged.
        # --since (Lane PROD, 2026-09-02): an optional backfill start date, passed through to
        # fetch-oil-bulletin.mjs unchanged. Empty (the default) is the normal latest-week fetch this step
        # has always done. eu-weekly-oil-bulletin.mjs itself needs no branch here — it reads whatever CSV
        # /tmp/wob.csv holds, one week or many, through the SAME --input/--apply gate either way (see
        # fetch-oil-bulletin.mjs's own header, "HISTORY BACKFILL (--since)").
        if: env.RUN_PRODUCER == 'all' || env.RUN_PRODUCER == 'eu-weekly-oil-bulletin'
        env:
          MARKET_PRODUCER_EU_OIL_BULLETIN_ENABLED: '1'
        run: |
          if [ -n "$RUN_SINCE" ]; then
            node scripts/producers/market/fetch-oil-bulletin.mjs --since "$RUN_SINCE" --out /tmp/wob.csv
          else
            node scripts/producers/market/fetch-oil-bulletin.mjs --out /tmp/wob.csv
          fi
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/producers/market/eu-weekly-oil-bulletin.mjs --input /tmp/wob.csv --apply
          else
            node scripts/producers/market/eu-weekly-oil-bulletin.mjs --input /tmp/wob.csv
          fi

      - name: ecb-fx (ECB euro reference rates; ENABLED gate in the file, dry unless mode=apply)
        # ecb-fx-producer.mjs shipped earlier without a dispatch step (found by lane SURF, 2026-09-01).
        # Three gates as every market producer: reviewed-code ENABLED const (TRUE since 2026-09-02, Lane
        # PROD — see the producer's own header), the env switch below, --apply. A FOURTH condition this
        # step cannot see from here: migration 281_data_sources_ecb.sql (Lane PROD, 2026-09-02) must be
        # APPLIED to the live database before source_key 'ecb' resolves — until then an apply run fails
        # closed at the guarded INSERT (23503, foreign_key_violation), not at a gate message. A dry run is
        # unaffected either way (dry never reaches the guarded write).
        if: env.RUN_PRODUCER == 'all' || env.RUN_PRODUCER == 'ecb-fx'
        env:
          MARKET_PRODUCER_ECB_FX_ENABLED: '1'
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/producers/market/ecb-fx-producer.mjs --apply
          else
            node scripts/producers/market/ecb-fx-producer.mjs
          fi
      # eia-v2-petroleum-spot has NO run step yet: it needs the EIA_API_KEY repository secret, which only
      # the operator can create (then register in .discipline/governance/secrets-registry.mjs
      # WORKFLOW_SECRETS and add a step mirroring ecb-fx that maps EIA_API_KEY from the repository secret).
      # STILL TRUE as of 2026-09-02 (Lane PROD, system-completion train, re-checked against
      # .discipline/governance/secrets-registry.mjs and secrets-reference-audit.mjs this session):
      # EIA_API_KEY appears ONLY in TOPOLOGY's local-.env vault entry, not in the enforceable
      # WORKFLOW_SECRETS set — and secrets-reference-audit.mjs's auditSecretRefs scans EVERY GitHub
      # Actions secrets-context reference in every workflow file textually (no awareness of `if:`
      # guards; NOTE FOR THE NEXT READER: even naming the pattern here, spelled out with a literal dot
      # joining the two words, would itself trip that same scan — see the note it left on this exact
      # attempt, .discipline/governance/secrets-reference-audit.test.mjs's own failure log — so it is
      # deliberately NOT spelled out literally in this comment), failing the build on any secret name not
      # already in that set. A run step here reading EIA_API_KEY out of the secrets context — guarded by
      # an `if:` or not — would trip that audit today. secrets-registry.mjs is NOT in this lane's write
      # set (the dispatch explicitly names it as the one file to stop and report on rather than edit), so
      # this step stays absent; series-registry.mjs's eia-v2 entry is otherwise brought to parity in this
      # same commit (implemented:true, producerScript named — see that file).

      - name: refresh-published-price-statistics (derive published_price_statistics display rows from market_series)
        # WO-16.2's step 4 refresher (src/lib/market/refresh-published-price-statistics.mjs +
        # scripts/producers/market/refresh-published-price-statistics.mjs), wired to this runtime for the
        # first time 2026-09-02 (Lane PROD, system-completion train) — it shipped with the other market
        # producers but, like ecb-fx before this same commit, had no dispatch step of its own. Dry by
        # default (no --apply); this script's OWN header notes it plans/writes ZERO rows either way today
        # because SERIES_ITEM_MAP (the operator-ratified series -> item mapping) is empty — the empty map
        # IS the switch, same posture as every other kill-switched producer in this file. NOT in the 'all'
        # fan-out: it derives from market_series rather than fetching a source, so running it unconditionally
        # alongside every 'all' sweep would report the same "0 ratified entries" line every time until an
        # operator ratifies a mapping — dispatch it by name once one exists, the same posture the
        # DESNZ/EPA one-off seeders below take for their own reason.
        if: env.RUN_PRODUCER == 'refresh-published-price-statistics'
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/producers/market/refresh-published-price-statistics.mjs --apply
          else
            node scripts/producers/market/refresh-published-price-statistics.mjs
          fi

      - name: DESNZ modal defaults -> emission_factors
        # Seeds four GB freight modal_default rows from the fixture, through the guarded path
        # (scripts/lib/db.mjs guardedInsertMany), idempotent on the natural key — a re-run with the
        # rows already live writes nothing.
        #
        # THAT IDEMPOTENCY CLAIM WAS FALSE WHEN FIRST WRITTEN HERE (2026-08-30) and is recorded rather
        # than quietly corrected. The natural-key skip depends on reading the live rows first, and that
        # read always threw: readAll defaults its pagination `orderBy` to "id", and emission_factors is
        # keyed on `factor_id` with no `id` column at all. Run #11 (dry) printed
        # "already live (skip, idempotent): 0" that was the catch-block fallback, not a measurement.
        # The seeder is fail-closed (`if (apply) throw e`), so an --apply run would have ABORTED rather
        # than duplicating — but the guarantee this line asserts did not exist. Fixed by passing
        # orderBy:"factor_id" at the call site, pinned by two tests that bind the read to migration
        # 258's DDL. Caught by reading the dry-run plan before applying, per ADR-023 §4.
        #
        # NOT in the 'all' fan-out, deliberately. 'all' is the recurring data sweep: sources that
        # republish on a cadence. A published factor set is a ONE-OFF seed of a fixed annual table
        # (DESNZ 2025 v1, next publication June 2026), so sweeping it every run would be a no-op
        # upsert forever and would blur the line between "fetch what changed" and "seed what is
        # fixed". Dispatch it by name when the factor set changes.
        if: env.RUN_PRODUCER == 'desnz-emission-factors'
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/gen/emission-factors-desnz.mjs --apply
          else
            node scripts/gen/emission-factors-desnz.mjs
          fi

      - name: EPA modal defaults -> emission_factors
        # Seeds two US modal_default rows from the fixture, through the same guarded path and shared
        # natural-key idempotency module (scripts/gen/emission-factors-common.mjs) as the DESNZ step
        # above — both seeders share it, and the orderBy:"factor_id" fix documented on that step
        # corrects the live-rows read for both sources, not DESNZ alone.
        #
        # UNTIL TODAY THIS SEEDER WAS WIRED TO NOTHING. emission-factors-epa.mjs existed, was tested,
        # and had already contributed two live rows to emission_factors (2026-08-30) — but no workflow
        # and no script anywhere in the repo referenced it (confirmed by `git grep "emission-factors-epa"`:
        # only a doc comment and a help string turned up, no caller). Those two rows were NOT written by
        # this seeder: the shared read it depends on threw for the whole period they were inserted (see
        # the DESNZ step's history above), the seeder is fail-closed (`if (apply) throw e`), so an
        # --apply through it would have ABORTED rather than written. Both rows share one `created_at` to
        # the microsecond — a single batch insert — and the seeder had no runtime to originate from; they
        # were inserted by direct SQL from a coordinator session, bypassing the broken read. The values
        # are correct and reconcile (`co2_fossil + ch4*28 + n2o*265 = ttw_co2e` holds for both), but they
        # carry no snapshot and no cite because they skipped guardedInsertMany. Do NOT dispatch this step
        # with --apply to backfill that gap — the natural-key skip will just report both already live,
        # and a duplicate insert is worse than a thin provenance trail.
        #
        # NOT in the 'all' fan-out, deliberately, for the same reason as DESNZ above: 'all' is the
        # recurring data sweep for sources that republish on a cadence. A published EPA factor set is a
        # ONE-OFF seed of a fixed table (2025 GHG Emission Factors Hub), so sweeping it every run would
        # be a no-op upsert forever and would blur the line between "fetch what changed" and "seed what
        # is fixed". Dispatch it by name when the factor set changes.
        if: env.RUN_PRODUCER == 'epa-emission-factors'
        run: |
          if [ "$RUN_MODE" = "apply" ]; then
            node scripts/gen/emission-factors-epa.mjs --apply
          else
            node scripts/gen/emission-factors-epa.mjs
          fi

      # Runs even when a producer failed, so the log always ends with the true state of the stores
      # rather than only the exception that got there first.
      - name: Population AFTER
        if: always()
        run: node scripts/verify/population-report.mjs
