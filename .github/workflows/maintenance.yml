      - name: migration-299-precheck
        # Lane KIT-BACKFILL (2026-09-05, W2.3): the executable guard for migration 299 — see
        # scripts/mint/migration-299-precheck.mjs's own header and docs/runbooks/MAINTENANCE-RUNBOOK.md §8's
        # "kit-backfill and migration 299" subsection. Read-only (no DB write, `mode` is not read by the
        # script itself — dry and apply behave identically); exits 1 while N > 0, which `|| true` tolerates
        # so an 'all' dry fan-out or a legitimately-still-refusing named dispatch does not fail the job —
        # the coordinator reads exit-code intent from this step's own printed JSON / summary.json, same
        # posture as reopen-validation-holds's own `|| true` above. `arg: "post"` runs the POST-CHECK
        # (`--post`) instead of the default PRE-CHECK — dispatch that ONLY after `apply_migration` for 299
        # has actually landed.
        if: env.RUN_STEP == 'migration-299-precheck' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/migration-299-precheck"
          # DEFECT FIX (lane CHAIN, 2026-09-06, maintenance #49 [CONFIRMED]): the script prints its JSON
          # verdict to stdout ONLY on the paths that reach a real check; its no-DB-creds early exit
          # (exit 2) prints ONLY to stderr (console.error) and writes nothing to stdout at all — the old
          # `node ... | tee summary.json` then wrote a 0-BYTE summary.json, which is not valid JSON. This
          # is a shell-level fix (migration-299-precheck.mjs itself is scripts/mint/**, outside this
          # lane's write set) that stays correct no matter how the script's own stdout behaves in the
          # future: capture stdout, validate it as JSON, and synthesize a valid, honest envelope (never a
          # fabricated verdict — it reports "no_valid_json_on_stdout" plus the real exit code and a
          # stderr tail) when it is not. summary.json is therefore ALWAYS parseable JSON.
          set +e
          if [ "$RUN_ARG" = "post" ]; then
            RAW="$(node scripts/mint/migration-299-precheck.mjs --post 2>"$OUT_ROOT/migration-299-precheck/stderr.log")"
          else
            RAW="$(node scripts/mint/migration-299-precheck.mjs 2>"$OUT_ROOT/migration-299-precheck/stderr.log")"
          fi
          CODE=$?
          set -e
          echo "$RAW"
          cat "$OUT_ROOT/migration-299-precheck/stderr.log" >&2 || true
          if [ -n "$RAW" ] && printf '%s' "$RAW" | jq -e . >/dev/null 2>&1; then
            printf '%s' "$RAW" > "$OUT_ROOT/migration-299-precheck/summary.json"
          else
            MODE_LABEL="pre"; [ "$RUN_ARG" = "post" ] && MODE_LABEL="post"
            jq -n --arg mode "$MODE_LABEL" --arg exit_code "$CODE" \
              --arg stderr_tail "$(tail -c 2000 "$OUT_ROOT/migration-299-precheck/stderr.log" 2>/dev/null || true)" \
              '{mode:$mode, ok:false, error:"no_valid_json_on_stdout", exit_code:($exit_code|tonumber), stderr_tail:$stderr_tail}' \
              > "$OUT_ROOT/migration-299-precheck/summary.json"
          fi
          exit 0

