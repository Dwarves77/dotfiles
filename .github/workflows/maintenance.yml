        # every open item-subject row whose created_by is in PER_ITEM_VERIFIED_SUPERSEDE_FAMILIES
        # (gate-a-verifier-sweep the first entry) and whose subject item is now provenance_status=
        # 'verified', with resolution_note "item verified on <date>; finding superseded"; a row whose
        # item is still quarantined stays open and its item id is listed in this run's own summary.json
        # (still_open_item_ids) for the coordinator to feed into the next brief-export batch. Not
        # ruling-gated; apply needs no --arg.
        if: env.RUN_STEP == 'close-flags-for-verified-items' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/close-flags-for-verified-items"
          node scripts/maintenance/close-flags-for-verified-items.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/close-flags-for-verified-items"

      - name: finish-staged-updates
        # Part 7 task 7.5 item 2, brief-chain build plan 2026-09-11 / ADR-030 rider / RD-20: runs every
        # approved-never-materialized staged_updates row (33, April to July) through the SAME mint
        # chokepoint (applyStagedUpdate) a fresh staged row already meets -- materialize (status=approved
        # stays, materialized_at + materialized_item_id stamped) or reject-with-reason (status=rejected,
        # materialization_error stamped). None left approved-unmaterialized. Not ruling-gated; apply needs
        # no --arg. See the script's own header for why the scrape-hold clause is checked/reported but does
        # not currently gate any row (the mint chokepoint's call graph performs no fetch).
        if: env.RUN_STEP == 'finish-staged-updates' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/finish-staged-updates"
          node scripts/maintenance/finish-staged-updates.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/finish-staged-updates"

      - name: schema-vocabulary-inventory
        # D7 (docs/plans/defect-fix-plan-2026-09-12.md): READ-ONLY BY DESIGN. Dumps every list-valued
        # CHECK constraint on the public schema (the exact query and parser both live in
        # scripts/maintenance/schema-vocabulary-inventory.mjs / scripts/maintenance/lib/vocab-inventory.mjs)
        # to fsi-app/docs/inventories/db-check-constraints.json, the tracked SoT check-vocabulary.test.mjs
        # (discipline suite) and check-vocabulary-drift.mjs (data-audit lane) both read. `mode=apply` is
        # REFUSED by the script itself (prints a read-only note, exits 0) before any DB call. Needs a
        # DIRECT Postgres connection (SUPABASE_DB_PASSWORD), not the REST creds this job's "Verify
        # required secrets" step checks; self-skips exit 2 without one, same as source-role-cleanup above
        # (`|| true` so an 'all' dry fan-out or a missing-password apply dispatch does not fail the job).
        if: env.RUN_STEP == 'schema-vocabulary-inventory' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          mkdir -p "$OUT_ROOT/schema-vocabulary-inventory"
          node scripts/maintenance/schema-vocabulary-inventory.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/schema-vocabulary-inventory" || true

      - name: Commit the schema-vocabulary-inventory artifact (dry mode only)
        # Read-only maintenance steps still write a FILE (never the database): the run's checkout is
        # discarded when the job ends, so the refreshed docs/inventories/db-check-constraints.json commits
        # back to the dispatched ref the SAME way resolve-error-body-gate's worklist does (task 7.4 fix
        # round 1, review-7.1-7.4.md finding C) -- reusing that mechanism (scripts/maintenance/
        # commit-worklist-artifact.sh) rather than a second copy of the push-degradation logic. Runs only
        # on a named dry dispatch of the step above (never from 'all', and never in apply mode -- the
        # script writes nothing in apply mode, so there is nothing to commit).
        if: env.RUN_STEP == 'schema-vocabulary-inventory' && env.RUN_MODE == 'dry'
        run: |
          bash scripts/maintenance/commit-worklist-artifact.sh \
            "$GITHUB_REF_NAME" \
            "${{ github.run_id }}" \
            "docs/inventories/db-check-constraints.json" \
            "schema-vocabulary-inventory"

      - name: capture-static-primaries
        # D25, defect-fix-plan-2026-09-12.md (lane L16, 2026-09-13). 131 live verified brief-grade
        # regulation-family items have a source_url but no stored source capture (agent_run_searches row
        # over 200 chars) -- 130 on eur-lex.europa.eu, 1 on www.legislation.gov.uk. Operator rulings
        # verbatim, 2026-09-13: "You do NOT need browserless. Use the browser to look for free." / "We are
        # NOT spending money on populating the site." This step fetches each selected item's source_url
        # through src/lib/sources/transport-runtime.mjs's escalation ladder with ONLY a direct-HTTP
        # transport and renderAllowed:false, so Browserless is structurally unreachable from this step's
        # own call graph (not merely unconfigured) -- see the script's own header for the coordinator
        # correction that replaced the original plan's new-transport-in-canonical-fetch.mjs design with
        # this reuse of the already-live free-transport-first ladder. A response under 200 chars, a
        # non-2xx status, or a Cloudflare/CAPTCHA/"Just a moment" interstitial is a roadblock (the ladder's
        # own tested classifier, not a re-implementation here): no row is written, the item is listed with
        # its reason, and the run writes AT MOST ONE integrity_flags row summarising every roadblocked item
        # (never one per item). Idempotent: an item already carrying a pool row over 200 chars is skipped
        # every run. Respects SCRAPE_HOLD (fetch-hold.mjs): while engaged, nothing is fetched or written.
        # `arg` optionally scopes to `ids:<uuid,uuid,...>` (still filtered to a STATIC_TEXT_HOSTS host);
        # blank runs the unscoped selection. Not ruling-gated; apply needs no --arg beyond an optional id
        # scope.
        if: env.RUN_STEP == 'capture-static-primaries' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/capture-static-primaries"
          node scripts/maintenance/capture-static-primaries.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/capture-static-primaries"

      # Runs even when a step failed, so the log always ends with the true state of the tables rather
      # than only the exception that got there first (mirrors producers.yml's own Population AFTER).
      - name: Population AFTER
        if: always()
        run: node scripts/verify/population-report.mjs

      # CACHE FLUSH AFTER EVERY APPLY (CAP-1000, 2026-09-05, "two defects one cause" audit). BEFORE THIS
      # FIX: this job's own env block above (APP_URL/WORKER_SECRET) was added by the 2026-09-03 PERF train
      # with a comment promising a flush "after a real apply" — but no step here ever called
      # scripts/lib/revalidate.mjs. Maintenance #47 (forward-events-retext apply) deleted 331 forward
      # events and 331 obligations at 01:20 UTC on 2026-09-05 and /regulations (static,
      # PUBLIC_ITEMS_REVALIDATE_SECONDS 6h) still served the pre-cleanup register at 01:35 — the exact gap
      # this step closes. Every named maintenance step can touch rows the four public ledgers or their
      # detail pages read (intelligence_items, obligations, item_forward_events, sources, tags,
      # integrity_flags), so this flushes unconditionally on any real apply rather than auditing each of
      # the 22 steps individually — revalidateTag is idempotent and cheap; an occasional redundant flush
      # costs nothing, a missed one serves stale data for up to PUBLIC_ITEMS_REVALIDATE_SECONDS. Reuses
      # the SAME CLI apply-mint-batch.mjs's own in-process call already exercises (scripts/lib/
      # revalidate.mjs's `main()`, tested in scripts/lib/revalidate.test.mjs) — no second copy of the
      # POST-to-/api/revalidate logic. `|| true`: best-effort, same "no APP_URL: say so, never fail the
      # job" contract revalidate.mjs's own revalidateTags() already implements (a missing secret pair or a
      # non-2xx response is logged and skipped, not fatal — the 60s/300s cache backstops still bound
      # staleness either way).
      - name: Flush public/detail caches after a real apply (every apply, not mint alone)
        if: always() && env.RUN_MODE == 'apply'
        run: node scripts/lib/revalidate.mjs --apply app-data public-items regulations-detail market-detail operations-detail research-detail || true

      # ── Lane M9b (2026-09-18), stage-audit-2026-09-18 s6-gates-harness.md: this family's runs were
      # recorded only as the ephemeral upload-artifact step below (90-day retention, never git history a
      # proposer lane could read) and the dispatch ledger below it stopped being appended by hand
      # 2026-09-07. The four steps that follow commit both a real, git-tracked harness-run artifact
      # (scripts/harness-runs/maintenance/, CONVENTION.md's own schema) and a machine-appended
      # docs/ops/dispatch-ledger.jsonl row, via the SAME branch-plus-PR mechanism source-sweep.yml already
      # uses (read in full and copied here, not reimplemented) -- every step runs `always()` so a run that
      # failed partway still leaves a record of exactly what happened, the same posture Population AFTER
      # above already takes.

      # claimRunId (scripts/lib/run-artifact.mjs) numbers the next maintenance-run-NNN artifact from the
      # files it can see in the checked-out tree, i.e. the ref this run started from. Artifacts land
      # through a PR (this workflow's own concurrency group serializes DISPATCHES, but does not wait for a
      # prior run's PR to merge before the next dispatch starts), so a run whose predecessor's PR has not
      # yet merged would see a stale count and claim the SAME run_id -- the exact collision
      # source-sweep.yml's own identically-named step guards against for its own family.
      - name: Hydrate unmerged maintenance-artifact sibling artifacts (run_id collision guard)
        if: always()
        run: |
          git fetch --no-tags origin '+refs/heads/maintenance-artifact/*:refs/remotes/origin/maintenance-artifact/*' || true
          : > /tmp/hydrated-maintenance-artifacts.txt
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/maintenance-artifact/*'); do
            for f in $(git ls-tree -r --full-tree --name-only "$b" -- fsi-app/scripts/harness-runs/maintenance/); do
              rel="${f#fsi-app/}"
              if [ ! -e "$rel" ]; then
                mkdir -p "$(dirname "$rel")"
                git show "$b:$f" > "$rel"
                echo "$rel" >> /tmp/hydrated-maintenance-artifacts.txt
              fi
            done
          done
          echo "hydrated $(wc -l < /tmp/hydrated-maintenance-artifacts.txt) unmerged maintenance-artifact file(s) from sibling branches"

      - name: Write this run's maintenance harness-run artifact
        if: always()
        id: write_artifact
        run: |
          RAW="$(node scripts/maintenance/write-run-artifact.mjs --step "$RUN_STEP" --mode "$RUN_MODE" --arg "$RUN_ARG" --out-root "$OUT_ROOT")"
          echo "$RAW"
          echo "run_id=$(printf '%s' "$RAW" | jq -r '.run_id')" >> "$GITHUB_OUTPUT"
          echo "artifact_path=$(printf '%s' "$RAW" | jq -r '.artifact_path')" >> "$GITHUB_OUTPUT"

      - name: Append this run's dispatch-ledger row
        if: always()
        run: |
          JOB_STATUS="${{ job.status }}"
          if [ "$JOB_STATUS" = "cancelled" ]; then
            OUTCOME="cancelled"
          elif [ "$JOB_STATUS" = "failure" ]; then
            OUTCOME="error"
          elif [ "$RUN_MODE" = "apply" ]; then
            OUTCOME="applied"
          else
            OUTCOME="reported"
          fi
          ARTIFACT_REL=""
          RAW_PATH="${{ steps.write_artifact.outputs.artifact_path }}"
          if [ -n "$RAW_PATH" ] && [ "$RAW_PATH" != "null" ]; then
            ARTIFACT_REL="scripts/harness-runs/maintenance/$(basename "$RAW_PATH")"
          fi
          node scripts/harness-runs/append-dispatch-ledger.mjs \
            --workflow maintenance \
            --step "$RUN_STEP" \
            --mode "$RUN_MODE" \
            --run-id "${{ github.run_id }}" \
            --date "$(date -u +%Y-%m-%d)" \
            --outcome "$OUTCOME" \
            --artifact "$ARTIFACT_REL" \
            --ledger ../docs/ops/dispatch-ledger.jsonl

      # Commit the family's own harness-run artifact plus the dispatch-ledger row (scripts/harness-runs/
      # maintenance/** and ../docs/ops/dispatch-ledger.jsonl) so this run survives past the Actions log --
      # same posture corpus-turn.yml/source-sweep.yml apply to their own artifacts. A dispatch normally
      # runs against master, which is typically branch-protected, so this lands on its own branch and opens
      # a PR (source-sweep.yml's own pattern, copied) rather than pushing straight to whatever ref
      # triggered the run.
      - name: Remove hydrated sibling artifacts (they belong to their own branches)
        if: always()
        run: |
          if [ -s /tmp/hydrated-maintenance-artifacts.txt ]; then xargs -a /tmp/hydrated-maintenance-artifacts.txt rm -f; fi
          rm -rf scripts/harness-runs/maintenance/.claims

      - name: Commit the maintenance harness-run artifact and dispatch-ledger row, and open a PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/harness-runs/maintenance ../docs/ops/dispatch-ledger.jsonl
          if git diff --cached --quiet; then
            echo "No new maintenance harness-run artifact or dispatch-ledger row to commit."
            exit 0
          fi
          branch="maintenance-artifact/${{ github.run_id }}"
          git checkout -b "$branch"
          git commit -m "maintenance ${RUN_MODE}: ${RUN_STEP} run ${{ github.run_id }}"
          # BRANCH-BASE (2026-09-04 pattern, copied from source-sweep.yml/population-turn.yml): re-base the
          # artifact commit onto the current master tip before the push, so a workflow-file change that
          # landed on master mid-run cannot make GitHub refuse the branch.
          git fetch --no-tags --depth=50 origin master
          git rebase --autostash origin/master || { git rebase --abort; echo "::error::maintenance artifact commit does not rebase onto origin/master"; exit 1; }
          git push origin HEAD:"$branch"
          printf 'Automated maintenance run (run %s).\n\nStep: %s\nMode: %s\nArg: %s\n\nLands the harness-run artifact for this run under scripts/harness-runs/maintenance/ and its dispatch-ledger row.\n' \
            "${{ github.run_id }}" "$RUN_STEP" "$RUN_MODE" "${RUN_ARG:-(none)}" > /tmp/pr-body.md
          bash scripts/turns/deliver-artifact-branch.sh "$branch" "Maintenance: ${RUN_STEP} (mode=${RUN_MODE}, run ${{ github.run_id }})" /tmp/pr-body.md

      - name: Upload this run's step artifact(s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-${{ inputs.step }}-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
