name: Maintenance

# THE RUNTIME FOR THE COORDINATOR-ONLY APPLIES. docs/plans/finish-plan-2026-09-02.md's MAINT paragraph:
# seven applies that were designed, built, and (mostly) tested with no runtime to execute from — dry by
# construction, never dispatched. This workflow is that missing runtime, modeled directly on
# .github/workflows/producers.yml (secrets verification, mode choice, per-step gating, population
# BEFORE/AFTER, artifact upload) and .github/workflows/population-turn.yml (dispatch-only, no schedule).
#
# EVERY STEP IS DRY BY DEFAULT. `mode=apply` is required to write anything, and several steps ALSO
# refuse to write unless `arg` carries the exact ruling token their gate names (see each step below and
# docs/runbooks/MAINTENANCE-RUNBOOK.md). Every wrapper (fsi-app/scripts/maintenance/*.mjs) writes a
# summary.json into this run's out-dir regardless of mode; apply-mode writes, when a step makes any,
# always go through the guarded path (fsi-app/scripts/lib/db.mjs) — rule 015.
#
# 'all' runs every step in ONE dispatch, DRY ONLY — never in apply mode (a single 'all' apply dispatch
# could never carry seven different rulings' worth of `arg` tokens at once, and several steps would
# refuse anyway; naming one step at a time for `apply` is the point, not an oversight). Applying more
# than one step is multiple dispatches, each reviewed on its own artifact — same posture
# population-turn.yml's own per-dispatch review takes.
#
# BUILD MODE (operator ruling 2026-08-30, restated on every dispatch-only workflow in this repo): no
# standing schedule while the site is being built. workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = read/plan, write nothing. apply = write through the guarded path (may also require --arg — see each step in docs/runbooks/MAINTENANCE-RUNBOOK.md).'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      step:
        description: 'Which maintenance step to run. "all" fans out every step in ONE dispatch, dry mode only — apply always names exactly one step.'
        required: true
        default: 'all'
        type: choice
        options: [all, tier-opinions, w1-dispositions, origin-class-backfill, source-type-backfill, derive-obligations, seed-corridors, census-off-vertical, review-digests, review-apply-provisional-sources, review-apply-canonical-candidates, review-apply-portal-links, review-apply-coverage-gaps, tag-proposals, tag-ratification, apply-classifications, seed-benchmark-instruments, spec09-reroute, spec09-grid-queue, spec09-oem-roadmap, provenance-heal, institution-canonicalize, reopen-validation-holds, record-hollow-sweep, canonical-key-dedup, forward-events-retext]
      arg:
        description: 'Optional per-step argument (a ruling-acceptance token, an archive/park choice, a comma-separated proposal-id list, or — for spec09-reroute/spec09-grid-queue/spec09-oem-roadmap — a --rows-file path checked into the repo; see the runbook for which steps require one and what value they need).'
        required: false
        default: ''
        type: string

concurrency:
  group: maintenance
  cancel-in-progress: false

env:
  RUN_MODE: ${{ inputs.mode }}
  RUN_STEP: ${{ inputs.step }}
  RUN_ARG: ${{ inputs.arg }}

jobs:
  maintain:
    runs-on: ubuntu-latest
    # TIMEOUT ARITHMETIC (lane HEAL-BUDGET, 2026-09-04, raising 15 -> 30 minutes; lane HEAL-10, 2026-09-04,
    # raising 30 -> 35 minutes — see below for why 30 was still not enough).
    #   HEAL-4 (run #17, provenance-heal apply, quarantined-live, 95 items, NO Wayback archive fallback):
    #   10m50s (650s) wall time / 95 items = 6.84s/item average, completed cleanly.
    #   HEAL-5 (run #20, the FIRST apply run WITH the archive fallback + OJ resolution, same 95 items):
    #   ran 15m20s (920s) and was CANCELLED by this job's own 15-min timeout — never finished.
    #   30-MINUTE BUDGET WAS STILL WRONG [CONFIRMED, run 33855060659, Maintenance #31, apply, quarantined-
    #   live]: the PRIOR version of this comment assumed "~1-2 min" of Install/Population-BEFORE/
    #   Population-AFTER combined. Measured live: job started 08:46:36, the provenance-heal STEP itself did
    #   not start until 08:51:57 — 5m21s (321s) of pre-step setup (checkout, setup-node, Install, verify
    #   secrets, "This run's gates", Population BEFORE), nearly 3x the assumed figure. With
    #   HEAL_TIME_BUDGET_SECONDS=1500s (25 min) starting the clock only once the step itself begins, the
    #   step's own internal deadline would fire at 08:51:57 + 1500s = 09:16:57 — but this job's OWN 30-
    #   minute timeout (from job start, 08:46:36 + 30:00 = 09:16:36) fired FIRST, and the run was CANCELLED
    #   at 09:16:49, 8s before its own clean stop — 15/87 items processed, 0 healed, the checkpoint from
    #   item 15's own completion the only thing that survived. Population AFTER and the artifact upload step
    #   never ran to completion either (both measured ~3s each on a normal run, per this run's own prior
    #   completed steps — negligible on their own, but they land AFTER the step, so the job's own timeout
    #   must clear them too, not just the step's internal budget).
    #   THE FIX (lane HEAL-10): heal-provenance.mjs's own TENTH PASS cuts the PER-ITEM cost that
    #   HEAL_TIME_BUDGET_SECONDS is spent on (a capture-text index cache removing the confirmed dominant
    #   waste — the same haystack renormalized once per claim/orphan-token instead of once per capture — plus
    #   a per-item wall-clock backstop; see that file's header for the full arithmetic), so
    #   HEAL_TIME_BUDGET_SECONDS stays 1500s UNCHANGED (the budget itself was never the problem — what it was
    #   being spent on was). This job's OWN timeout is raised so it can ONLY ever fire from something already
    #   wrong (a genuine hang), never from underestimating its own setup/teardown overhead:
    #     35 min (2100s) job timeout
    #     - 321s  measured pre-step setup (#31, above)
    #     - 1500s HEAL_TIME_BUDGET_SECONDS (unchanged — the step's own internal deadline)
    #     -   3s  Population AFTER (measured)
    #     -   3s  artifact upload (measured)
    #     = 273s  (4m33s) headroom for GitHub's own cancellation/upload grace period AND run-to-run variance
    #             in Install/npm-ci timing beyond this ONE measurement (rule 14 — a single number is a
    #             measurement, not a guarantee it repeats exactly; the margin covers the gap honestly rather
    #             than asserting 321s as a hard ceiling).
    #   This timeout is still a BACKSTOP, not the real control — HEAL_TIME_BUDGET_SECONDS below is what
    #   actually bounds a heal run's OWN work — but with this arithmetic the step's own budget now ALWAYS
    #   stops the run first (with the 273s of margin above to spare), so this job timeout firing on a heal
    #   dispatch is itself evidence something is wrong (a real hang, not underestimated overhead) rather than
    #   the expected outcome run #31 measured.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Cache flush after a real apply (PERF train, 2026-09-03): scripts/lib/revalidate.mjs POSTs the
      # ledger/detail cache tags to /api/revalidate. Same secret pair change-detection.yml already uses;
      # absent, the helper skips and the 60 s / 300 s cache backstops bound staleness.
      APP_URL: ${{ secrets.APP_URL }}
      WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      - name: This run's gates
        run: |
          echo "trigger = ${{ github.event_name }}"
          echo "mode    = $RUN_MODE"
          echo "step    = $RUN_STEP"
          echo "arg     = ${RUN_ARG:-(none)}"
          if [ "$RUN_MODE" = "apply" ] && [ "$RUN_STEP" = "all" ]; then
            echo "::error::apply mode requires a single named step, not 'all' — see this workflow's header."
            exit 1
          fi
          echo "OUT_ROOT=$RUNNER_TEMP/maintenance-${{ github.run_id }}" >> "$GITHUB_ENV"

      - name: Population BEFORE
        run: node scripts/verify/population-report.mjs

      - name: tier-opinions
        # NOT RUNNABLE (see the step's own header + docs/runbooks/MAINTENANCE-RUNBOOK.md): the upstream
        # that would produce tier_estimate is the paid LLM brief-generation agent. This step reports that
        # finding and exits 2 in apply mode by design — an expected, documented outcome, not a bug.
        if: env.RUN_STEP == 'tier-opinions' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/tier-opinions"
          node scripts/maintenance/tier-opinions.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/tier-opinions" || true

      - name: w1-dispositions
        # Gated on ruling R-C (finish-plan-2026-09-02.md §1). apply mode makes NO code edit — see the
        # step's own header — it only unlocks the full wire/delete worklist report once R-C is accepted.
        if: env.RUN_STEP == 'w1-dispositions' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/w1-dispositions"
          node scripts/maintenance/w1-dispositions.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/w1-dispositions"

      - name: origin-class-backfill
        # Gated on ruling R-E. apply requires --arg R-E-accepted.
        if: env.RUN_STEP == 'origin-class-backfill' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/origin-class-backfill"
          node scripts/maintenance/origin-class-backfill.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/origin-class-backfill"

      - name: source-type-backfill
        # Not ruling-gated: migration 288 applied 2026-09-02; writes only where source_type IS NULL.
        if: env.RUN_STEP == 'source-type-backfill' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/source-type-backfill"
          node scripts/maintenance/source-type-backfill.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/source-type-backfill"

      - name: derive-obligations
        # Wave 2 lane OBLIG: migration 290 (applied 2026-09-03) is populated from item_forward_events here.
        if: env.RUN_STEP == 'derive-obligations' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/derive-obligations"
          node scripts/maintenance/derive-obligations.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/derive-obligations"

      - name: seed-corridors
        # Wave 2 lane CORR: corridor identity rows on the entity spine (ADR-024 §4).
        if: env.RUN_STEP == 'seed-corridors' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/seed-corridors"
          node scripts/maintenance/seed-corridors.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/seed-corridors"

      - name: census-off-vertical
        # Gated on ruling R-A (open). apply requires --arg archive or park; 'archive' is currently
        # NOT RUNNABLE (census_worklist has no archive columns — see the step's own header) and reports
        # that rather than writing.
        if: env.RUN_STEP == 'census-off-vertical' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/census-off-vertical"
          node scripts/maintenance/census-off-vertical.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/census-off-vertical" || true

      - name: review-digests
        # scripts/review/build-review-digests.mjs is built by a sibling lane (R1) and may not exist yet
        # in this checkout — this step fails clearly (exit 1 in apply mode) rather than a bare
        # "command not found" when it's absent. See docs/runbooks/MAINTENANCE-RUNBOOK.md for the contract.
        if: env.RUN_STEP == 'review-digests' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/review-digests"
          node scripts/maintenance/review-digests.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/review-digests"

      - name: review-apply-provisional-sources
        # Lane REVIEW-WIRE (2026-09-04): the four maintenance steps build-review-digests.mjs's own
        # QUEUES[].maintStep already names, wired for the first time (audit
        # docs/audits/wiring-audit-2026-09-04/B1-modules.md Gap #1). `arg` IS the required ruling-file
        # path (docs/ratifications/2026-09/<queue>.ruling.json), gated in BOTH modes — this queue's dry
        # plan is the ruled decisions replayed against live rows, not a read of the table alone, so there
        # is no meaningful blank-arg dry run either (same posture as reopen-validation-holds's own `arg`
        # gate). `|| true` so an 'all' dry fan-out with no arg does not fail the job. Dispatch it NAMED,
        # with the ruling file an operator has actually ruled on — never from 'all'.
        if: env.RUN_STEP == 'review-apply-provisional-sources' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/review-apply-provisional-sources"
          node scripts/maintenance/review-apply-provisional-sources.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/review-apply-provisional-sources" || true

      - name: review-apply-canonical-candidates
        # See review-apply-provisional-sources above for the shared rationale (Lane REVIEW-WIRE,
        # 2026-09-04). `arg` gated in both modes; `|| true` for the same 'all' dry fan-out reason.
        if: env.RUN_STEP == 'review-apply-canonical-candidates' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/review-apply-canonical-candidates"
          node scripts/maintenance/review-apply-canonical-candidates.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/review-apply-canonical-candidates" || true

      - name: review-apply-portal-links
        # See review-apply-provisional-sources above for the shared rationale (Lane REVIEW-WIRE,
        # 2026-09-04). `arg` gated in both modes; `|| true` for the same 'all' dry fan-out reason.
        if: env.RUN_STEP == 'review-apply-portal-links' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/review-apply-portal-links"
          node scripts/maintenance/review-apply-portal-links.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/review-apply-portal-links" || true

      - name: review-apply-coverage-gaps
        # See review-apply-provisional-sources above for the shared rationale (Lane REVIEW-WIRE,
        # 2026-09-04). `arg` gated in both modes; `|| true` for the same 'all' dry fan-out reason.
        if: env.RUN_STEP == 'review-apply-coverage-gaps' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/review-apply-coverage-gaps"
          node scripts/maintenance/review-apply-coverage-gaps.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/review-apply-coverage-gaps" || true

      - name: tag-proposals
        # Operator rule (propose-tags.mjs's own header): NO assumptions, NEVER silent auto-tagging — a
        # tag PROPOSAL going to integrity_flags is the visibility that rule requires, not an item tag.
        # apply writes integrity_flags PROPOSAL rows ONLY (flag-namespaces.mjs's TAG_NAMESPACE) — it
        # NEVER writes intelligence_items.*_tags; only the sibling tag-ratification step, gated on an
        # operator's own `ratify:tags` resolution, ever does that. Wraps scripts/connections/
        # propose-tags.mjs's own guarded proposeTags() core unmodified — see the step's own header.
        if: env.RUN_STEP == 'tag-proposals' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/tag-proposals"
          node scripts/maintenance/tag-proposals.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/tag-proposals"

      - name: tag-ratification
        # apply requires --arg = comma-separated integrity_flags id(s) to apply (never a blanket
        # "apply everything ratified" from one dispatch). Wraps scripts/connections/apply-tags.mjs's
        # existing guarded apply path unmodified — see the step's own header.
        if: env.RUN_STEP == 'tag-ratification' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/tag-ratification"
          node scripts/maintenance/tag-ratification.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/tag-ratification"

      - name: apply-classifications
        # Lane CLASSIFY-STEP (2026-09-04): MAINT orchestrator for the full source-classification
        # propose→auto-adopt pipeline (operator ruling 2026-09-03 retires the human-gate-for-everything
        # posture). Dry: computes fresh Axis 3/4/5 proposals (classify gaps, drift, anomalies) and
        # evaluates auto-adopt eligibility (scope_modes/scope_verticals at "high" confidence,
        # expected_output deterministically, scope_topics ratification-only, jurisdictions never).
        # Apply: proposes fresh flags, resolves stale ones, then auto-adopts eligible flags (sources +
        # integrity_flags via autoAdoptClassification, guarded path, rule 015). Flags with residue stay
        # open; see apply-classifications.mjs's header and docs/specs/08-flywheel-design.md §Loop B.
        if: env.RUN_STEP == 'apply-classifications' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/apply-classifications"
          node scripts/maintenance/apply-classifications.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/apply-classifications"

      - name: seed-benchmark-instruments
        # Wave 3 lane COMMUNITY-A (spec 05 §3, component 4): the house-seeded recurring benchmark.
        # Instantiates this period's community_benchmark_instruments rows (migration 294) from the
        # script's fixed calendar; idempotent per period; never writes community_posts. Dispatch-only
        # (no schedule during the build, operator ruling); bare --apply is the script's own flag.
        if: env.RUN_STEP == 'seed-benchmark-instruments' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          if [ "$RUN_MODE" = "apply" ]; then node scripts/community/seed-benchmark-instruments.mjs --apply; else node scripts/community/seed-benchmark-instruments.mjs; fi

      - name: spec09-reroute
        # Wave 3 lane SPEC-09 (spec 09 §1.7): reroute_events readiness monitor. Reads the live corridor
        # entity count; reports the named gap (needs two distinct corridor entities; one exists) until
        # a second corridor is minted. Lane SPEC09-A (2026-09-05) added a --rows-file mode: `arg` (a
        # checked-in path, e.g. scripts/spec09/reroute-rows-file.example.json) is passed through as
        # --arg so a reviewed, fully-cited rows-file can be applied once >=2 corridors exist — no
        # rows-file (arg empty) keeps the original corridor-count-gap-only behaviour. See
        # docs/runbooks/MAINTENANCE-RUNBOOK.md §19.
        if: env.RUN_STEP == 'spec09-reroute' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/spec09-reroute"
          node scripts/spec09/reroute-producer.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/spec09-reroute"

      - name: spec09-grid-queue
        # Lane SPEC09-A (2026-09-05, plan §W5.1): grid_connection_queues producer, spec 09 §1.6. No $0
        # feed confirmed (scripts/spec09/SOURCES.md); ships 0 rows with no `arg`. `arg` (a checked-in
        # --rows-file path, e.g. scripts/spec09/grid-queue-rows-file.example.json) applies a reviewed,
        # fully-cited rows-file instead — see docs/runbooks/MAINTENANCE-RUNBOOK.md §20.
        if: env.RUN_STEP == 'spec09-grid-queue' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/spec09-grid-queue"
          node scripts/spec09/grid-queue-producer.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/spec09-grid-queue"

      - name: spec09-oem-roadmap
        # Lane SPEC09-A (2026-09-05, plan §W5.1): oem_tech_roadmaps producer, spec 09 §1.1. No $0 feed
        # confirmed (scripts/spec09/SOURCES.md); ships 0 rows with no `arg`. `arg` (a checked-in
        # --rows-file path, e.g. scripts/spec09/oem-roadmap-rows-file.example.json) applies a reviewed,
        # fully-cited rows-file instead — see docs/runbooks/MAINTENANCE-RUNBOOK.md §21.
        if: env.RUN_STEP == 'spec09-oem-roadmap' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/spec09-oem-roadmap"
          node scripts/spec09/oem-roadmap-producer.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/spec09-oem-roadmap"

      - name: provenance-heal
        # Lane HEAL (2026-09-03), operator ruling verbatim: a quarantined/archived-unreasoned item is not
        # evidence the item is bad — it is evidence this repo has not yet attached its grounding. This step
        # attaches it (capture -> ground -> slots -> Gate A -> re-derive), never fabricating a claim; an item
        # still failing after all five steps is left exactly as it is, reported with the remaining criterion.
        # apply needs no --arg beyond a valid selection (default quarantined-live) — see the step's own
        # header and docs/runbooks/MAINTENANCE-RUNBOOK.md for the other three selections (archived-unreasoned,
        # ids:<uuid,...>, slots-backfill).
        if: env.RUN_STEP == 'provenance-heal' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        env:
          # HEAL-BUDGET (2026-09-04), UNCHANGED at 1500s (25 min) by lane HEAL-10 (2026-09-04) — see this
          # job's own timeout-minutes comment for the full arithmetic tying this number to the 35-minute job
          # timeout (measured pre-step setup 321s + this 1500s + Population AFTER 3s + upload 3s + 273s
          # margin = 2100s/35min). HEAL-10 raised the JOB timeout and cut the PER-ITEM cost this budget is
          # spent on (heal-provenance.mjs's own capture-text index cache + per-item wall-clock backstop —
          # see that file's header TENTH PASS section); it deliberately did NOT raise this number, because
          # the budget itself was never the problem measured (run #31: cancelled by the JOB timeout 8s
          # before THIS budget's own clean stop, at 15/87 items — the fix is a timeout that finally leaves
          # this budget room to fire first, not a bigger budget). provenance-heal.mjs's main() checks this
          # before starting EACH item (both modes, since lane HEAL-9) and stops cleanly, checkpointed, well
          # inside the job's own timeout.
          HEAL_TIME_BUDGET_SECONDS: '1500'
        run: |
          mkdir -p "$OUT_ROOT/provenance-heal"
          node scripts/maintenance/provenance-heal.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/provenance-heal"

      - name: institution-canonicalize
        # Lane SRC-TIER (2026-09-03), source-credibility-model SKILL.md §3 "Canonical institutional tier
        # (one tier per institution)". Part A merges an institutions row mis-keyed to a generic hosting
        # domain (S3/CDN) into its real-domain same-name sibling; Part B sets an institution's
        # inconsistent per-row base_tier to the tier its own-domain rows already agree on. Both apply with
        # no --arg required (mechanical defect repair, never inventing a tier no row already carries; see
        # the step's own header). Part C (standards_body class-tier gap) is a report only, never applied —
        # a base_tier raise is an operator ruling per ADR-002, surfaced in this step's summary.json for
        # the operator to act on separately.
        if: env.RUN_STEP == 'institution-canonicalize' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/institution-canonicalize"
          node scripts/maintenance/institution-canonicalize.mjs --mode "$RUN_MODE" --out "$OUT_ROOT/institution-canonicalize"

      - name: reopen-validation-holds
        # Lane REOPEN-STEP (2026-09-04) dispatch runtime for scripts/mint/reopen-validation-holds.mjs
        # (lane URL-GUIL, 2026-09-03) — see that file's own header for the full mechanism. `arg` IS the
        # required --reason-contains scope, gated in BOTH modes (unlike every other arg-gated step above,
        # which gates apply only) — that tool's own header forbids a blanket reopen, so this step refuses
        # cleanly (exit 1, `|| true` so an 'all' dry fan-out with no arg does not fail the job) rather
        # than silently listing or reopening every held row. Dispatch it NAMED, with an explicit
        # --arg <substring> naming the failure class a just-landed fix plausibly resolves — never from
        # 'all'.
        if: env.RUN_STEP == 'reopen-validation-holds' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/reopen-validation-holds"
          node scripts/maintenance/reopen-validation-holds.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/reopen-validation-holds" || true

      - name: record-hollow-sweep
        # Lane HOLLOW-SWEEP (2026-09-04): archives live verified record-grade intelligence_items whose
        # FACT claims are title-only (archive_reason='record_hollow', releasing canonical_instrument_key/
        # instrument_identifier/source_url so the row stops blocking apply-mint-batch.mjs's checkM4 /
        # export-census-rows.mjs's buildHeldKeyIndex — see the step's own header), and returns the
        # corresponding census_worklist rows to would_mint with a note naming this sweep. No ruling gate;
        # apply needs no --arg beyond a valid selection. `--arg restore:<id,id,...>` reverses a prior
        # apply from this run's own db.mjs snapshot (best-effort — see the step's own header on why the
        # artifact's own per_item[].restore_sql is the durable reversal path across separate dispatches).
        if: env.RUN_STEP == 'record-hollow-sweep' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/record-hollow-sweep"
          node scripts/maintenance/record-hollow-sweep.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/record-hollow-sweep"

      - name: canonical-key-dedup
        # Lane DEDUP (2026-09-04): keeps the single verified row per canonical_instrument_key, archives
        # the others (archive_reason='duplicate_of_verified', releasing canonical_instrument_key/
        # instrument_identifier/source_url so the archived rows stop blocking apply-mint-batch.mjs's checkM4 /
        # export-census-rows.mjs's buildHeldKeyIndex — see the step's own header). Enforces invariant EP-11
        # (ADR-021: "two verified, non-archived items cannot share a key"). Keep rule: exactly one verified
        # per group → keep it; zero or multiple verified → refuse to decide (report, no archive). No ruling
        # gate; apply needs no --arg beyond a valid selection. `--arg restore:<id,id,...>` reverses a prior
        # apply from this run's own db.mjs snapshot.
        if: env.RUN_STEP == 'canonical-key-dedup' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/canonical-key-dedup"
          node scripts/maintenance/canonical-key-dedup.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/canonical-key-dedup"

      - name: forward-events-retext
        # Lane FWD-TEXT (2026-09-04): fixes item_forward_events.obligation_text rows that were carrying
        # garbled section-clipped text -- mid-word starts, a leaked URL tail + markdown bold label, a
        # markdown table pipe/cell fragment -- because clauseAround's context window was a fixed byte
        # offset never snapped to a sentence/clause boundary (see extract-forward-events.mjs's own header
        # and EXTRACTOR_VERSION 'fe1-2026-09-04.1'). This step never inserts or deletes a row: for each
        # EXISTING row whose identity (source object, event_date, event_kind) still matches a freshly
        # recomputed event but whose obligation_text differs, it rewrites obligation_text in place through
        # the guarded db.mjs path (cite + snapshot + read-back), with a per-row restore_sql. It also
        # REPORTS (never deletes) duplicate groups the extractor's own within-run content-dedupe would now
        # collapse -- item_forward_events has no is_archived/superseded column, so any deletion decision is
        # left to the coordinator/operator, cited by would_drop_id/would_keep_id from the run's own
        # summary. No ruling gate; apply needs no --arg beyond a valid selection. `--arg ids:<id,id,...>`
        # scopes the sweep to named intelligence_item ids; `--arg restore:<id,id,...>` reverses a prior
        # apply from this run's own db.mjs snapshot.
        if: env.RUN_STEP == 'forward-events-retext' || (env.RUN_MODE == 'dry' && env.RUN_STEP == 'all')
        run: |
          mkdir -p "$OUT_ROOT/forward-events-retext"
          node scripts/maintenance/forward-events-retext.mjs --mode "$RUN_MODE" --arg "$RUN_ARG" --out "$OUT_ROOT/forward-events-retext"

      # Runs even when a step failed, so the log always ends with the true state of the tables rather
      # than only the exception that got there first (mirrors producers.yml's own Population AFTER).
      - name: Population AFTER
        if: always()
        run: node scripts/verify/population-report.mjs

      - name: Upload this run's step artifact(s)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-${{ inputs.step }}-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 90
