name: Question answers

# question-answers runtime (lane L4-B, 2026-10-05, ADR-044). The two runtimes of the question-answers batch
# pattern, in one dispatchable workflow, the same shape as theme-briefs.yml and brief-export.yml:
#
#   action=export  scripts/turns/export-questions-for-answers.mjs: READ ONLY. Lists every open question flag
#                  that held source text could still answer, with the item's and its connected items' claims,
#                  forward events and held pool text, writes one bundle file for a session lane to author
#                  answers from, and uploads it as the workflow artifact. `mode` is ignored (an export never
#                  writes).
#   action=apply   scripts/turns/apply-question-answers.mjs over the committed batch named by `answers_file`:
#                  validates every entry against the live held pool (whole entry refusals), and with
#                  mode=apply passes --execute so an answered question writes its first inference and closes
#                  its flag, and an unanswerable one records its outcome on the flag. mode=dry validates and
#                  prints the plan and writes nothing.
#
# PUSH TRIGGER (lane G6-DRAIN, 2026-10-06, coordinator ruling): the scheduled judgement drain session commits a
# question-answers batch to a branch and opens a PR; the merge is a push to master touching
# scripts/turns/question-answers/batches/question-answers-*.json and fires this workflow as an apply with no
# human dispatch step. The batch file comes from scripts/drain/resolve-push-batch.mjs (one file per merge). The
# mode is NOT decided by the trigger: scripts/lib/chained-dry-guard.mjs (called with --ref) forces dry while
# scrape_cadence='off'; the requested apply stands only after build.
#
# BUILD MODE (CLAUDE.md rule 16): NO schedule block. A run is an explicit dispatch, the merge of a drain batch PR,
# or (lane CHAIN-4, 2026-10-08) a chained firing off Population turn or Propagation drain.
#
# CHAINED (lane CHAIN-4, 2026-10-08, remaining-build-register item 13, CLAUDE.md rule 17): the propagation drain
# raises or re-opens questions (drain.ts Pass 2b) and population-turn raises them at mint (the question generator
# is a population-turn flywheel step), so an answer pass follows each: `on.workflow_run.workflows` lists
# "Population turn" (loop hop 15) and "Propagation drain" (hop 14). A chained firing has no inputs and no batch
# file, so it runs action=export (read only, and there is always an open-question list to write); apply stays on
# a push or a dispatch. The firing is forced dry while build mode holds (chained-dry-guard, rule 16, though an
# export never writes). Depth: Propagation drain is reached natively from Data producers (depth 1) or by the
# explicit dispatch downstream-chain.yml makes (a dispatch is its own root), so this edge is depth 2 at most and
# needs no dispatch fallback of its own; Population turn is depth 2 under the sweep cascade, so this edge is
# depth 3. An upstream that did not conclude success is a recorded NO-OP, never a silent skip (rule 17).
#
# FREE (rule 11 of the common terms): no model call anywhere. Answers are authored in a session by sub agents
# from the exported bundle, then committed as scripts/turns/question-answers/batches/question-answers-NNN.json.
#
# DISPATCH RECIPE: `gh workflow run question-answers.yml -f action=export`, or
# `gh workflow run question-answers.yml -f action=apply -f mode=dry -f answers_file=scripts/turns/question-answers/batches/question-answers-001.json`.
# answers_file is fsi-app RELATIVE (this job runs with working-directory: fsi-app), never fsi-app/-prefixed.
#
# The run's harness-run artifact (family question-answers, scripts/harness-runs/question-answers/) is landed into
# harness_runs by the last step (scripts/turns/deliver-artifact-branch.sh), `if: always()`: a run that ends
# without recording its outcome is a defect in the run (rule 17).

on:
  push:
    branches: [master]
    paths:
      - 'fsi-app/scripts/turns/question-answers/batches/question-answers-*.json'
  # workflow_run (lane CHAIN-4, 2026-10-08): event-driven off a completed run, not a schedule (see the CHAINED
  # paragraph in the header). Fires on any conclusion; the resolve step below decides whether it earns an export.
  workflow_run:
    workflows: ["Population turn", "Propagation drain"]
    types: [completed]
  workflow_dispatch:
    inputs:
      action:
        description: 'export = write the bundle of open questions holdings could answer (read only). apply = validate answers_file and, with mode=apply, write the valid entries.'
        required: true
        default: 'export'
        type: choice
        options: [export, apply]
      mode:
        description: 'apply action only: dry = validate and plan, no database writes. apply = pass --execute. Ignored by export.'
        required: true
        default: 'dry'
        type: choice
        options: [dry, apply]
      answers_file:
        description: 'apply action only: fsi-app relative path of the committed batch, e.g. scripts/turns/question-answers/batches/question-answers-001.json.'
        required: false
        default: ''
        type: string

concurrency:
  group: question-answers
  cancel-in-progress: false

permissions:
  contents: read

env:
  # A push has no inputs: it is an apply request and the chained guard decides the mode (rule 16). A workflow_run
  # firing has no inputs either, and no batch file: it is the read only export (lane CHAIN-4).
  RUN_ACTION: ${{ inputs.action || (github.event_name == 'workflow_run' && 'export' || 'apply') }}
  RUN_MODE: ${{ inputs.mode || 'apply' }}
  RUN_ANSWERS_FILE: ${{ inputs.answers_file }}

jobs:
  question-answers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # a push resolves the merged batch file against its first parent

      # PUSH ONLY (lane G6-DRAIN, 2026-10-06): the batch file the merge added. One file per merge, else the run
      # fails loudly (scripts/drain/resolve-push-batch.mjs). Zero npm dependency.
      - name: Resolve the merged batch (push only)
        if: ${{ github.event_name == 'push' }}
        run: |
          node scripts/drain/resolve-push-batch.mjs --kind question-answers --before "${{ github.event.before }}" --sha "${{ github.sha }}" >> "$GITHUB_ENV"

      # --ref: a push to master is machine-triggered, so the guard forces dry while scrape_cadence='off'.
      - name: Chained dry-run guard (build mode, rule 16)
        run: |
          node scripts/lib/chained-dry-guard.mjs --event "${{ github.event_name }}" --requested-mode "${RUN_MODE}" --ref "${{ github.ref }}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      # THE UPSTREAM RUN ID AND THE CHAIN GATE (lane CHAIN-4, 2026-10-08; the same hand-off lane CHAIN-1 gave
      # Population turn, lane CHAIN-2 gave the other chained workflows). GITHUB_EVENT_WORKFLOW_RUN_ID is the repo's
      # convention for the upstream run id: writeRunArtifact stamps it as the artifact's top-level upstream_run_id,
      # which is what the loop firing evidence reads to place a question-answers row on hop 14 (Propagation drain)
      # or hop 15 (Population turn). An upstream that did not conclude success earns no export: the firing is
      # recorded as a NO-OP row below, so the family's history still shows it (rule 17).
      - name: Resolve the chained firing (workflow_run only)
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          UPSTREAM_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          echo "GITHUB_EVENT_WORKFLOW_RUN_ID=$UPSTREAM_RUN_ID" >> "$GITHUB_ENV"
          echo "RUN_UPSTREAM_NAME=$UPSTREAM_NAME" >> "$GITHUB_ENV"
          echo "RUN_UPSTREAM_RUN_ID=$UPSTREAM_RUN_ID" >> "$GITHUB_ENV"
          echo "upstream = $UPSTREAM_NAME (run $UPSTREAM_RUN_ID), conclusion=$UPSTREAM_CONCLUSION"
          if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "RUN_SKIP=true" >> "$GITHUB_ENV"
            echo "RUN_SKIP_REASON=upstream run $UPSTREAM_RUN_ID ($UPSTREAM_NAME) concluded '$UPSTREAM_CONCLUSION', not success, so there is nothing new to list questions for." >> "$GITHUB_ENV"
            echo "::notice::question-answers NO-OP, upstream concluded '$UPSTREAM_CONCLUSION'."
          fi

      # THE LOOP RUN ID (lane CHAIN-4, ADR-031): the upstream row's loop run id, read through the one reader and
      # exported under the name the artifact writer takes as its explicit id. A read failure is a warning and a
      # null id, never a red run.
      - name: Read the upstream loop run id (ADR-031, chained firings only)
        if: ${{ github.event_name == 'workflow_run' && env.RUN_SKIP != 'true' }}
        env:
          CHAIN_UPSTREAM_NAME: ${{ env.RUN_UPSTREAM_NAME }}
          CHAIN_UPSTREAM_RUN_ID: ${{ env.RUN_UPSTREAM_RUN_ID }}
        run: |
          if HANDOFF="$(node scripts/lib/upstream-artifact.mjs loop-id --upstream-name "$CHAIN_UPSTREAM_NAME" --upstream-run-id "$CHAIN_UPSTREAM_RUN_ID")"; then
            LOOP_ID="$(printf '%s\n' "$HANDOFF" | sed -n 's/^CHAIN_UPSTREAM_LOOP_RUN_ID=//p')"
            echo "QA_LOOP_RUN_ID=$LOOP_ID" >> "$GITHUB_ENV"
            echo "upstream loop run id: ${LOOP_ID:-(the upstream row records none)}"
          else
            echo "::warning::could not read the upstream loop run id for $CHAIN_UPSTREAM_NAME run $CHAIN_UPSTREAM_RUN_ID; this run records a null loop_run_id (ADR-031)."
          fi

      - name: This run's gates
        run: |
          echo "trigger     = ${{ github.event_name }}"
          echo "action      = $RUN_ACTION"
          echo "mode        = ${CHAINED_MODE:-$RUN_MODE} (apply action only)"
          echo "answers_file = ${PUSH_BATCH_FILE:-${RUN_ANSWERS_FILE:-(none)}}"
          if [ "$RUN_ACTION" = "apply" ] && [ -z "${PUSH_BATCH_FILE:-$RUN_ANSWERS_FILE}" ] && [ "${PUSH_BATCH_COUNT:-}" != "0" ]; then
            echo "::error::action=apply needs answers_file (an fsi-app relative path to a committed question-answers-NNN.json)."
            exit 1
          fi

      # RUN_DRIVER (lane CHAIN-1, 2026-10-07, chain-fire-2026-10-06 finding F1): the apply step used to gate on
      # `env.PUSH_BATCH_COUNT != '0'`, a variable only a push sets; on a dispatch it is unset, GitHub coerces null
      # and '0' to the same number, and an action=apply dispatch with a real answers_file skipped the driver and
      # finished green. Computed for both paths: a push runs it when the merge added a batch, a dispatch when it
      # names a file.
      - name: Resolve RUN_DRIVER (a push that added a batch, or a dispatch that names a file)
        env:
          RUN_EVENT: ${{ github.event_name }}
        run: |
          RUN_DRIVER=false
          if [ "$RUN_EVENT" = "push" ]; then
            if [ "${PUSH_BATCH_COUNT:-0}" != "0" ]; then RUN_DRIVER=true; fi
          elif [ -n "$RUN_ANSWERS_FILE" ]; then
            RUN_DRIVER=true
          fi
          echo "RUN_DRIVER=$RUN_DRIVER" >> "$GITHUB_ENV"

      - name: Export open questions holdings could answer
        if: ${{ env.RUN_ACTION == 'export' && env.RUN_SKIP != 'true' }}
        run: |
          set -o pipefail
          node scripts/turns/export-questions-for-answers.mjs --out-dir "$RUNNER_TEMP/question-answers" | tee /tmp/question-answers-export.log

      - name: Apply the question-answers batch
        if: ${{ env.RUN_ACTION == 'apply' && env.RUN_DRIVER == 'true' && env.RUN_SKIP != 'true' }}
        run: |
          set -o pipefail
          FLAGS="--answers ${PUSH_BATCH_FILE:-$RUN_ANSWERS_FILE}"
          if [ "${CHAINED_MODE:-$RUN_MODE}" = "apply" ]; then FLAGS="$FLAGS --execute"; fi
          node scripts/turns/apply-question-answers.mjs $FLAGS | tee /tmp/question-answers-apply.log
          echo "### question-answers apply" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/question-answers-apply.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # A legitimate NO-OP is still a run (lane CHAIN-4, rule 17): the chained firing decided there was nothing to
      # list, and the family's history records that it was asked.
      - name: Record a NO-OP run (the chain decided there was nothing to do)
        if: ${{ always() && env.RUN_SKIP == 'true' }}
        run: |
          node scripts/lib/upstream-artifact.mjs noop --family question-answers --mode "${CHAINED_MODE:-dry}" --reason "$RUN_SKIP_REASON" --upstream-name "$RUN_UPSTREAM_NAME" --upstream-run-id "$RUN_UPSTREAM_RUN_ID" --started-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Land this run's harness-run artifact into harness_runs
        if: always()
        run: |
          bash scripts/turns/deliver-artifact-branch.sh "Question answers: run ${{ github.run_id }}"

      # The export bundle is the author's input and carries held source text, so it is NEVER committed to the
      # repo: it is written under the runner temp directory (outside the checkout, so no git add anywhere can
      # reach it; this workflow has no git add or commit step, and deliver-artifact-branch.sh lands only
      # scripts/harness-runs/*/*-run-*.json into harness_runs) and leaves as a workflow artifact (seven day
      # retention). F68 accepts the path: it names neither _snapshots nor scripts/tmp.
      - name: Upload bundle, run artifact and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-answers-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/question-answers/
            fsi-app/scripts/harness-runs/question-answers/
            /tmp/question-answers-export.log
            /tmp/question-answers-apply.log
          if-no-files-found: ignore
          retention-days: 7
