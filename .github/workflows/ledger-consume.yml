name: Ledger consume

# THE CONSUME HALF of the portal deep-link slice, given a runtime for the first time (system-completion
# plan 2026-09-02, Lane CONSUME). `src/lib/intake/portal-harvest.ts`'s `consumePortalCandidates` (ledger
# row -> classify -> chokepoint -> intake) had ZERO production callers before this — the WRITE half of
# the same file, `persistPortalCandidates`, already runs via the scheduled check-sources crawl and,
# separately, `source-sweep.yml`. `portal_link_candidates.status='candidate'` sat at 1,454 rows with no
# reader (system-completion plan §0, item 1).
#
# THIS DRIVER: `fsi-app/scripts/turns/run-ledger-consume.mjs` — a thin binding (jiti-loaded
# `consumePortalCandidates`, a real polite `fetch`, a real `agent_runs` telemetry write per classify call,
# a real harness-run artifact) around that unmodified module. See that script's own header for exactly
# why jiti is required (the `@/lib/...` alias chain a plain `node` import cannot follow) and why the
# classify telemetry is wired here rather than left silent (operator ruling 2026-07-06: every classify
# call must leave an `agent_runs` row). It ALWAYS records a `ledger-consume` harness-run artifact
# (`scripts/harness-runs/ledger-consume/`, `scripts/lib/run-artifact.mjs`'s convention), in both modes,
# from a `finally` block, so a run that throws mid-way still leaves a record.
#
# THE SESSION-VERDICT $0 DEFAULT (operator ruling 2026-09-04, this diff: "stop offering API when you have
# a free option with Haiku"; "why is this costing me anything when it can be done for free?"). A candidate
# with a matching entry in `verdicts_file` (a repo path — see
# `fsi-app/scripts/turns/ledger-verdicts/README.md` for the file contract and how a session lane produces
# one) is classified from that verdict for $0, no API call. A candidate WITHOUT one is SKIPPED — untouched,
# never sent to the metered API. The real API path (`--allow-api`) is a CLI-only flag this workflow never
# sets — a workflow dispatch can never spend on classify by omission, only by an operator running the
# script directly and asking for it by name. `ANTHROPIC_API_KEY` is therefore NOT required by this
# workflow at all any more (see the "Verify required secrets" step) — the registration gap the family's
# `PENDING-RUN.md` originally flagged is now moot from this side as well as closed from the
# secrets-registry side (Lane SPEND, 2026-09-02).
#
# MODES. `plan` classifies (from a verdict, or skips) every candidate that clears the fetch step, and
# writes NOTHING to `portal_link_candidates` or the intake pipeline. `apply` is gated by ONE condition
# (`isApplyArmed`, `run-ledger-consume.mjs`), corrected 2026-09-18 (coordinator ruling, same day this
# workflow first landed the cap): armed whenever AT LEAST ONE committed `ledger-verdicts-*.json` batch
# exists at all, whether auto-discovered (`verdicts_file` left blank, the union `discoverVerdictsFiles`
# finds) or the one file an explicit `verdicts_file` names. The machine design this closes: session lanes
# write verdict batches (the human judgment, committed under `scripts/turns/ledger-verdicts/`), and apply
# promotes, by itself, every candidate that already has a committed verdict, capped, skipping the rest.
# Requiring an EXPLICIT `verdicts_file` on every apply dispatch (this workflow's own earlier shape) kept a
# person inside the hop, the exact defect this lane exists to close. The ONLY disarmed case is now zero
# batches, neither discovered nor named. The OTHER historical gate, `LEDGER_CONSUME_APPLY_ENABLED` (a
# source constant, ADR-023's reviewed-change mechanism), is RETIRED (Lane M2, 2026-09-18, `docs/audits/
# stage-audit-2026-09-18/s2-mint-gate.md` finding 1: apply had never fired for real across two full audits
# three weeks apart). THE MAX-PROMOTE CAP (`max_promote` input below, default 50, hard ceiling 200
# enforced in `run-ledger-consume.mjs`) is what bounds a single armed run's blast radius, by COUNT PER
# RUN, not a human flip: once armed, a single run promotes at most `max_promote` of the eligible
# candidates, oldest-eligible first. `record_only` (default `true`) governs what an ARMED apply actually
# does: the would-mint set mints at record grade through the UNCHANGED chokepoint (`runIntakeCycle`'s own
# `recordOnly` option) - its already-fetched text lands as the item's own pool row, GROUND/VALIDATE are
# skipped entirely (no grounding spend), and the free record-briefs fleet writes the `full_brief` later,
# like every other record item. An `apply` dispatch that is armed but has nothing NEW to mint (every
# eligible candidate lacks a verdict, or every verdict is `not_an_item`) mints nothing: a legal, honest
# no-op, not a silent downgrade (the driver logs and records this explicitly). **DECISION, REVISED (Lane
# M2, 2026-09-18):** the `workflow_run` chain below runs a PLAN pass then an APPLY pass (capped at
# `max_promote=50`) in the SAME job, see "run-ledger-consume.mjs (chained apply after source-sweep)"
# below. The chained apply pass names no explicit `verdicts_file` and needs none: whatever a session lane
# has already committed under `scripts/turns/ledger-verdicts/` is what it arms on and promotes from, up to
# the cap, automatically, on every source-sweep completion. It runs disarmed ONLY on the rare firing where
# zero verdict batches have ever been committed yet.
#
# EVENT CHAINING, NOT A SCHEDULE (build plan W1.4; rule 16 is about `schedule:`/cron, not event chaining).
# `workflow_run: workflows: ["Source sweep"]` fires this workflow automatically after every source-sweep
# run completes (successfully).
#
# D26 part g (docs/plans/defect-fix-plan-2026-09-12.md; operator ruling, 2026-09-13: "no unnecessary
# runs"), superseding this trigger's earlier "runs BOTH halves unconditionally" shape:
#   - EXPORT never runs on this trigger any more -- `run_export` is forced `false` for a `workflow_run`
#     firing (see "Resolve dispatch parameters" below). The export step (fetches real page text over the
#     network for every listed candidate) now runs ONLY on an explicit `workflow_dispatch` with
#     `export_candidates: true` -- a source-sweep completion is "check whether there is new work", never
#     "go fetch a few hundred pages".
#   - CONSUME (forced `mode=plan`, as before -- apply stays dispatch-only per the DECISION below) runs ONLY
#     when it has real work: this step reads each committed `scripts/turns/ledger-verdicts/
#     ledger-verdicts-*.json` batch's OWN `generated_at` field and each committed `ledger-consume`
#     harness-run artifact's own `finished_at` (both read directly from the checked-out working tree --
#     no `git log` history depth needed, so this is safe under `actions/checkout`'s default shallow
#     clone), and proceeds ONLY when the newest verdicts batch is newer than the last run whose
#     `config.action=="consume"` AND `config.mode=="apply"` actually ran ARMED (never merely requested and
#     disarmed). No such batch -> the chain has nothing the free session-Haiku decider has not already
#     seen since the last real apply -> `run_consume=false`, a named `::notice::` line explains why, and
#     every later step this job would otherwise run (`run-ledger-consume.mjs`, the commit/PR step) is a
#     fast no-op (its own `if:` gate, or `git diff --cached --quiet` finding nothing new to commit) --
#     the CHEAPEST honest approximation of "exits at once" a single-job workflow can express, since a
#     mid-job bash check cannot skip the steps GitHub Actions has already scheduled to run.
# Apply remains reachable ONLY via an explicit `workflow_dispatch`, per the DECISION below -- this event
# never sets `mode=apply`.
#
# DISPATCH-ONLY beyond the event chain above, DELIBERATELY, no schedule armed — the same build-mode ruling
# every other workflow in this repo states for itself (operator ruling 2026-09-01):
#   schedule:
#     - cron: '0 9 * * 1'   # placeholder cadence only — the operator picks the real one at re-arm time
#
# SECRETS (repository secrets; never echoed): NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY (the
# same pair every guarded script in fsi-app/scripts/lib/db.mjs already requires). ANTHROPIC_API_KEY is
# registered in WORKFLOW_SECRETS (secrets-registry.mjs) for the CLI-only `--allow-api` escape hatch a
# human might run outside this workflow, but this workflow itself never sets it as a job env var and never
# passes `--allow-api` — see the header above.
#
# export_candidates (Lane LEDGER-EXPORT, 2026-09-04 — closes the defect the coordinator confirmed at
# 16:55: LEDGER-ZERO's `--export-candidates` listed rows WITHOUT page text, its own note said "a session
# lane must fetch each URL itself" — the coordinator tried that, 1,837 candidates, Haiku classification
# lanes fetching through WebFetch hit rate limits within minutes and one lane started guessing from URL
# patterns instead of the page — refused). On a `workflow_dispatch` with this boolean input `true`, THE JOB
# RUNS ONLY THE EXPORT — the whole `mode`/`verdicts_file` consume path below is skipped for that dispatch
# (a `workflow_run` firing instead runs BOTH, unconditionally — see "EVENT CHAINING" above):
#   node scripts/turns/run-ledger-consume.mjs --export-candidates \
#     scripts/_snapshots/ledger-candidates/candidates-<run_id>.json --with-text --limit <export_limit> \
#     [--after <export_after>]
# `--with-text` fetches every listed candidate's URL through run-ledger-consume.mjs's OWN `buildFetchDoc`
# (the ConsumeOpts.FetchDocFn contract plan mode already uses — same politeness gap, same 20s timeout, NO
# second fetcher) and carries the fetched text in the payload, so a classification lane never fetches for
# itself. `export_limit` (default 400) bounds one batch; `export_after` (a `{"firstSeenAt":"...","id":"..."}`
# JSON string, default '', Lane LEDGER-CHAIN-2 2026-09-05: LEFT BLANK, resolveExportAfter auto-resumes past
# the previous export dispatch's own recorded `next_cursor` — see "EVENT CHAINING" above; an explicit value
# here still always overrides) resumes a prior batch's keyset cursor so several dispatches page through the
# full backlog (~1,837 candidates at the 2026-09-04 audit)
# in the SAME (first_seen_at, id) order the consume path itself walks. The export needs NO
# ANTHROPIC_API_KEY (it never classifies) but DOES need real network egress to fetch every candidate URL —
# this runner has it; the coordinator's own environment does not (PENDING-RUN.md's own account). The
# resulting file is delivered the SAME way this family's harness-run artifacts already are — pushed to a
# branch `ledger-consume/<run_id>` and a PR via `deliver-artifact-branch.sh` (see "What lands where" in
# `docs/runbooks/CORPUS-TURN-RUNBOOK.md`'s "Ledger consume" section) — so the coordinator fetches the
# branch, never a second delivery mechanism — and ALSO uploaded as a workflow artifact (the existing
# `scripts/_snapshots` upload step below already covers this path).

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'plan = classify (verdict or skip) + write nothing. apply = writes through the guarded intake cycle whenever at least one committed ledger-verdicts batch exists (auto-discovered, or the one verdicts_file names below), capped by max_promote; with zero batches committed anywhere, apply mints nothing and runs disarmed (LEDGER_CONSUME_APPLY_ENABLED is retired, see run-ledger-consume.mjs; the max_promote cap is the guard now).'
        required: true
        default: 'plan'
        type: choice
        options: [plan, apply]
      verdicts_file:
        description: 'Repo path to ONE session-verdict batch (e.g. scripts/turns/ledger-verdicts/ledger-verdicts-001.json, see fsi-app/scripts/turns/ledger-verdicts/README.md) to use INSTEAD of auto-discovery. A candidate matched here is classified for $0; one that is not is SKIPPED, never sent to the API. Leave blank (the default) to auto-discover and read EVERY committed ledger-verdicts-*.json batch, not only this one; auto-discovered batches arm apply exactly the same as an explicit one names here (isApplyArmed in run-ledger-consume.mjs, corrected 2026-09-18) - this input only narrows WHICH batch(es) this run acts on, it is no longer required for apply to arm at all.'
        required: false
        type: string
      record_only:
        description: 'D26 (2026-09-13): when true (the default), an apply dispatch mints the would-mint set at RECORD grade through the unchanged mint chokepoint (runIntakeCycle recordOnly); its already-fetched text lands as the item pool row, GROUND/VALIDATE are skipped entirely, and the free record-briefs fleet writes the full_brief later. Set false only for a caller that wants the paid grounding contract to run inline (never set false by this workflow''s own automatic trigger).'
        required: false
        default: true
        type: boolean
      max_promote:
        description: 'Lane M2 (2026-09-18): caps how many eligible candidates ONE apply run may promote, oldest-eligible first, the guard that replaces the retired LEDGER_CONSUME_APPLY_ENABLED source constant. Hard ceiling 200, enforced in run-ledger-consume.mjs (--max-promote). No effect in plan mode.'
        required: false
        default: '50'
        type: string
      limit:
        description: 'Max ledger candidates this run consumes (bounded runs, no unbounded sweeps).'
        required: false
        default: '50'
        type: string
      source_id:
        description: 'Restrict to one portal source (uuid). Leave blank to consume across all sources.'
        required: false
        type: string
      export_candidates:
        description: 'When true, this job runs ONLY --export-candidates --with-text (mode/verdicts_file/limit/source_id above are ignored) — see this file''s header, "export_candidates". Delivers the candidate rows, WITH each one''s fetched page text, as an artifact branch + PR, exactly like this family''s harness-run artifacts.'
        required: false
        default: false
        type: boolean
      export_limit:
        description: 'Max candidates this export batch fetches+lists (export_candidates=true only). See this file''s header for the job-timeout arithmetic this bounds.'
        required: false
        default: '400'
        type: string
      export_after:
        description: 'export_candidates=true only: resume a prior export batch''s keyset cursor — paste that batch''s own next_cursor as {"firstSeenAt":"...","id":"..."}. Leave blank (the default) to auto-resume past the PREVIOUS export dispatch''s own recorded next_cursor (resolveExportAfter, reading this family''s newest export harness-run artifact) instead of restarting from the beginning — pass a value here only to override that.'
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: ["Source sweep"]
    types: [completed]
  # schedule:
  #   - cron: '0 9 * * 1'   # BUILD MODE (2026-09-01 ruling, same as corpus-turn.yml / source-sweep.yml /
  #                          # producers.yml) — stays commented out until the operator explicitly re-arms it.

concurrency:
  group: ledger-consume
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write # deliver-artifact-branch.sh's fallback when PR creation is refused (see that script)

jobs:
  consume:
    # Only proceed on an explicit dispatch, or a workflow_run whose triggering run actually SUCCEEDED — a
    # failed/cancelled source-sweep produced no new candidates worth a plan pass over.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # TIMEOUT ARITHMETIC (Lane LEDGER-EXPORT, 2026-09-04). Worst case is an export_candidates=true dispatch
    # at its default export_limit=400: run-ledger-consume.mjs's --with-text path calls buildFetchDoc's
    # fetchDoc ONCE PER CANDIDATE, sequentially (the SAME politeness-gapped fetcher plan mode uses — see
    # this file's header) — each call can wait out the politeness gap (LEDGER_CONSUME_FETCH_GAP_MS, default
    # 1000ms) and then the fetch's own AbortController timeout (buildFetchDoc's hardcoded timeoutMs,
    # 20_000ms) if the URL never responds. Worst case per candidate: 1000ms + 20000ms = 21000ms. For
    # 400 candidates: 400 * 21000ms = 8,400,000ms = 8400s = 140 minutes. 150 minutes budgets a 10-minute
    # margin on top of that ceiling for checkout/npm ci/commit+push. Ordinary plan/apply consume dispatches
    # use the SAME fetchDoc but default to --limit 50 (10x fewer candidates) and finish in a small fraction
    # of this ceiling — it is sized for the export path's larger default limit, not typical runtime.
    timeout-minutes: 150
    defaults:
      run:
        working-directory: fsi-app
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install
        run: npm ci

      - name: Verify required secrets
        run: |
          missing=0
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then echo "::error::NEXT_PUBLIC_SUPABASE_URL is not set."; missing=1; fi
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then echo "::error::SUPABASE_SERVICE_ROLE_KEY is not set."; missing=1; fi
          [ "$missing" -eq 0 ]

      # THE UPSTREAM RUN ID (Lane M2, 2026-09-18): every run-ledger-consume.mjs invocation below reads
      # this back as config.upstream_run_id (that script's own config object) so an artifact from the
      # workflow_run chain names the source-sweep run that triggered it. github.event.workflow_run.id is
      # empty on an explicit workflow_dispatch, run-ledger-consume.mjs treats an empty env var as null,
      # never a literal empty-string upstream id.
      - name: Export upstream run id (workflow_run chaining only)
        run: echo "GITHUB_EVENT_WORKFLOW_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"

      # ── resolve this run's parameters by trigger — see this file's header, "DECISION" and "EVENT
      # CHAINING" ─────────────────────────────────────────────────────────────────────────────────────
      # workflow_dispatch: use the inputs verbatim — export_candidates=true runs ONLY the export half
      # (run_consume=false), everything else runs ONLY the consume half (run_export=false); an operator
      # dispatch is always exactly one deliberate action, unchanged from before this diff. workflow_run
      # (the Source-sweep event chain) runs BOTH halves of the family, unconditionally, per build plan
      # W1.4 item 1: mode is FORCED to plan (apply is dispatch-only, by design — there is no mode input to
      # read from this event anyway); verdicts_file is left BLANK so run-ledger-consume.mjs auto-discovers
      # every committed batch itself (discoverVerdictsFiles) rather than this workflow picking one; limit
      # is RESOLVE_CONSUME_LIMIT (well above the old fetch-bounded default — see this file's header for why
      # a wide consume window is now cheap, no fetch ever happens on this path); export_after is left BLANK
      # so resolveExportAfter auto-resumes past the previous export dispatch's own next_cursor.
      - name: Resolve dispatch parameters
        id: params
        env:
          RESOLVE_CONSUME_LIMIT: '2000' # cheap: this path never fetches (no --allow-api) — see header
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.export_candidates }}" = "true" ]; then
              run_consume="false"
              run_export="true"
            else
              run_consume="true"
              run_export="false"
            fi
            mode="${{ inputs.mode }}"
            limit="${{ inputs.limit }}"
            max_promote="${{ inputs.max_promote }}"
            source_id="${{ inputs.source_id }}"
            verdicts_file="${{ inputs.verdicts_file }}"
            record_only="${{ inputs.record_only }}"
            export_limit="${{ inputs.export_limit }}"
            export_after="${{ inputs.export_after }}"
            # The dedicated chained-apply step below is workflow_run-only (see that step's own comment).
            # A workflow_dispatch's own mode input already reaches the main run-ledger-consume.mjs step
            # directly, so this workflow never runs two consume passes for one dispatch.
            run_apply_chain="false"
          else
            # D26 part g (docs/plans/defect-fix-plan-2026-09-12.md; "no unnecessary runs"): the export step
            # runs ONLY on an explicit workflow_dispatch -- a workflow_run firing never sets run_export.
            run_export="false"
            mode="plan"
            limit="$RESOLVE_CONSUME_LIMIT"
            max_promote="50"
            source_id=""
            verdicts_file=""
            record_only="true"
            export_limit="400"
            export_after=""
            # D26 part g (no empty runs): this chained CONSUME walk only has real work when a committed
            # ledger-verdicts batch's OWN generated_at (schema.json's own field, read directly -- no git
            # history depth needed even under actions/checkout's default shallow clone) is newer than the
            # last run whose config.action=="consume" AND config.mode=="apply" actually ran armed (never
            # merely REQUESTED and disarmed) -- reading each committed harness-run artifact's finished_at
            # directly from the working tree, same no-git-log-depth reasoning. No such batch -> nothing new
            # for the free session-Haiku decider to have classified since the last real apply -> skip.
            last_apply_at="1970-01-01T00:00:00Z"
            if [ -d scripts/harness-runs/ledger-consume ]; then
              for f in scripts/harness-runs/ledger-consume/ledger-consume-run-*.json; do
                [ -f "$f" ] || continue
                action=$(jq -r '.config.action // ""' "$f" 2>/dev/null || echo "")
                run_mode=$(jq -r '.config.mode // ""' "$f" 2>/dev/null || echo "")
                finished=$(jq -r '.finished_at // ""' "$f" 2>/dev/null || echo "")
                if [ "$action" = "consume" ] && [ "$run_mode" = "apply" ] && [ -n "$finished" ] && [ "$finished" \> "$last_apply_at" ]; then
                  last_apply_at="$finished"
                fi
              done
            fi
            newest_verdicts_at=""
            for f in scripts/turns/ledger-verdicts/ledger-verdicts-*.json; do
              [ -f "$f" ] || continue
              gen=$(jq -r '.generated_at // ""' "$f" 2>/dev/null || echo "")
              if [ -n "$gen" ]; then
                if [ -z "$newest_verdicts_at" ] || [ "$gen" \> "$newest_verdicts_at" ]; then newest_verdicts_at="$gen"; fi
              fi
            done
            if [ -n "$newest_verdicts_at" ] && [ "$newest_verdicts_at" \> "$last_apply_at" ]; then
              run_consume="true"
              echo "D26 part g: newest verdicts batch ($newest_verdicts_at) is newer than the last apply ($last_apply_at) -- proceeding."
            else
              run_consume="false"
              echo "::notice::D26 part g (no empty runs): no committed ledger-verdicts batch newer than the last apply ($last_apply_at) -- exiting at once, nothing new to consume."
            fi
            # Lane M2 (2026-09-18, corrected same day by coordinator ruling): the chained apply pass
            # (below) runs whenever the plan pass above has real work, same D26 part g "no empty runs"
            # reasoning, one decision, not a second one to keep in sync. It ARMS ITSELF the moment at
            # least one ledger-verdicts batch is committed (run-ledger-consume.mjs's own isApplyArmed) -
            # this step names no verdicts_file and needs none; auto-discovery is what arms it now. It runs
            # disarmed only on the rare firing where zero batches have ever been committed at all.
            run_apply_chain="$run_consume"
          fi
          echo "run_consume=$run_consume" >> "$GITHUB_OUTPUT"
          echo "run_export=$run_export" >> "$GITHUB_OUTPUT"
          echo "run_apply_chain=$run_apply_chain" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "limit=$limit" >> "$GITHUB_OUTPUT"
          echo "max_promote=$max_promote" >> "$GITHUB_OUTPUT"
          echo "source_id=$source_id" >> "$GITHUB_OUTPUT"
          echo "verdicts_file=$verdicts_file" >> "$GITHUB_OUTPUT"
          echo "record_only=$record_only" >> "$GITHUB_OUTPUT"
          echo "export_limit=$export_limit" >> "$GITHUB_OUTPUT"
          echo "export_after=$export_after" >> "$GITHUB_OUTPUT"
          echo "candidates_path=scripts/_snapshots/ledger-candidates/candidates-${{ github.run_id }}.json" >> "$GITHUB_OUTPUT"

      - name: This run's gates
        run: |
          echo "trigger      = ${{ github.event_name }}"
          echo "run_consume  = ${{ steps.params.outputs.run_consume }}"
          echo "run_export   = ${{ steps.params.outputs.run_export }}"
          echo "run_apply_chain (workflow_run only) = ${{ steps.params.outputs.run_apply_chain }}"
          if [ "${{ steps.params.outputs.run_consume }}" = "true" ]; then
            echo "mode           = ${{ steps.params.outputs.mode }}"
            echo "limit          = ${{ steps.params.outputs.limit }}"
            echo "max_promote    = ${{ steps.params.outputs.max_promote }}"
            echo "source_id      = ${{ steps.params.outputs.source_id }}"
            echo "verdicts_file  = ${{ steps.params.outputs.verdicts_file }}"
            echo "record_only    = ${{ steps.params.outputs.record_only }}"
            echo "NOTE: verdicts_file blank -> auto-discovers EVERY committed ledger-verdicts-*.json batch, and (corrected 2026-09-18, coordinator ruling) auto-discovery ALONE now arms apply too -- isApplyArmed (run-ledger-consume.mjs) arms whenever at least one committed batch exists at all, named or discovered; verdicts_file only narrows WHICH batch(es) a run acts on. apply mints nothing only when zero batches exist anywhere (LEDGER_CONSUME_APPLY_ENABLED is retired, Lane M2 2026-09-18; max_promote is the guard now, bounding how many candidates ONE armed apply run may promote). --allow-api is CLI-only; this workflow never sets it. record_only (default true) mints the would-mint set at record grade with no grounding spend -- see run-intake-cycle.ts."
            if [ "${{ steps.params.outputs.mode }}" = "apply" ] && [ -z "$(ls scripts/turns/ledger-verdicts/ledger-verdicts-*.json 2>/dev/null)" ] && [ -n "${{ steps.params.outputs.verdicts_file }}" ] && [ ! -f "${{ steps.params.outputs.verdicts_file }}" ]; then
              echo "::warning::apply requested but the named verdicts_file does not exist — see run-ledger-consume.mjs's own fail-closed check (exit 4)."
            fi
          fi
          if [ "${{ steps.params.outputs.run_export }}" = "true" ]; then
            echo "export_limit = ${{ steps.params.outputs.export_limit }}"
            echo "export_after = ${{ steps.params.outputs.export_after }}"
            echo "NOTE: export_after blank -> auto-resumes past the previous export dispatch's own next_cursor (resolveExportAfter)."
          fi

      # ── hydrate UNMERGED sibling artifacts so this run's run_id cannot collide ──────────────────────
      # Same run_id collision guard source-sweep.yml carries (see its own comment for the incident this
      # closes): claimRunId numbers the next artifact from what it can see in the checked-out tree, i.e.
      # master, but artifacts land through a PR — a run dispatched before a prior run's PR merged would
      # otherwise claim the same run_id as that unmerged sibling. Runs UNCONDITIONALLY as of Lane
      # LEDGER-CHAIN-2 (2026-09-05) — both the consume path (plan/apply) AND the export path now self-emit
      # a `ledger-consume` family artifact via claimRunId (buildExportRunArtifact, this file's header), so
      # both need the same collision guard, and a workflow_run firing runs BOTH in one job.
      - name: Hydrate unmerged ledger-consume artifacts from sibling branches (run_id collision guard)
        run: |
          git fetch --no-tags origin '+refs/heads/ledger-consume/*:refs/remotes/origin/ledger-consume/*' || true
          : > /tmp/hydrated-artifacts.txt
          for b in $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/ledger-consume/*'); do
            for f in $(git ls-tree -r --full-tree --name-only "$b" -- fsi-app/scripts/harness-runs/ledger-consume/); do
              rel="${f#fsi-app/}"
              if [ ! -e "$rel" ]; then
                mkdir -p "$(dirname "$rel")"
                git show "$b:$f" > "$rel"
                echo "$rel" >> /tmp/hydrated-artifacts.txt
              fi
            done
          done
          echo "hydrated $(wc -l < /tmp/hydrated-artifacts.txt) unmerged ledger-consume file(s) from sibling branches"

      - name: run-ledger-consume.mjs
        if: steps.params.outputs.run_consume == 'true'
        run: |
          args=(--mode "${{ steps.params.outputs.mode }}" --limit "${{ steps.params.outputs.limit }}" \
            --max-promote "${{ steps.params.outputs.max_promote }}" \
            --record-only "${{ steps.params.outputs.record_only }}")
          if [ -n "${{ steps.params.outputs.source_id }}" ]; then
            args+=(--source-id "${{ steps.params.outputs.source_id }}")
          fi
          if [ -n "${{ steps.params.outputs.verdicts_file }}" ]; then
            args+=(--verdicts "${{ steps.params.outputs.verdicts_file }}")
          fi
          node scripts/turns/run-ledger-consume.mjs "${args[@]}"

      # -- run_apply_chain: the CHAINED APPLY PASS (Lane M2, 2026-09-18, build plan section 6.1 row M2,
      # arming corrected the same day by coordinator ruling) -- workflow_run-only (see "Resolve dispatch
      # parameters" above, a workflow_dispatch's own mode input already reaches the step above directly).
      # Runs mode=apply, capped at max_promote=50, in the SAME job right after the plan pass above, closing
      # S2 finding 1 ("the apply half has never fired") for real: this step names NO --verdicts file and
      # needs none - isApplyArmed (run-ledger-consume.mjs) arms whenever at least one committed
      # scripts/turns/ledger-verdicts/*.json batch exists at all, auto-discovered here exactly like the
      # plan pass above discovers the same batches for its own classify decisions. A session lane
      # committing its first verdict batch is what arms this step, no operator flip required; it runs
      # disarmed (plan semantics, config.apply_disarmed:true in its own artifact) only on the rare firing
      # where zero batches have ever been committed. Same source_id (blank = all sources) and record_only
      # as the plan pass above.
      - name: run-ledger-consume.mjs (chained apply after source-sweep, capped)
        if: steps.params.outputs.run_apply_chain == 'true'
        run: |
          node scripts/turns/run-ledger-consume.mjs --mode apply --limit "${{ steps.params.outputs.limit }}" \
            --max-promote 50 --record-only "${{ steps.params.outputs.record_only }}"

      # ── run_export: the export half (see this file's header) ─────────────────────────────────────────
      # --with-text fetches every listed candidate's URL through run-ledger-consume.mjs's OWN buildFetchDoc
      # (no second fetcher, same politeness gap, same timeout) so the file this step writes carries page
      # text a classification lane can read directly — never fetch itself. No classify, no DB write to
      # portal_link_candidates — but (Lane LEDGER-CHAIN-2, 2026-09-05) this mode DOES now self-emit its own
      # `ledger-consume` family harness-run artifact (`config.action:"export"`, buildExportRunArtifact) so
      # the NEXT export dispatch can auto-resume past this one's next_cursor — see this file's header.
      - name: run-ledger-consume.mjs --export-candidates --with-text
        if: steps.params.outputs.run_export == 'true'
        run: |
          args=(--export-candidates "${{ steps.params.outputs.candidates_path }}" --with-text \
            --limit "${{ steps.params.outputs.export_limit }}")
          if [ -n "${{ steps.params.outputs.export_after }}" ]; then
            args+=(--after "${{ steps.params.outputs.export_after }}")
          fi
          node scripts/turns/run-ledger-consume.mjs "${args[@]}"

      # Commit the family's own harness-run artifact(s) (scripts/harness-runs/ledger-consume/**) so
      # whatever this run produced — a consume plan/apply artifact, an export artifact, or (a workflow_run
      # firing, Lane LEDGER-CHAIN-2 2026-09-05) BOTH — survives past the Actions log, same posture
      # corpus-turn.yml / source-sweep.yml apply to their own families. A run normally executes against
      # master, which is typically branch-protected, so this lands on its own branch and opens a PR rather
      # than pushing straight to whatever ref triggered the run.
      - name: Remove hydrated sibling artifacts (they belong to their own branches)
        if: always()
        run: |
          if [ -s /tmp/hydrated-artifacts.txt ]; then xargs -a /tmp/hydrated-artifacts.txt rm -f; fi
          rm -rf scripts/harness-runs/*/.claims

      # ONE commit/PR for whatever this run produced — never two separate branches/pushes in the same job
      # (a workflow_run firing runs run_consume AND run_export together, so a second `git checkout -b` on
      # the SAME branch name would collide if this stayed split in two steps, Lane LEDGER-CHAIN-2 2026-09-05).
      # `git add -f` on the candidates path is required only when run_export produced one: the file is
      # written under scripts/_snapshots/, which .gitignore excludes (line 64) for every OTHER use of that
      # directory — this is the one path in it that must reach origin, because ledger-verdicts/README.md's
      # own reasoning applies here too (a workflow_dispatch reads from origin, and a coordinator fetching a
      # branch needs the same). The harness-runs directory itself is NOT gitignored — a plain `git add`
      # covers both a consume artifact and an export artifact (buildExportRunArtifact writes into the same
      # directory), so no separate `-f` is needed for it.
      - name: Commit this run's ledger-consume artifact(s) and open a PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/harness-runs/ledger-consume
          if [ "${{ steps.params.outputs.run_export }}" = "true" ]; then
            git add -f "${{ steps.params.outputs.candidates_path }}"
          fi
          if git diff --cached --quiet; then
            echo "No new ledger-consume artifact to commit."
            exit 0
          fi
          branch="ledger-consume/${{ github.run_id }}"
          git checkout -b "$branch"
          summary="run ${{ github.run_id }} (${{ github.event_name }})"
          if [ "${{ steps.params.outputs.run_consume }}" = "true" ]; then summary="$summary, consume mode=${{ steps.params.outputs.mode }}"; fi
          if [ "${{ steps.params.outputs.run_export }}" = "true" ]; then summary="$summary, export limit=${{ steps.params.outputs.export_limit }}"; fi
          git commit -m "ledger-consume: $summary"
          # BRANCH-BASE (2026-09-04): re-base the artifact commit onto the current master tip before the push, so a
          # workflow-file change that landed on master mid-run cannot make GitHub refuse the branch (see
          # population-turn.yml's own BRANCH-BASE comment for the failure this fixes).
          git fetch --no-tags --depth=50 origin master
          git rebase --autostash origin/master || { git rebase --abort; echo "::error::artifact commit does not rebase onto origin/master"; exit 1; }
          git push origin HEAD:"$branch"
          {
            printf 'Automated ledger consume (run %s, trigger %s).\n\n' "${{ github.run_id }}" "${{ github.event_name }}"
            if [ "${{ steps.params.outputs.run_consume }}" = "true" ]; then
              printf 'CONSUME, mode: %s\nLimit: %s\nMax promote: %s\nSource id: %s\nVerdicts file: %s (blank = auto-discovered every committed batch, which now also ARMS apply on its own)\n\nApply writes whenever at least one committed ledger-verdicts batch exists (named here or auto-discovered) and this run had a usable verdict for at least one candidate (LEDGER_CONSUME_APPLY_ENABLED is retired, Lane M2 2026-09-18; max_promote bounds how many candidates ONE armed apply run may promote); check config.apply_disarmed, config.max_promote, config.verdicts_files and config.matched/verdict_batches_read in the artifact for exactly what happened.\n\n' \
                "${{ steps.params.outputs.mode }}" "${{ steps.params.outputs.limit }}" "${{ steps.params.outputs.max_promote }}" "${{ steps.params.outputs.source_id }}" "${{ steps.params.outputs.verdicts_file }}"
            fi
            if [ "${{ steps.params.outputs.run_apply_chain }}" = "true" ]; then
              printf 'CHAINED APPLY (after the plan pass above), mode: apply, limit: %s, max_promote: 50, record_only: %s. No --verdicts named by this automatic step; it arms itself off whatever has already been committed under scripts/turns/ledger-verdicts/ and runs disarmed (plan semantics) only when nothing has ever been committed there, see config.apply_disarmed in its own harness-run artifact.\n\n' \
                "${{ steps.params.outputs.limit }}" "${{ steps.params.outputs.record_only }}"
            fi
            if [ "${{ steps.params.outputs.run_export }}" = "true" ]; then
              printf 'EXPORT — --export-candidates --with-text, limit=%s, after=%s (blank = auto-resumed past the previous export'"'"'s own next_cursor).\n\nLands %s: candidate rows from portal_link_candidates (status=candidate), each carrying its already-fetched page text (fetched by run-ledger-consume.mjs'"'"'s own buildFetchDoc — same politeness gap, same timeout a consume pass uses; no second fetcher). A classification lane reading this file must NOT fetch these URLs itself — see the file'"'"'s own note_on_fetched_text and run-ledger-consume.mjs'"'"'s header, "THE DEFECT THIS CLOSES". This dispatch'"'"'s own recorded next_cursor is what the NEXT export dispatch with no explicit export_after will auto-resume from.\n' \
                "${{ steps.params.outputs.export_limit }}" "${{ steps.params.outputs.export_after }}" "${{ steps.params.outputs.candidates_path }}"
            fi
          } > /tmp/pr-body.md
          bash scripts/turns/deliver-artifact-branch.sh "$branch" "Ledger consume: $summary" /tmp/pr-body.md

      # The candidates file lands under scripts/_snapshots/ledger-candidates/, inside the glob below — so
      # an export dispatch is ALSO reachable as a workflow artifact download, on top of the artifact-branch
      # delivery above (both mechanisms, per this file's header).
      - name: Upload scripts/_snapshots as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ledger-consume-snapshots-${{ github.run_id }}
          path: fsi-app/scripts/_snapshots/
          if-no-files-found: ignore
          retention-days: 90
