name: CI

# THE ONE PULL REQUEST WORKFLOW (lane PIPE-1, 2026-10-11; whole-build plan phase B, ruled 2026-10-11; ADR-040 and its
# 2026-10-11 amendment, ADR-047). It replaces eight workflows (discipline, bug-class-guard, build-proof, design-audit,
# migration-proof, rls-persona-matrix, route-and-view-attacks, gate-step-attacks). Measured before: one pull request run
# was 45 billed minutes across eight workflows, `next build` ran twice, and four scope mechanisms answered one question
# (which jobs does this change need). Now there are FIVE jobs and the check names are the job names:
#
#   inputs   every event, about 15 s. Runs the one classifier (fsi-app/.discipline/governance/job-inputs.mjs) ONCE and
#            exposes `code`, `schema`, `app` and `master_build`. The single scope mechanism.
#   static   every pull request. validate-commits (the discipline engine on the range), the consistency backstop, the
#            audit-finding-status gate and the memory gate always; when `code` is true also the discipline unit-test
#            suite and its governance gates, ESLint, the fitness runner (F9 is tsc over the whole app), actionlint,
#            the npm-dependent tests, the goldens, the HARD detector discrimination step and the gate-step attacks.
#   schema   only when migrations, proof scripts, RLS or attack files, the routes, the route guard or the stack action
#            changed. ONE local stack: migration proof (replay, catalog query, pending apply), the RLS persona matrix,
#            the PROOF-4 view and function attacks, then the route attacks.
#   app      only when fsi-app/src, package files, the next config, docs/design or docs/specs changed. The Playwright
#            container image: ONE `next build`, the rendering guard, the design audit (soft) and its forbid attack.
#   master   a push to master only (skipped on a pull request): validate-commits, the consistency backstop, the HARD
#            discrimination step and the next build when its inputs changed. The post-merge check the strict=false
#            branch protection ruling relies on.
#
# ALL FIVE are the required status contexts. A scoped job whose inputs are untouched is SKIPPED at job level, and a
# skipped required context satisfies branch protection; a workflow `paths:` filter does not (a workflow that never
# fires reports nothing and blocks the merge forever, the R22 / 2026-08-12 note of the old discipline.yml).
#
# WHERE THE ROUTE ATTACKS RUN, AND WHY (the brief let the lane choose; the numbers are measured, run 38109713063 and
# its siblings of 2026-10-11): the routes attack needs the local stack for its personas, and the stack is Docker
# (`supabase start`). A container job has no Docker daemon, and `app` is a container job (the Playwright image), so the
# stack cannot start inside it. In `schema` the stack already runs for the migration proof, so the routes attack costs
# only its own steps: the build against the stack (74 s) and the attack (210 s), against a second stack start (86 s),
# replay (27 s) and install (21 s) it would cost anywhere else. The two jobs run in parallel, so the wall time of a
# code pull request is the longer of them. Consequence: the routes inputs (fsi-app/src/app, src/lib/api, src/lib/auth,
# src/proxy.ts) are inputs of `schema`; and a pull request that changes a route builds the app twice (once against the
# stack here, once in `app` with placeholders), which is the price of not starting Docker in a browser container.
#
# THE DESIGN AUDIT IS SOFT (register AUD-SYS-2B: it never gated; design-audit.yml said so itself). It reports and exits 0
# whenever the audit ran, and fails only when the harness cannot run. A workflow_dispatch refreshes the committed
# CI-generated pair (results.json and the audit document, lane DAUDIT-3) and lands the harness-run row of family
# design-audit; a pull request never commits and never holds the service credential (only the dispatch-only step
# below names a secret).
#
# CONCURRENCY. One group per pull request; a superseded pull request run is cancelled (it is pure waste, ADR-047). A
# push to master is never cancelled: every merged commit must be validated on its own, and a blanket true would let a
# second merge cancel the first merge's validation. So the flag is true for pull_request only.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inputs:
    name: inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      schema: ${{ steps.classify.outputs.schema }}
      app: ${{ steps.classify.outputs.app }}
      master_build: ${{ steps.classify.outputs.master_build }}
    steps:
      - name: Checkout (the merge commit and its base parent)
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      # A pull request: the merge commit's diff against its base parent. A push to master: before..after (the before sha
      # is fetched at depth 1; a branch creation or a before that is unreachable falls back to every job true, which
      # fails toward running). A dispatch: every job true.
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CLASSIFIER=fsi-app/.discipline/governance/job-inputs.mjs
          if [ "$EVENT_NAME" = "pull_request" ]; then
            node "$CLASSIFIER" --pr-merge --github-output
          elif [ "$EVENT_NAME" = "push" ] && [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git fetch --no-tags --depth=1 origin "$PUSH_BEFORE"; then
            node "$CLASSIFIER" --range="${PUSH_BEFORE}..${PUSH_SHA}" --github-output
          else
            node "$CLASSIFIER" --all --github-output
          fi

  static:
    name: static
    needs: inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # TIMEOUT 19 MINUTES, FROM MEASUREMENT (coordinator, 2026-10-11: the old unit-test job carried 5 and its suite now takes
    # 4.9 to 5.1 minutes; PR 1100 run 38112370066 was cancelled at 5m0s). The steps this job now runs in series, median
    # seconds from the 2026-10-11 register runs: validate-commits 25, consistency 16, discipline test suite 306 (run
    # 38112370066), fitness job 229, HARD discrimination 38, gate-step attacks 75, about 50 of checkout, node setup and
    # uploads: 739 s, 12.3 minutes. Plus 50 percent headroom: 18.5, rounded to 19. REG-1 (in flight) shrinks the suite.
    timeout-minutes: 19
    # contents read as before, plus actions read so the closure gate can ask the Actions API whether each dispatchable
    # workflow has run (and whether GitHub has it disabled) (lane DORMANT-1).
    permissions:
      contents: read
      actions: read
    steps:
      # fetch-depth 0: the discipline engine resolves origin/<base>..HEAD, the consistency and memory gates read the
      # range, and the closure gate shells out to `git log`, `git blame` and `git merge-base --is-ancestor` to resolve
      # train numbering; a shallow checkout would silently misnumber every train.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      # GATE FIRINGS LOG (lane GATE-4, gate plan doctrine point 6). The rule engine's own output is teed to this file by
      # the engine step below and uploaded on every run, pass or fail. The header line carries the event, branch and
      # commit so a downloaded file is self-describing. docs/runbooks/gate-evaluation.md says how to query it.
      - name: Prepare gate firings log
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BRANCH: ${{ github.head_ref || github.ref_name }}
          GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p fsi-app/.discipline/out
          printf '# gate-firings event=%s branch=%s sha=%s\n' "$GATE_EVENT" "$GATE_BRANCH" "$GATE_SHA" > fsi-app/.discipline/out/rules-ci-firings.log

      - name: Run discipline engine (pull request)
        env:
          # PR head SHA (not the synthetic merge commit) so the engine validates the actual commits the PR proposes.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" || true
          # LANE R23 (2026-10-02): do not build the range here. BASE_REF + PR_HEAD are passed as env vars; runner.mjs
          # resolves the range itself via change-range.mjs's resolveRange() (base = git merge-base origin/BASE PR_HEAD),
          # the SAME function the pre-push hook and F51 resolve through, so this step cannot drift from either (a two-dot
          # range against the base tip read post-fork fixes on master as lines this branch added).
          echo "Validating PR range: base=origin/${BASE_REF} head=${PR_HEAD} (range resolved by runner.mjs via change-range.mjs)"
          node fsi-app/.discipline/runner.mjs \
            --mode=ci 2>&1 | tee -a fsi-app/.discipline/out/rules-ci-firings.log

      # Memory gate (2026-08-13): docs/ is the project memory, and memory that is not committed does not exist for any
      # other session. A change that touches code must, in the same range, touch docs/ops/session-log.md,
      # docs/PROGRAM-BOARD.md or its own docs/ops/session-log.d/YYYY-MM-DD-<slug>.md. The classification lives in ONE
      # script, fsi-app/.discipline/governance/memory-gate.mjs, run by this step and by pre-push step 2b.
      - name: Memory gate - code must not outrun the vault
        if: always()
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" || true
          RANGE="origin/${BASE_REF}...${PR_HEAD}"
          node fsi-app/.discipline/governance/memory-gate.mjs --range="$RANGE"

      # The always-on C3/C4/C5 reality backstop. Rule 014 only fires the consistency runner when a commit TOUCHES
      # docs/inventories/*.md, so this runs it unconditionally, override-aware, via the same primitive rule 014 and the
      # pre-push hook use.
      - name: Consistency runner (pull request) - override-aware
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF" || true
          node fsi-app/.discipline/consistency/override-check.mjs

      # Rule 14: an audit file with an unlabeled finding fails. Strict, and on every pull request including a docs-only one
      # (docs/audits is documentation, so the unit-test suite below, which also runs it, is skipped there).
      - name: Audit finding status gate (strict)
        run: node fsi-app/scripts/verify/audit-finding-status.mjs --strict

      # The backstop states which scoped jobs the pull request skipped, from the same classifier the inputs job ran.
      # It never fails: a classifier fault marks every job touched and prints nothing.
      - name: Report scoped jobs whose inputs are unchanged
        run: node fsi-app/.discipline/governance/job-inputs.mjs --pr-merge --print-unchanged

      # ---- code steps: everything below runs only when the change touches code or a governing doc (the `code` verdict
      # of the classifier, the negation of docs-only-range.mjs's docs-only verdict). The NO-NPM steps run first, before
      # npm ci, exactly as the old no-npm unit-test job did: a test that imported an npm package by accident passes
      # only if node_modules exists, so the suite runs while it does not.

      - name: Run discipline test suite
        # PARITY BY CONSTRUCTION (operator ruling 2026-07-04): the test list lives in ONE place,
        # fsi-app/.discipline/run-test-suite.sh, invoked by this step and by the pre-push hook (step 3).
        if: needs.inputs.outputs.code == 'true'
        env:
          # Lane DORMANT-1: closure-gate.test.mjs's LIVE NEVER-RUN test runs the same live lookup as the gate step below.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash fsi-app/.discipline/run-test-suite.sh

      - name: Test discovery (every tracked test and golden is run by a suite or listed as not a test)
        # Lane GATE-9 (AUD-AT-5 TD-1 to TD-4): lists every tracked file whose name says it is a test and fails on one that
        # no runner executes and that is not named, with a reason, in test-discovery.mjs NOT_A_TEST_ALLOWLIST.
        if: needs.inputs.outputs.code == 'true'
        run: node fsi-app/.discipline/lib/test-discovery.mjs --check-unrun

      - name: Invariant-coverage meta-gate (per-invariant wiring of all 6 skills)
        # Fails if any skill invariant is neither enforced (by a resolving mechanism) nor exempt-with-reason, or if any
        # anchor/baseline drifted. Makes "wired" non-optional.
        if: needs.inputs.outputs.code == 'true'
        run: node fsi-app/.discipline/governance/invariant-coverage.mjs

      - name: Closure gate (never-run steps, stale NEXT rows, writer/reader orphans, lane-contract drift)
        # Lane CLOSURE-GATE, 2026-09-04: nothing else fails when a maintenance.yml step or dispatchable workflow has never
        # run, when a PROGRAM-BOARD.md row stays NEXT with no owning train, when a table created by a recent migration has
        # a writer and no reader, or when the lane-common-contract lacks the plan's done-conditions. Every failure is
        # ratchet-only: see fsi-app/.discipline/governance/closure-gate.mjs's header.
        if: needs.inputs.outputs.code == 'true'
        env:
          # Lane DORMANT-1: the gate's live lookup runs only when a token is present.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node fsi-app/.discipline/governance/closure-gate.mjs

      - name: "Skill-contract drift (U8: skill/code citation pin, F25 W7.1)"
        # Lane W71-WIRE: this `run:` line is also how F25's findDispatchRoots() sees skill-contract-map.mjs as wired.
        if: needs.inputs.outputs.code == 'true'
        run: node fsi-app/.discipline/governance/skill-contract-map.mjs --check

      - name: Orphan-module + dead-export census (B1 Appendix A/B method - reports, never fails)
        # W7.3: deliberately non-gating (orphan-modules.mjs's own header: a REPORT, not a gate; F25 is the CI-failing
        # enforcement). This `run:` line is also how F25 sees orphan-modules.mjs as wired.
        if: needs.inputs.outputs.code == 'true'
        run: node fsi-app/.discipline/governance/orphan-modules.mjs --all

      - name: Install fsi-app deps (DS23 control, npm ci on the clean tree; ESLint, the fitness runner and tsc need it)
        # F9 (build-compiles) runs tsc --noEmit over the whole app, ESLint and eslint-config-next are devDeps, and the
        # selftests import npm packages. This step is also the control of the DS23 attacks at the end of the job.
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: npm ci --prefer-offline --no-audit

      - name: ESLint (max-warnings 0)
        # Lane R7-LINT-CI (closes CF-SEC-10). max-warnings=0 so a warning fails the build the same as an error.
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: npm run lint -- --max-warnings=0

      - name: Run fitness functions
        # Whole-repo glob + read + check across the fitness suite (F9 is tsc --noEmit). Exit 0 = no violations; 1 = at
        # least one violation; 2 = engine error. Violations print file:line with the function id.
        if: needs.inputs.outputs.code == 'true'
        run: node fsi-app/.discipline/fitness/runner.mjs

      - name: Cache actionlint tarball (version-keyed)
        # Lane GATE-4: the pinned release tarball is cached under a key that carries the version, so a version bump is a
        # new key; the step below verifies the sha256 on EVERY run, hit or miss.
        if: needs.inputs.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: /tmp/actionlint.tar.gz
          key: actionlint-v1.7.12-linux-amd64

      - name: actionlint (pinned, checksum-verified) over .github/workflows
        # Lane F52 (invariant RD-77): actionlint is the real workflow linter, pinned to v1.7.12 with its sha256 read from
        # the release checksums file; the shellcheck and pyflakes integrations are switched off (owner lane W-shell).
        if: needs.inputs.outputs.code == 'true'
        run: |
          set -euo pipefail
          SUM="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz"
          if ! echo "$SUM" | sha256sum -c - >/dev/null 2>&1; then
            curl -sSL --retry 3 --retry-all-errors -o /tmp/actionlint.tar.gz \
              https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
            echo "$SUM" | sha256sum -c -
          fi
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color -shellcheck= -pyflakes= .github/workflows/*.yml

      - name: App unit tests requiring npm deps (*.npmtest.mjs)
        # The NAMED exclusion from run-test-suite.sh's no-npm glob: tests importing npm deps run HERE, after npm ci,
        # glob-by-construction, so a new *.npmtest.mjs joins automatically. ONE HOME (lane G2, RD-79): the discovery and
        # command live in fsi-app/.discipline/hooks/lib/run-npmtest-suites.sh, which this step and pre-push call.
        if: needs.inputs.outputs.code == 'true'
        run: sh fsi-app/.discipline/hooks/lib/run-npmtest-suites.sh

      - name: Behavioral goldens (scripts/verify/*.golden.mjs)
        # WIRING-TRUTH FIX (2026-08-09): every golden is run (glob-by-construction in run-goldens.mjs). Pure goldens pass
        # here; LIVE-DB goldens self-skip (exit 2) for want of secrets. A real golden FAIL fails the job.
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: node scripts/verify/run-goldens.mjs

      # The non-answer -> definitive-answer bug class. HARD: the discrimination selftests (deterministic). A regression
      # means the detector lost discrimination or a fixed SSOT regressed. The detector rides the surface registry and
      # drift-check.mjs, which import `typescript`, so these need node_modules.
      - name: HARD - detector discrimination + SSOT units (must pass)
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: |
          node --test \
            scripts/lib/inconclusive-probe.npmtest.mjs \
            scripts/lib/type-consumer-probe.selftest.mjs \
            scripts/lib/reachability.selftest.mjs \
            scripts/lib/entity-gate.selftest.mjs \
            scripts/lib/fetch-now-decision.selftest.mjs \
            scripts/lib/check-sources-decision.selftest.mjs \
            scripts/lib/verification-decision.selftest.mjs \
            scripts/lib/error-drop-probe.selftest.mjs

      # SOFT: the repo-wide scans flag CANDIDATES for review and are REPORT-ONLY (the lexicon still has documented
      # false-positive classes). Kept as one step, not a job: retiring it would leave these four scripts with no
      # workflow root (F25 module liveness). The duplicate migration-prefix scan is report-only by doctrine: Supabase
      # applies by timestamp, so a duplicate prefix is cosmetic and must never gate a merge.
      - name: SOFT - bug-class repo scans (review signals, never fail the build)
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: |
          set -euo pipefail
          node scripts/lib/inconclusive-report.mjs . || true
          node scripts/lib/type-consumer-probe.mjs . || true
          node scripts/lib/error-drop-probe.mjs . || true
          node scripts/verify/migration-number-collision.mjs || true

      # ---- gate-step attacks (lane TESTS-2, CLAUDE.md rule 15): the CI steps that need the installed app, attacked for
      # real. They run LAST: DS24 and F9 write attack files into the tree, which must not exist while the steps above
      # compile or lint it, and the final step removes them on every exit.

      - name: DS23 attacks, npm ci refuses a package.json out of sync with the lockfile and a missing lockfile
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: |
          set -uo pipefail
          scratch="$RUNNER_TEMP/npm-ci-attack"
          rm -rf "$scratch"; mkdir -p "$scratch"
          cp package.json package-lock.json "$scratch"/
          cd "$scratch"
          # attack 1: a dependency added to package.json and not to the lockfile
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.dependencies={...(p.dependencies||{}),"left-pad":"1.3.0"};fs.writeFileSync("package.json",JSON.stringify(p,null,2));'
          if npm ci --dry-run --ignore-scripts --no-audit --no-fund > out-sync.log 2>&1; then
            echo "ATTACK NOT REFUSED: npm ci accepted a package.json that is out of sync with the lockfile"; cat out-sync.log; exit 1
          fi
          grep -q "package.json and package-lock.json" out-sync.log || { echo "npm ci failed, but not for the sync reason:"; cat out-sync.log; exit 1; }
          # attack 2: no lockfile at all
          cp "$GITHUB_WORKSPACE/fsi-app/package.json" package.json
          rm -f package-lock.json
          if npm ci --dry-run --ignore-scripts --no-audit --no-fund > out-nolock.log 2>&1; then
            echo "ATTACK NOT REFUSED: npm ci accepted a missing lockfile"; cat out-nolock.log; exit 1
          fi
          grep -qi "package-lock.json" out-nolock.log || { echo "npm ci failed, but not for the lockfile reason:"; cat out-nolock.log; exit 1; }
          echo "npm ci refused both attacks."

      - name: DS24 control and attacks, the lint command fails a warning and an error and passes a clean file
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: |
          set -uo pipefail
          trap 'rm -f src/lib/__eslint_control.ts src/lib/__eslint_warning_attack.ts src/lib/__eslint_error_attack.ts' EXIT
          printf 'export const eslintControl = 1;\n' > src/lib/__eslint_control.ts
          printf 'export function eslintWarningAttack(): number {\n  const unusedAttackVariable = 1;\n  return 2;\n}\n' > src/lib/__eslint_warning_attack.ts
          printf 'export const eslintErrorAttack: any = 1;\n' > src/lib/__eslint_error_attack.ts
          npm run lint -- --max-warnings=0 src/lib/__eslint_control.ts || { echo "CONTROL FAILED: a clean file does not pass the lint command"; exit 1; }
          if npm run lint -- --max-warnings=0 src/lib/__eslint_warning_attack.ts; then
            echo "ATTACK NOT REFUSED: the lint command passes a file with a warning (max-warnings 0 is not gating)"; exit 1
          fi
          npm run lint -- src/lib/__eslint_warning_attack.ts || { echo "the warning attack was refused WITHOUT the flag, so the flag is not what gates it"; exit 1; }
          if npm run lint -- --max-warnings=0 src/lib/__eslint_error_attack.ts; then
            echo "ATTACK NOT REFUSED: the lint command passes a file with an error"; exit 1
          fi
          echo "The lint command refused both attacks and passed the control."

      - name: F9 on the real app, the clean tree passes and one type error is refused (the compiler half)
        if: needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        env:
          GATE_ATTACK_DISPOSABLE_CHECKOUT: '1'
        run: |
          set -o pipefail
          node scripts/verify/attacks/f9-real-project-attack.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the attack files
        if: always() && needs.inputs.outputs.code == 'true'
        working-directory: fsi-app
        run: rm -f src/lib/__eslint_control.ts src/lib/__eslint_warning_attack.ts src/lib/__eslint_error_attack.ts src/lib/__f9_attack_type_error.ts

      # GATE FIRINGS ARE A CI ARTIFACT (doctrine point 6 of the gate plan). Every run, pass or fail; an absent file uploads
      # nothing and does not fail the job (a docs-only run skips the fitness runner and the governance gates). One
      # artifact per file because upload-artifact v4 refuses a second upload under the same name within one run.
      - name: Upload gate firings (rule engine output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-validate-commits
          path: fsi-app/.discipline/out/rules-ci-firings.log
          if-no-files-found: ignore
          retention-days: 7

      # The governance gates' own firings (lib/gate-firings.mjs, lane GATE-8): the memory gate, the closure gate, the
      # invariant coverage meta-gate, the skill-contract gate and the consistency checks write one shared file here.
      - name: Upload gate firings (governance gates)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-governance-static
          path: fsi-app/.discipline/out/governance-firings.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload gate firings (fitness functions)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-fitness-check
          path: fsi-app/.discipline/out/fitness-firings.json
          if-no-files-found: ignore
          retention-days: 7

  schema:
    name: schema
    needs: inputs
    if: github.event_name == 'pull_request' && needs.inputs.outputs.schema == 'true'
    runs-on: ubuntu-latest
    # Measured per step (runs of 2026-10-11): install 21 s, stack start 86 s, replay 27 s, build 74 s, route attack 210 s.
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    # NEVER TOUCHES PRODUCTION. No secret is referenced in this job, `permissions` is contents: read, and the shared
    # composite action's preflight fails the job on a production host or any forbidden credential name. The attack
    # scripts refuse to run unless the environment is the local stack's and the app's base url is a loopback host.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Note the stack's scratch paths
        run: |
          {
            echo "SC_OUT_DIR=$RUNNER_TEMP/schema-out"
            echo "SC_ENV=$RUNNER_TEMP/schema.env"
            echo "SC_STACK=$RUNNER_TEMP/schema-stack"
            echo "SC_APP_LOG=$RUNNER_TEMP/schema-app.log"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/schema-out"

      - name: Install fsi-app deps
        working-directory: fsi-app
        run: npm ci --prefer-offline --no-audit

      # ONE STACK for everything below. The generic stack steps (psql, the Supabase CLI, an EMPTY stack from the scratch
      # config, the loopback-only env file, the preflight) are the shared composite action.
      - name: Start the local stack and preflight it (shared composite action)
        id: stack
        uses: ./.github/actions/local-stack
        with:
          stack_dir: ${{ env.SC_STACK }}
          env_file: ${{ env.SC_ENV }}

      - name: Attack the stack steps themselves (psql, the CLI, the stack, the env writer and the preflight refuse what they must)
        working-directory: fsi-app
        run: |
          set -euo pipefail
          # AUD-AT-5 OWED-8 (CS5 to CS8): the steps that need Docker and the CLI are exercised for real, then attacked.
          psql --version
          supabase --version
          test "$(stat -c %a "$SC_ENV")" = "600"
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          test "$(psql "$SUPABASE_DB_URL" -tAc 'select 1')" = "1"
          # a status output that names a remote host never becomes an env file
          if printf 'API_URL="https://abc.supabase.co"\nDB_URL="postgresql://postgres:x@db.abc.supabase.co:5432/postgres"\nSERVICE_ROLE_KEY="k"\n' | node scripts/proof/write-local-env.mjs --out "$RUNNER_TEMP/never-written.env"; then
            echo "ATTACK NOT REFUSED: the env writer accepted a remote host"; exit 1
          fi
          test ! -e "$RUNNER_TEMP/never-written.env"
          # the preflight refuses a forbidden credential name (any VERCEL_ variable) and a production host, on top of the otherwise clean local env
          if VERCEL_ATTACK=1 node scripts/proof/preflight.mjs; then echo "ATTACK NOT REFUSED: a forbidden credential name"; exit 1; fi
          if DATABASE_URL='postgresql://postgres:x@db.abc.supabase.co:5432/postgres' node scripts/proof/preflight.mjs; then echo "ATTACK NOT REFUSED: a production database host"; exit 1; fi
          echo "The stack steps refused every attack."

      # A migration is proven by RUNNING it before production sees it (lane MIG-CI, 2026-10-08). The applied set replays
      # (selected through APPLIED-MAP.json), then every migration production has NOT applied is applied in number order,
      # each as one psql run with ON_ERROR_STOP, so the file's own self-check runs exactly as it will at production. A
      # defect in ANY pending migration fails EVERY schema job until that migration reaches production, by design.
      - name: Replay the applied migration files onto the stack
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          node scripts/proof/replay-migrations.mjs --report "$SC_OUT_DIR/replay-report.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # Rule 15 (PROOF-9): the oracle gate's catalog query is proven on a real server on EVERY pull request that reaches the
      # stack. Read-only; loopback only (the script refuses any other host).
      - name: Run the schema catalog query on the replayed stack (proves the gate's SQL on a real server)
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          node scripts/proof/schema-diff.mjs --catalog-only --db-url "$PROOF_DB_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply every pending migration on the stack (each file's own self-check runs here first)
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          node scripts/proof/apply-pending-migrations.mjs --apply --report "$SC_OUT_DIR/apply-report.json" | tee -a "$GITHUB_STEP_SUMMARY"

      # The RLS attack matrix (lane TESTS-1): SELECT, INSERT, UPDATE, DELETE and TRUNCATE on EVERY public base table as each
      # of four personas, inside a transaction that is always rolled back, then four seeded-row attacks in both directions.
      - name: Run the RLS persona matrix (every public table by four personas by five commands)
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          node scripts/verify/attacks/rls-persona-matrix.mjs --out-dir "$SC_OUT_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attack the views and the system-only functions (probes A, B and C of AUD-AT-1)
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          node scripts/verify/attacks/rls-view-function-attacks.mjs --out-dir "$SC_OUT_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run the definer and count RPC attacks on a fixture set with real memberships (migrations 361 and 371)
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          node scripts/proof/attacks/run-attacks.mjs --out-dir "$SC_OUT_DIR" --only sec4-definer-class-d-anon-refused,sec4-definer-class-a-authenticated-refused,sec4-definer-class-c-anon-control,sec4-accept-invitation-keeps-role,s8-c-count-rpcs-membership-gate | tee -a "$GITHUB_STEP_SUMMARY"

      # The routes attack (lane TESTS-2): the app is built and started with `next start` against the stack, four signed-in
      # personas are minted through the stack's own auth service, and one request per route method per persona is sent
      # (the 153 methods of the AT2 register).
      - name: Build the app against the stack (the public Supabase variables are inlined at build time)
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          npx next build 2>&1 | tail -n 40

      - name: Start the app with next start on a loopback port and wait for it to answer
        working-directory: fsi-app
        run: |
          . "$SC_ENV"
          nohup npx next start -H 127.0.0.1 -p 3100 > "$SC_APP_LOG" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/schema-app.pid"
          if ! curl --silent --show-error --output /dev/null --retry 60 --retry-delay 2 --retry-connrefused --max-time 10 http://127.0.0.1:3100/api/version; then
            echo "The app did not answer on 127.0.0.1:3100. Last lines of its log:"
            tail -n 40 "$SC_APP_LOG"
            exit 1
          fi
          echo "The app answers on 127.0.0.1:3100."

      - name: Attack every route method as anon, the viewer, the other-org member, the org member and the platform admin
        working-directory: fsi-app
        run: |
          set -o pipefail
          . "$SC_ENV"
          node scripts/proof/preflight.mjs
          # The local stack runs with [auth.email] enable_signup = false, so the auth service refuses every email password
          # sign-in (422); the persona tokens are minted with the stack's own JWT secret, read from its status output here
          # (the stack is loopback-only and disposable) and masked in the log. It is passed to the one script that needs it.
          jwt_secret="$(cd "$SC_STACK" && supabase status -o env | sed -n 's/^JWT_SECRET=//p' | tr -d '"')"
          test -n "$jwt_secret"
          echo "::add-mask::$jwt_secret"
          export ROUTE_PERSONA_JWT_SECRET="$jwt_secret"
          node scripts/verify/attacks/routes-attacked.mjs --base-url http://127.0.0.1:3100 --out-dir "$SC_OUT_DIR" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the schema reports (counts, table names, route paths, personas, status codes, outcome classes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-report
          path: ${{ runner.temp }}/schema-out
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop the app, stop the local stack and delete the env file
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/schema-app.pid" ]; then kill "$(cat "$RUNNER_TEMP/schema-app.pid")" 2>/dev/null || true; fi
          if [ -d "$SC_STACK" ]; then (cd "$SC_STACK" && supabase stop --no-backup) || true; fi
          rm -f "$SC_ENV"

  app:
    name: app
    needs: inputs
    if: (github.event_name == 'pull_request' && needs.inputs.outputs.app == 'true') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The one write permission in the file, for the workflow_dispatch commit-back step below. The pull_request path never
    # uses it: the commit-back step is guarded to workflow_dispatch (a fork pull request token is read-only whatever is
    # declared here). Nothing else in this file may grant a write permission.
    permissions:
      contents: write
    # CONTAINER, NOT AN INSTALL (lane GATE-6, 2026-10-08). The job runs in the official Playwright image, so chromium and
    # its OS libraries are already present and `playwright install --with-deps` is not run at all (four rendering guard
    # runs were cancelled at the 10 minute limit while the install stalled on apt downloads). The image tag below is the
    # ONE place the Playwright version is written, for the rendering guard and the design audit alike: the install step
    # reads it back out of this file, so the npm package and the image's browsers cannot drift.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    # A container job's steps run under `sh -e` (dash) by default, which has no `-o pipefail`; the image has bash.
    defaults:
      run:
        shell: bash
    # TIMEOUT 25 MINUTES. The guard run itself is median 231 s, p90 433 s, max 604 s (GATE-4); the design audit measured
    # 2 min 37 s; the build 80 to 104 s; checkout and install under a minute. 25 leaves headroom without letting a stall
    # run unnoticed. The per-check timeouts inside the guard are untouched.
    timeout-minutes: 25
    steps:
      # DEPTH 1, NO EXTRA REF FETCH (lane GATE-4): the oracle of the exemption lists fails closed on an unknown wave.
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Trust the workspace for git (the container user does not own the checkout)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install the Playwright npm package matching the image (browsers come from the image)
        run: |
          set -euo pipefail
          version="$(sed -n 's|^ *image: mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*$|\1|p' .github/workflows/ci.yml)"
          test -n "$version"
          echo "playwright npm package: $version"
          cd fsi-app
          npm install --no-save "playwright@${version}" --no-audit --no-fund

      # CLOSES F34's NAMED RESIDUAL (the 2026-09-02 production incident: a module-scope readFileSync reachable from every
      # page's import graph, passed every gate that runs under plain Node). `next build` (Turbopack, the Next 16 default
      # and what a Vercel deploy runs) builds the page graph the way production does. ONE build for the whole job. The
      # public Supabase variables are PLACEHOLDERS, deliberately not real secrets: a syntactically valid https URL and a
      # non-empty string satisfy the client constructor, every data path is fail-soft server-side, and no repository
      # secret is pulled into a job that runs on every pull request.
      - name: next build - the actual bundler, the actual page graph
        working-directory: fsi-app
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://build-proof-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'build-proof-placeholder-anon-key'
        run: npx next build

      # REQUIRED (lane GATE-4). The overflow leg needs a REAL layout engine (scrollWidth is all-zero in jsdom), so this
      # renders the extreme-data fixtures at every app breakpoint tier and the UX smoke slot mounts the real row
      # components at a phone width (RD-60). The pure detector core is ALSO unit-proven red-then-green in the no-npm suite.
      - name: Run rendering guard (fixtures x breakpoint tiers, real layout measurement)
        working-directory: fsi-app
        run: |
          set -euo pipefail
          start="$(date +%s)"
          status=0
          node .discipline/rendering/run-rendering-guard.mjs || status=$?
          line="guard run: $(( $(date +%s) - start )) s"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # THE DESIGN AUDIT, SOFT BY DESIGN (lane DAUDIT-2). `npm run audit:design` mounts the real components in a real
      # browser and compares every value a spec states against getComputedStyle. The audit REPORTS; it does not gate. A
      # non-matching row is a finding for a review lane, and many rows are open DESIGN CHANGES OWED (CLAUDE.md rule 20), so
      # the job exits 0 whenever the audit RAN. It fails only when the HARNESS cannot run: the generator exits non-zero, or
      # it produced no results.json or audit document (both are deleted first, so a stale file can never pass for fresh
      # output). It runs whether or not the guard passed, so one run reports both.
      - name: Run the design audit (the generator reports, it never gates)
        if: ${{ !cancelled() }}
        working-directory: fsi-app
        run: |
          set -euo pipefail
          results=".discipline/rendering/audit/results.json"
          document="../docs/design/handoff-2026-09-06/AUDIT-2026-09-07.md"
          rm -f "$results" "$document"
          # Stamped into results.json and the audit document as generated_on.container_image. The job context does not
          # expose the container image, so it is read out of this file with the install step's own pattern.
          AUDIT_CONTAINER_IMAGE="$(sed -n 's|^ *image: \(mcr\.microsoft\.com/playwright:v[0-9][0-9.]*-.*\)$|\1|p' ../.github/workflows/ci.yml)"
          test -n "$AUDIT_CONTAINER_IMAGE"
          AUDIT_HEAD="$(git rev-parse --short HEAD)"
          AUDIT_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          export AUDIT_HEAD AUDIT_BRANCH AUDIT_CONTAINER_IMAGE
          npm run audit:design
          test -s "$results"
          test -s "$document"

      # Reads the file the generator just wrote and states it. It never exits non-zero for a finding. It fails in two
      # cases, both the harness unable to run: results.json cannot be read, or its errors list is not empty (a spec file
      # whose mount threw; the generator itself exits 0 for that, so this step is where it fails).
      - name: Write the counts and the non-matching row ids to the job summary
        if: ${{ !cancelled() }}
        working-directory: fsi-app
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const results = JSON.parse(readFileSync('.discipline/rendering/audit/results.json', 'utf8'));
          const counts = { MATCH: 0, MISMATCH: 0, 'NOT BUILT': 0, 'NOT IN SPEC': 0 };
          const nonMatching = [];
          results.rows.forEach((row, index) => {
            counts[row.status] = (counts[row.status] ?? 0) + 1;
            if (row.status !== 'MATCH') nonMatching.push(`${row.spec}#${index}`);
          });
          const lines = [
            '## Design audit (soft: this job reports, it does not gate)',
            '',
            `Specs run: ${results.specs.length}. Checks: ${results.rows.length}. Run at: ${results.runAt}.`,
            '',
            '| Status | Rows |',
            '|---|---|',
            `| MATCH | ${counts.MATCH} |`,
            `| MISMATCH | ${counts.MISMATCH} |`,
            `| NOT BUILT | ${counts['NOT BUILT']} |`,
            `| NOT IN SPEC | ${counts['NOT IN SPEC']} |`,
            '',
            `Harness errors: ${results.errors.length}.`,
          ];
          for (const e of results.errors) lines.push(`- \`${e.spec}\`: ${e.message}`);
          lines.push('', `Non-matching rows (${nonMatching.length}), as \`<spec id>#<row index>\`:`, '');
          lines.push(nonMatching.length === 0 ? 'None.' : nonMatching.map((id) => `\`${id}\``).join(', '));
          lines.push('', 'The full record is the artifact design-audit-results (results.json and the audit document).', '');
          const out = lines.join('\n');
          console.log(out);
          if (process.env.GITHUB_STEP_SUMMARY) appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${out}\n`);
          if (results.errors.length > 0) {
            console.log(`::error::${results.errors.length} spec file(s) hit a harness error; see the summary`);
            process.exitCode = 1;
          }
          NODE

      # WORKFLOW_DISPATCH ONLY (lane DAUDIT-3). Commits results.json and the audit document back to the dispatched ref, so
      # the committed oracle is the one CI generated (a computed style depends on the machine that measured it). The
      # document is staged here and results.json is staged by the script, so the pair lands as ONE commit. A protected
      # ref (master) degrades to a warning inside the script and never fails the run. It runs only after the summary step,
      # so a run whose harness errored never commits its partial result. To refresh the pair:
      # `gh workflow run ci.yml --ref <branch>`, then pull.
      - name: Commit the audit result back to the dispatched ref (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        working-directory: fsi-app
        run: |
          set -euo pipefail
          git add "../docs/design/handoff-2026-09-06/AUDIT-2026-09-07.md"
          bash scripts/maintenance/commit-worklist-artifact.sh             "$GITHUB_REF_NAME"             "${{ github.run_id }}"             ".discipline/rendering/audit/results.json"             "design audit results (CI-generated)"

      - name: Upload the audit result (results.json and the audit document)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-audit-results
          path: |
            fsi-app/.discipline/rendering/audit/results.json
            docs/design/handoff-2026-09-06/AUDIT-2026-09-07.md
          if-no-files-found: ignore
          retention-days: 7

      # Lane TESTS-2 (CLAUDE.md rule 15): the audit's D-M4 forbid rows attacked in this container's chromium. A forbid that
      # matches nothing reports MATCH forever; this step proves the selector fires on a row with two absence tokens and
      # stays quiet on a row with one. It follows the upload so a red attack never loses the audit artifact, and it is a
      # real gate: it exits non-zero when a forbid is vacuous or blanket, and when the harness cannot run it.
      - name: Attack the D-M4 forbid rows (a forbid that matches nothing is vacuous)
        working-directory: fsi-app
        run: node scripts/verify/attacks/forbid-fires-attack.mjs

      # Lane DORMANT-1 (CLAUDE.md rule 17): this workflow records its own harness run, family design-audit. Only an explicit
      # dispatch lands a row: a pull request job must not hold the production service credential, so the two secrets are
      # named in this one step and nowhere else in the file, and the step is skipped on every pull request.
      - name: Land the design-audit harness-run artifact into harness_runs (workflow_dispatch only)
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        working-directory: fsi-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/lib/emit-workflow-run-artifact.mjs --family design-audit --workflow ci.yml --results "${{ job.status }}" --land

  master:
    name: master
    needs: inputs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # full history so the commit range before..after resolves
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Prepare gate firings log
        env:
          GATE_EVENT: ${{ github.event_name }}
          GATE_BRANCH: ${{ github.ref_name }}
          GATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p fsi-app/.discipline/out
          printf '# gate-firings event=%s branch=%s sha=%s\n' "$GATE_EVENT" "$GATE_BRANCH" "$GATE_SHA" > fsi-app/.discipline/out/rules-ci-firings.log

      - name: Run discipline engine (push to master)
        env:
          COMMIT_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # GATE-9 (AUD-AT-5 VC-2): validate every commit the push brought in (before..after), not its head. A branch-creation
          # push (no before) or a before that is no longer reachable (a force push) falls back to the head commit.
          if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            echo "Validating commit $COMMIT_SHA (no usable before sha)"
            node fsi-app/.discipline/runner.mjs --mode=ci --commit="$COMMIT_SHA" 2>&1 | tee -a fsi-app/.discipline/out/rules-ci-firings.log
          else
            echo "Validating push range ${PUSH_BEFORE}..${COMMIT_SHA}"
            node fsi-app/.discipline/runner.mjs --mode=ci --range="${PUSH_BEFORE}..${COMMIT_SHA}" 2>&1 | tee -a fsi-app/.discipline/out/rules-ci-firings.log
          fi

      # BLOCKING ON A PUSH AS ON A PULL REQUEST (lane GATE-9, AUD-AT-5 VC-3): a warning on the protected branch is a gate
      # that cannot fail. The push range is before..after, so a unit pushed together satisfies it.
      - name: Memory gate - code must not outrun the vault
        if: always()
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$PUSH_BEFORE" in
            0000000000000000000000000000000000000000|"")
              RANGE="${PUSH_SHA}~1..${PUSH_SHA}" ;;   # branch-creation push: no before
            *)
              RANGE="${PUSH_BEFORE}..${PUSH_SHA}" ;;
          esac
          node fsi-app/.discipline/governance/memory-gate.mjs --range="$RANGE"

      - name: Consistency runner (push to master) - override-aware
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node fsi-app/.discipline/consistency/override-check.mjs --commit="$COMMIT_SHA"

      - name: Install fsi-app deps
        working-directory: fsi-app
        run: npm ci --prefer-offline --no-audit

      - name: HARD - detector discrimination + SSOT units (must pass)
        working-directory: fsi-app
        run: |
          node --test \
            scripts/lib/inconclusive-probe.npmtest.mjs \
            scripts/lib/type-consumer-probe.selftest.mjs \
            scripts/lib/reachability.selftest.mjs \
            scripts/lib/entity-gate.selftest.mjs \
            scripts/lib/fetch-now-decision.selftest.mjs \
            scripts/lib/check-sources-decision.selftest.mjs \
            scripts/lib/verification-decision.selftest.mjs \
            scripts/lib/error-drop-probe.selftest.mjs

      # The dynamic gate for F34's class, on the pushed commit: a real `next build` when the push touched its inputs
      # (job-inputs.mjs master_build, the old build-proof `paths:` set). Placeholder public variables, see the app job.
      - name: next build - the actual bundler, the actual page graph
        if: needs.inputs.outputs.master_build == 'true'
        working-directory: fsi-app
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://build-proof-placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'build-proof-placeholder-anon-key'
        run: npx next build

      - name: Upload gate firings (rule engine output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-firings-validate-commits
          path: fsi-app/.discipline/out/rules-ci-firings.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload gate firings (governance gates)
        if: always()
