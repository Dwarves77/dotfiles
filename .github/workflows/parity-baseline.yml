name: Parity baseline

# Lane H-2 (PART2-AGENT-PLAN-2026-10-15 section 7). Captures the EXISTING site, read-only, for the rebuild's parity gate:
# every route in fsi-app/tests/parity/routes.json at 1280x900 and 375x812, a full-page PNG and an accessibility JSON per
# route and viewport, uploaded as one artifact. Dispatched by hand only, once per baseline. Not a required check.
#
# Inputs
#   base_url  optional. Origin to capture. When non-empty it overrides the APP_URL secret. This is how the same job
#             captures the NEW tree's preview deployments later, so the smoke credentials never leave this repo.
#   label     optional, default "baseline". The artifact is named parity-<label>-<sha>. Letters, digits, dot, underscore
#             and hyphen only (checked in preflight; anything else would fail at upload, after the capture ran).
#
# Required repository secrets, unless base_url is given (same names as live-smoke.yml, never printed):
#   APP_URL              origin of the deployment to capture, for example https://carosledge.com
#   LIVE_SMOKE_EMAIL     the dedicated read-only smoke account
#   LIVE_SMOKE_PASSWORD  that account's password
# The artifact contains the smoke account's signed-in page text (lists, names, figures). Retention is 30 days.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Origin to capture (https://...). Empty uses the APP_URL secret.'
        required: false
        default: ''
        type: string
      label:
        description: 'Artifact label: parity-<label>-<sha>. Letters, digits, dot, underscore, hyphen only.'
        required: false
        default: 'baseline'
        type: string

permissions:
  contents: read

jobs:
  parity-baseline:
    name: Parity baseline
    runs-on: ubuntu-latest
    # Same container as live-smoke.yml: chromium and its OS libraries come from the image, so no browser install runs.
    # The tag is the ONE place the Playwright version is written in this file; the install step reads it back out.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30
    env:
      APP_URL: ${{ inputs.base_url || secrets.APP_URL }}
      LABEL: ${{ inputs.label || 'baseline' }}
      LIVE_SMOKE_EMAIL: ${{ secrets.LIVE_SMOKE_EMAIL }}
      LIVE_SMOKE_PASSWORD: ${{ secrets.LIVE_SMOKE_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Trust the workspace for git (the container user does not own the checkout)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: fsi-app/package-lock.json

      - name: Preflight (target and secrets, fails fast, nothing installed yet)
        run: |
          test -n "$APP_URL" || { echo "neither the base_url input nor the APP_URL secret is set"; exit 1; }
          [[ "$LABEL" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "label must be letters, digits, dot, underscore or hyphen"; exit 1; }
          test -n "$LIVE_SMOKE_EMAIL" || { echo "LIVE_SMOKE_EMAIL secret is not set"; exit 1; }
          test -n "$LIVE_SMOKE_PASSWORD" || { echo "LIVE_SMOKE_PASSWORD secret is not set"; exit 1; }

      - name: Install the Playwright npm package matching the image (browsers come from the image)
        run: |
          version="$(sed -n 's|^ *image: mcr\.microsoft\.com/playwright:v\([0-9][0-9.]*\)-.*$|\1|p' .github/workflows/parity-baseline.yml)"
          test -n "$version"
          echo "playwright npm package: $version"
          cd fsi-app
          npm install --no-save "playwright@${version}" --no-audit --no-fund

      - name: Capture parity baseline (read-only)
        run: node fsi-app/tests/parity/capture.mjs --base "$APP_URL" --out parity-out

      - name: Upload parity baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ inputs.label || 'baseline' }}-${{ github.sha }}
          path: parity-out
          if-no-files-found: warn
          retention-days: 30
