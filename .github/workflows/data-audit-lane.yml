name: Data-audit lane

# Nightly CI-with-secrets run of every LIVE-DATA audit (the ones the secret-less pre-push meta-gate
# cannot run because they need DB credentials). Moves detection of corpus/data drift off the operator:
#   one-tier-per-host · claims-tier · substrate-agreement · vocab-sync · orphan-source ·
#   quarantine-disposition · unregistered-span-host (hard) + skill-conformance (soft).
# A hard failure fails the job; with notifications on (Repo -> Settings -> Notifications, or a required
# check), the operator is told. Manual run via the Actions tab (workflow_dispatch).
#
# SECRETS (repository secrets; never echoed): SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_SUPABASE_URL,
# SUPABASE_DB_PASSWORD. Fork-PR isolation: this lane runs only on schedule + manual dispatch (no
# pull_request trigger), so a fork PR can never read these secrets (and GitHub withholds secrets from
# fork-PR runs by default regardless).

on:
  # AUDIT LANE STILL STOPPED — BUILD MODE (operator ruling 2026-08-11, restated: "i dont want nightly scans
  # right now, we are building the system, this is build mode"). The lane is now FIXED and PROVEN GREEN, but
  # fixed is not the same as scheduled, and the schedule is the operator's call, not a consequence of the fix.
  #
  # HISTORY, so the next reader does not have to reconstruct it: this lane failed on EVERY run from #37
  # through #65 — twenty-nine consecutive, last green #36 — and was STOPPED on 2026-08-11. The diagnosis
  # (docs/audits/data-audit-lane-diagnosis-2026-08-11.md) split those 18 failures into nine REAL drift
  # findings and nine lane-wiring failures. All three halves are now resolved:
  #   - DRIFT: zeroed by deterministic remediation (PR #443), and re-confirmed IN CI by the audits in run #66;
  #   - WIRING: fixed (PR #444 — guarded .env.local loads + ONE shared pg resolver, scripts/lib/pg-conn.mjs,
  #     using the secrets this job already injects; no new secret);
  #   - HARNESS: run #66, the lane's first honest execution, exposed four audit-harness defects and two REAL
  #     defects (three inert reconciler grants -> migration 257; a phantom `notes` column write in
  #     source-growth.ts that PostgREST was silently rejecting whole-row). All fixed in PR #445.
  # Dispatch run #67 was the first FULLY GREEN run since #36: zero hard failures, Layer C block-state
  # resolved by the lane's own mechanism.
  #
  # SO THE LANE IS READY, AND DELIBERATELY UNSCHEDULED. Every audit stays runnable on demand via the Actions
  # tab (workflow_dispatch) and on the command line. Re-arming is ONE uncommented block below, a deliberate
  # human act for when the build phase ends — not something a green run earns on its own.
  #
  # schedule:
  #   - cron: '0 6 * * *'   # 06:00 UTC nightly — STOPPED 2026-08-11, stays stopped during build mode
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  data-audit-lane:
    name: Live-data audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: fsi-app/package-lock.json

      - name: Install fsi-app deps (jiti + pg + supabase-js used by the audits)
        working-directory: fsi-app
        run: npm ci --prefer-offline --no-audit

      - name: Run the data-audit lane
        working-directory: fsi-app
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: node scripts/verify/run-data-audit-lane.mjs
